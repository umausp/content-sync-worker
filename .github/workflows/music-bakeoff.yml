name: music-bakeoff

# CPU bake-off: ACE-Step 1.5 turbo (DiT only) vs Stable Audio 3 small-music, same 4 live slot moods,
# plus the current production engine (baseline) and Meta Audiobox Aesthetics scores for every clip.
# Briefs come from tools/music_bakeoff/prompts.json. Clips are uploaded as artifacts only (never
# committed). Jobs: gen (8) + baseline (4) -> score -> collect (results.md + AES tables).

run-name: music-bakeoff ${{ github.event.inputs.seconds || '120' }}s seed ${{ github.event.inputs.seed || '42' }}

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Clip length in seconds (max 120)'
        type: string
        default: '120'
        required: false
      seed:
        description: 'Generation seed'
        type: string
        default: '42'
        required: false
  push:
    branches: [feat/music-bakeoff]
    paths:
      - 'tools/music_bakeoff/**'
      - '.github/workflows/music-bakeoff.yml'

permissions:
  contents: read

env:
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF_HUB_ENABLE_HF_TRANSFER: 0

jobs:
  gen:
    runs-on: ubuntu-24.04
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        model: [ace, sa3]
        mood: [focus, unwind, sleep, slowmorning]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | sed -n 1p

      # ---------------- ACE-Step 1.5 (DiT only) ----------------
      - name: ACE clone and pin
        if: matrix.model == 'ace'
        run: |
          set -euo pipefail
          git clone https://github.com/ace-step/ACE-Step-1.5 ace
          git -C ace checkout ca1e85fe9430179831e6bc6be790c332190a3866
          git -C ace rev-parse HEAD

      - name: ACE install
        if: matrix.model == 'ace'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.10.0 torchaudio==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e ace
          python -m pip install "transformers>=4.51.0,<4.58.0" "diffusers>=0.37.0" scipy soundfile loguru einops accelerate diskcache numba vector-quantize-pytorch "torchao>=0.16.0,<0.17.0" toml modelscope pytorch-wavelets pywavelets "huggingface_hub[cli]"
          python -c "import inspect, acestep.handler, acestep.inference; print('ace import ok')"

      - name: ACE weights (DiT, VAE, text encoder; no 5Hz LM)
        if: matrix.model == 'ace'
        run: |
          set -euo pipefail
          hf download ACE-Step/Ace-Step1.5 --local-dir ace/checkpoints --exclude "acestep-5Hz-lm-1.7B/*"
          du -sh ace/checkpoints

      # ---------------- Stable Audio 3 small-music ----------------
      - name: SA3 clone and pin
        if: matrix.model == 'sa3'
        run: |
          set -euo pipefail
          git clone https://github.com/Stability-AI/stable-audio-3 sa3
          git -C sa3 checkout 77e0398c26f7d22d801ec1bb036307e8b231f741
          git -C sa3 rev-parse HEAD

      - name: SA3 install
        if: matrix.model == 'sa3'
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-deps -e sa3
          python -m pip install "einops>=0.8.2" "einops-exts>=0.0.4" "numpy>=2.2.6" packaging safetensors tqdm "huggingface-hub>=1.7.1" "transformers>=5.8.0" soundfile sentencepiece
          python -c "from stable_audio_3 import StableAudioModel; print('sa3 import ok')"

      # ---------------- Generate ----------------
      - name: Generate ${{ matrix.model }} ${{ matrix.mood }}
        env:
          UPSTREAM_COMMIT: ${{ matrix.model == 'ace' && 'ca1e85fe9430179831e6bc6be790c332190a3866' || '77e0398c26f7d22d801ec1bb036307e8b231f741' }}
          SECONDS_IN: ${{ github.event.inputs.seconds || '120' }}
          SEED_IN: ${{ github.event.inputs.seed || '42' }}
        run: |
          set -euo pipefail
          mkdir -p out
          if [ "${{ matrix.model }}" = "ace" ]; then
            python tools/music_bakeoff/gen_ace.py --repo ace --mood "${{ matrix.mood }}" --prompts tools/music_bakeoff/prompts.json --out out --seed "$SEED_IN" --seconds "$SECONDS_IN"
          else
            python tools/music_bakeoff/gen_sa3.py --mood "${{ matrix.mood }}" --prompts tools/music_bakeoff/prompts.json --out out --seed "$SEED_IN" --seconds "$SECONDS_IN"
          fi
          ls -la out

      # ---------------- Encode: two-pass loudnorm, 44.1 kHz stereo MP3 192k ----------------
      - name: Encode mp3 (two-pass loudnorm)
        env:
          NAME: ${{ matrix.model }}_${{ matrix.mood }}
          TARGET_I: ${{ matrix.mood == 'sleep' && '-18' || '-14' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, re, subprocess
          name = os.environ["NAME"]
          tgt = os.environ["TARGET_I"]
          wav, mp3, js = f"out/{name}.wav", f"out/{name}.mp3", f"out/{name}.json"
          # pass 1: measure
          r1 = subprocess.run(
              ["ffmpeg", "-hide_banner", "-nostats", "-i", wav,
               "-af", f"loudnorm=I={tgt}:TP=-1:LRA=11:print_format=json", "-f", "null", "-"],
              capture_output=True, text=True, check=True)
          blobs = re.findall(r"\{[^{}]*\}", r1.stderr)
          st = json.loads(blobs[-1])
          print(f"[bakeoff] input {name}: I={st['input_i']} LUFS  LRA={st['input_lra']}  TP={st['input_tp']} dBTP  target I={tgt}")
          # pass 2: apply linear gain with measured values
          af = (f"loudnorm=I={tgt}:TP=-1:LRA=11:measured_I={st['input_i']}:measured_TP={st['input_tp']}:"
                f"measured_LRA={st['input_lra']}:measured_thresh={st['input_thresh']}:"
                f"offset={st['target_offset']}:linear=true")
          subprocess.run(
              ["ffmpeg", "-hide_banner", "-y", "-i", wav, "-af", af,
               "-ar", "44100", "-ac", "2", "-c:a", "libmp3lame", "-b:a", "192k", mp3],
              check=True)
          # record measured input loudness for results.md, then drop the wav
          meta = json.load(open(js))
          meta.update({"input_lufs": float(st["input_i"]), "input_lra": float(st["input_lra"]),
                       "input_tp": float(st["input_tp"]), "target_lufs": float(tgt)})
          json.dump(meta, open(js, "w"), indent=2)
          os.remove(wav)
          print(f"[bakeoff] wrote {mp3}")
          PY
          ls -la out

      - name: Upload clip artifact
        uses: actions/upload-artifact@v4
        with:
          name: clip-${{ matrix.model }}-${{ matrix.mood }}
          path: |
            out/*.mp3
            out/*.json
          retention-days: 7
          if-no-files-found: error

  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        mood: [focus, unwind, sleep, slowmorning]
    steps:
      - name: Checkout pipeline (private, main)
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true

      - name: Render setup (cached)
        uses: ./.github/actions/render-setup
        with:
          tts-pip: ''
          apt-packages: 'ffmpeg librsvg2-bin fonts-dejavu fonts-noto-core fluidsynth fluid-soundfont-gm'
          voice-cache-path: '~/.cache/huggingface'
          voice-cache-key: 'hf-kokoro-m2m100-v1'

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | sed -n 1p

      - name: build_mix audio-only (current engine, slot ${{ matrix.mood }})
        run: |
          set -euo pipefail
          export SHORTS_STAMP=$(date -u +%Y%m%dT%H%M)
          start=$(date +%s)
          node shorts/music_mix/build_mix.mjs fi --minutes 4 --audio-only --out "$RUNNER_TEMP/base" --slot "${{ matrix.mood }}" 2>&1 | tee "$RUNNER_TEMP/build.log"
          end=$(date +%s)
          echo "BUILD_S=$((end-start))" >> "$GITHUB_ENV"
          grep -E '\[music_mix\] engine:' "$RUNNER_TEMP/build.log"
          ls -la "$RUNNER_TEMP/base"

      - name: Cut 120 s from 60 s, encode mp3 (two-pass loudnorm), write json
        env:
          MOOD: ${{ matrix.mood }}
          TARGET_I: ${{ matrix.mood == 'sleep' && '-18' || '-14' }}
        run: |
          set -euo pipefail
          mkdir -p out
          python3 - <<'PY'
          import json, os, re, subprocess
          mood = os.environ["MOOD"]
          tgt = os.environ["TARGET_I"]
          src = os.path.join(os.environ["RUNNER_TEMP"], "base", "mix.m4a")
          name = f"baseline_{mood}"
          wav, mp3, js = f"out/{name}.wav", f"out/{name}.mp3", f"out/{name}.json"
          subprocess.run(["ffmpeg", "-hide_banner", "-y", "-ss", "60", "-t", "120", "-i", src,
                          "-ac", "2", "-ar", "44100", "-c:a", "pcm_s16le", wav], check=True)
          # pass 1: measure
          r1 = subprocess.run(
              ["ffmpeg", "-hide_banner", "-nostats", "-i", wav,
               "-af", f"loudnorm=I={tgt}:TP=-1:LRA=11:print_format=json", "-f", "null", "-"],
              capture_output=True, text=True, check=True)
          blobs = re.findall(r"\{[^{}]*\}", r1.stderr)
          st = json.loads(blobs[-1])
          print(f"[bakeoff] input {name}: I={st['input_i']} LUFS  LRA={st['input_lra']}  TP={st['input_tp']} dBTP  target I={tgt}")
          # pass 2: apply linear gain with measured values
          af = (f"loudnorm=I={tgt}:TP=-1:LRA=11:measured_I={st['input_i']}:measured_TP={st['input_tp']}:"
                f"measured_LRA={st['input_lra']}:measured_thresh={st['input_thresh']}:"
                f"offset={st['target_offset']}:linear=true")
          subprocess.run(
              ["ffmpeg", "-hide_banner", "-y", "-i", wav, "-af", af,
               "-ar", "44100", "-ac", "2", "-c:a", "libmp3lame", "-b:a", "192k", mp3],
              check=True)
          os.remove(wav)
          log = open(os.path.join(os.environ["RUNNER_TEMP"], "build.log")).read()
          eng = re.findall(r"\[music_mix\] engine:.*", log)
          meta = {
              "model": "baseline", "mood": mood, "seed": None, "seconds": 120,
              "load_s": None, "gen_s": float(os.environ["BUILD_S"]),
              "rtf": round(float(os.environ["BUILD_S"]) / 120.0, 4),
              "peak_rss_mb": None, "engine": eng[-1] if eng else "not logged",
              "start_s": 60, "source": "build_mix.mjs fi --minutes 4 --audio-only --slot " + mood,
              "input_lufs": float(st["input_i"]), "input_lra": float(st["input_lra"]),
              "input_tp": float(st["input_tp"]), "target_lufs": float(tgt),
              "commit": subprocess.run(["git", "rev-parse", "HEAD"], cwd=os.getcwd(),
                                       capture_output=True, text=True).stdout.strip(),
          }
          json.dump(meta, open(js, "w"), indent=2)
          print(f"[bakeoff] baseline engine: {meta['engine']}")
          print(f"[bakeoff] wrote {mp3}")
          PY
          ls -la out

      - name: Upload baseline clip artifact
        uses: actions/upload-artifact@v4
        with:
          name: clip-baseline-${{ matrix.mood }}
          path: |
            out/*.mp3
            out/*.json
          retention-days: 7
          if-no-files-found: error

  score:
    needs: [gen, baseline]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ffmpeg
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg
          ffmpeg -version | sed -n 1p

      - name: Download all clip artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: clip-*
          path: clips
          merge-multiple: true

      - name: Install Audiobox Aesthetics (CPU torch 2.7.1)
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install audiobox_aesthetics==0.0.4
          python -c "import inspect; from audiobox_aesthetics.infer import initialize_predictor; print('aes import ok', inspect.signature(initialize_predictor))"

      - name: Score every mp3 (CE, CU, PC, PQ)
        run: |
          set -euo pipefail
          ls -la clips
          python tools/music_bakeoff/score_aes.py --clips clips --out aes.json
          cat aes.json

      - name: Upload AES scores
        uses: actions/upload-artifact@v4
        with:
          name: aes-scores
          path: aes.json
          retention-days: 7
          if-no-files-found: error

  collect:
    needs: [gen, baseline, score]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Download clip artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: clip-*
          path: clips
          merge-multiple: true

      - name: Download AES scores
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aes-scores
          path: aes

      - name: Build results.md
        run: |
          set -euo pipefail
          mkdir -p clips
          python3 - <<'PY'
          import json, os, shutil
          models = [("baseline", "current production engine (build_mix)"),
                    ("ace", "ACE-Step 1.5 turbo"),
                    ("sa3", "Stable Audio 3 small-music")]
          moods = ["focus", "unwind", "sleep", "slowmorning"]
          aes = {}
          if os.path.exists("aes/aes.json"):
              aes = json.load(open("aes/aes.json"))
              shutil.copy("aes/aes.json", "clips/aes.json")
          def f(v, nd=3):
              return "n/a" if v is None else (f"{v:.{nd}f}" if isinstance(v, float) else str(v))
          lines = [
              "# Music bake-off results",
              "",
              "| model | mood | load_s | gen_s | rtf | peak_rss_mb | input LUFS | CE | CU | PC | PQ |",
              "|---|---|---|---|---|---|---|---|---|---|---|",
          ]
          means = {k: {"CE": [], "PQ": []} for k, _ in models}
          for key, _label in models:
              for mood in moods:
                  path = f"clips/{key}_{mood}.json"
                  s = aes.get(f"{key}_{mood}.mp3")
                  sc = [f(s[k]) if s else "n/a" for k in ("CE", "CU", "PC", "PQ")]
                  if s:
                      means[key]["CE"].append(s["CE"]); means[key]["PQ"].append(s["PQ"])
                  if not os.path.exists(path):
                      lines.append(f"| {key} | {mood} | FAILED | | | | | {' | '.join(sc)} |")
                      continue
                  m = json.load(open(path))
                  lines.append(
                      f"| {key} | {mood} | {f(m.get('load_s'), 2)} | {f(m.get('gen_s'), 2)} | {f(m.get('rtf'), 4)} | "
                      f"{f(m.get('peak_rss_mb'), 1)} | {f(m.get('input_lufs'), 1)} | {' | '.join(sc)} |")
          lines += ["", "## Mean AES per model (across the four moods)", "",
                    "| model | n | mean CE | mean PQ |", "|---|---|---|---|"]
          for key, label in models:
              ce, pq = means[key]["CE"], means[key]["PQ"]
              mc = f"{sum(ce)/len(ce):.3f}" if ce else "n/a"
              mp = f"{sum(pq)/len(pq):.3f}" if pq else "n/a"
              lines.append(f"| {key} ({label}) | {len(ce)} | {mc} | {mp} |")
          lines += ["", "Models: " + "; ".join(f"`{k}` = {l}" for k, l in models),
                    "Loudness targets: I=-14 LUFS, sleep I=-18 LUFS, TP=-1 dBTP, LRA=11.",
                    "rtf = gen_s / seconds (lower is faster). Baseline gen_s is the build_mix wall time for a 4 min audio-only mix.",
                    "AES: Meta Audiobox Aesthetics, 1-10 scale (CE content enjoyment, CU content usefulness, PC production complexity, PQ production quality)."]
          text = "\n".join(lines) + "\n"
          open("clips/results.md", "w").write(text)
          print(text)
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              open(summary, "a").write(text)
          PY
          ls -la clips

      - name: Upload bakeoff-clips
        uses: actions/upload-artifact@v4
        with:
          name: bakeoff-clips
          path: |
            clips/*.mp3
            clips/results.md
            clips/aes.json
          retention-days: 7
          if-no-files-found: warn
