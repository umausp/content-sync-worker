name: longform-jp

# Render a native-language Japanese long-form recap for the @AgyataWorld channel — sourced,
# synthesised, voiced and captioned ENTIRELY IN JAPANESE (no translation),
# then auto-uploaded PUBLIC to the JP playlist. TTS engine: kokoro. Nothing is
# committed to the repo; the staged output is purged after upload.
#
# CADENCE: agyata-cron-pinger workflow_dispatch. Public repo = free minutes.
on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Comma list of allowed categories/topics (SHORTS_CATEGORY_FILTER)'
        required: false
        default: ''
      content_mode:
        description: 'Entertainment content mode (movie-review/retro-movie/top10 → CONTENT_MODE)'
        required: false
        default: ''
      region:
        description: 'Region for world channel (usa/europe)'
        required: false
        default: ''

concurrency:
  group: longform-jp
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ── CINEMATIC ENGINE (setup_cinematic.sh provisions the models; all fail-open) ──
  SHORTS_CINEMATIC: '1'
  SHORTS_DEPTH_3D: '1'
  SHORTS_DEPTH_OCCLUSION: '1'
  DEPTH_MODEL: /tmp/models/depth_anything_v2_vits.onnx
  MATTE_MODEL: /tmp/models/u2net.onnx
  DEPTH_SIZE: '392'
  DEPTH_CACHE_DIR: /tmp/agyata-depth
  MATTE_CACHE_DIR: /tmp/agyata-matte
  PARALLAX_CACHE_DIR: /tmp/agyata-parallax
  DEPTH_MAX_IMAGES: '18'
  MATTE_MAX_IMAGES: '18'
  DEPTH_BUDGET_MS: '20000'
  MATTE_BUDGET_MS: '20000'
  DEPTH_THREADS: '2'
  MATTE_THREADS: '2'
  OCCLUSION_MAX_PER_CLIP: '4'
  ASSEMBLE_CONCURRENCY: '2'
  LONGFORM_MIN_ASSETS: '3'
  LONGFORM_MIN_MATERIAL: '1500'
  LONGFORM_MIN_BODIES: '2'
  LONGFORM_MIN_CORR: '2'
  SHORTS_CATEGORY_FILTER: ${{ github.event.inputs.category }}
  CONTENT_MODE: ${{ github.event.inputs.content_mode }}
  TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
  TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
  SHORTS_LONGFORM_FORMAT: magazine
  SHORTS_LONGFORM_HOSTS: '6'
  SHORTS_LONGFORM_FORCE: '1'
  LONGFORM_MIN_BEATS: '5'
  MAGAZINE_DIVES: '1'
  MAGAZINE_DIVE_BEATS: 'hook,context,evidence,meaning,stakes,analysis,background,close'
  MAGAZINE_HEADLINES: '10'
  LONGFORM_CORPUS_CHARS: '32000'
  LONGFORM_DEEPEN_OUTLETS: '16'
  SHORTS_DEBUG: '1'
  LONGFORM_RAG_TRACE: '1'
  LONGFORM_BEAT_SCALE: '1.6'   # ~5-6min: >3min floor, and renders within the 90-min cap (2.2/8min hit the timeout at ~3min/clip x 8 clips)
  API_BASE: https://api.agyata.com
  SHORTS_PY: python
  SHORTS_ORIENTATION: landscape # 1920x1080, multi-story recap
  LONGFORM_PIPELINE: '1' # single-story pipeline (select→research→script→visuals→narrate→assemble)
  # PUBLIC + monetized (user: "make all native language crons at direct public with right
  # playlist"). build_short reads SHORTS_PRIVACY into meta.privacyStatus → upload.mjs sets it
  # on videos.insert, so the video is public the moment it's uploaded (no manual Studio flip).
  # A DEMONETIZATION GUARD (shorts/safety.mjs) drops policy-unsafe stories + masks strong
  # profanity/slurs before render, so going straight-to-public is monetization-safe.
  SHORTS_PRIVACY: public
  # Durable VIDEO-DEDUP ledger (Upstash Redis) — render reads (drop already-made stories),
  # upload writes after a successful publish. Keyed by channel label so jp is independent.
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  # ── LLM PROVIDER LADDER — the SAME shared router the news pipeline uses
  #    (src/providers.mjs), NVIDIA-first then the rest of the free tier, local Ollama last.
  #    A provider is skipped if its key is absent; fail-fast. This turns the raw article body
  #    into a clean, non-repetitive brief per story — synthesised IN THE CHANNEL'S LANGUAGE.
  PROVIDER_ORDER: 'ollama,cerebras,openrouter,sambanova,nvidia,cohere,mistral,gitmodels,huggingface,huggingface1'
  LONGFORM_ONE_CALL: '1'  # free-70B only (no Gemini billing): trust the ONE whole-arc call, skip per-beat backfill+regen so a video is 1 LLM call, not 15-25 (free-tier budget)
  GEMINI_GROUNDING: '0'  # Gemini billing removed — skip the paid grounded-search call; the whole-arc script runs off the scraped corpus / TMDB facts
  PROVIDER_USE_OLLAMA: '1'  # Ollama Cloud (Pro, flat $20/mo) is PRIMARY now
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  WM_RENDER_CLAIMS: '1' # Worldmodel graph-backed render (claims/divergence) — noise-filtered content
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  NVIDIA_MODEL: 'meta/llama-3.3-70b-instruct'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: 'gemini-flash-lite-latest'
  SOMBANOVA_API_KEY: ${{ secrets.SOMBANOVA_API_KEY }}
  SAMBANOVA_MODEL: 'Meta-Llama-3.3-70B-Instruct'
  COHERA_API_KEY: ${{ secrets.COHERA_API_KEY }}
  COHERE_MODEL: 'command-r-08-2024'
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: 'openrouter/free'
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MISTRAL_MODEL: 'mistral-small-latest'
  GITMODELS_API_KEY: ${{ secrets.GITMODELS_API_KEY }}
  GITMODELS_MODEL: 'openai/gpt-4o-mini'
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: 'gpt-4o-mini'
  OPENAI_DAILY_CAP: '30'
  OLLAMA_MODEL: deepseek-v4-flash:cloud  # Ollama Cloud deepseek-v4-flash (fast/cheap; verified live 2026-08-04)
  OLLAMA_MAX_TRIES: '6'  # Ollama is the sole working provider (free tiers exhausted) — ride out transient 503/empty
  PROVIDER_HOSTED_TIMEOUT_MS: '60000'
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
  DEEPINFRA1_API_KEY: ${{ secrets.DEEPINFRA1_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF1_TOKEN: ${{ secrets.HF1_TOKEN }}
  HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
  HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci --no-audit --no-fund

      - name: Install system deps (ffmpeg + librsvg + espeak-ng + fonts + CJK)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin espeak-ng fonts-dejavu fonts-noto-core fonts-noto-cjk fonts-noto-extra


      - name: Provision cinematic engine (onnxruntime + ONNX models, fail-open)
        run: bash scripts/setup_cinematic.sh
      - name: Restore cinematic ONNX depth/matte maps + parallax clips (shared across ALL channels/runs)
        if: env.SHORTS_DEPTH_3D == '1'
        id: cinematic-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/agyata-depth
            /tmp/agyata-matte
            /tmp/agyata-parallax
          key: cinematic-maps-${{ runner.os }}-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-v1

      - name: Install Kokoro TTS deps (+ Japanese G2P)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet kokoro soundfile sentencepiece edge-tts
          python -m pip install --quiet pyopenjtalk-plus
          python -m pip install --quiet misaki fugashi unidic-lite jaconv mojimoji

      - name: Cache HuggingFace models (Kokoro)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-jp-v1

      - name: Stamp
        run: echo "SHORTS_STAMP=lf-$(date -u +%Y%m%dT%H%M)" >> "$GITHUB_ENV"

      - name: Render Japanese long-form recap
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          # Cross-run dedup: claim story keys via api.agyata.com before rendering so two
          # jp runs (a Short + a long-form in the same window) never publish the same story.
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
        run: node shorts/build_short.mjs jp

      # AUTO-UPLOAD to YouTube as PUBLIC (SHORTS_PRIVACY=public). Native channels are PLAYLISTS
      # on @AgyataWorld, so they authenticate with YT_REFRESH_TOKEN_WORLD and land in the JP
      # playlist (YT_PLAYLIST_JP). On success sets uploaded=true so the video is NOT also
      # published as a public artifact. Best-effort — never fails the run.
      - name: Auto-upload to YouTube (public)
        id: yt
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          # Own channel token if minted (YT_REFRESH_TOKEN_JP), else the @AgyataWorld token.
          YT_REFRESH_TOKEN_JP: ${{ secrets.YT_REFRESH_TOKEN_JP }}
          YT_REFRESH_TOKEN_WORLD: ${{ secrets.YT_REFRESH_TOKEN_WORLD }}
          YT_PLAYLIST_JP: ${{ secrets.YT_PLAYLIST_JP }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN_JP" ] && [ -z "$YT_REFRESH_TOKEN_WORLD" ]; then echo "no refresh token — skipping upload (artifact only)"; exit 0; fi
          node shorts/upload.mjs jp "$SHORTS_STAMP"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      # REVIEW COPY only — kept solely when the YouTube upload did NOT happen. On a PUBLIC repo
      # an artifact is publicly downloadable, so once the video is on YouTube we never publish
      # it here. 1-day retention even then.
      - name: Upload staged artifact (only if NOT uploaded to YouTube)
        if: steps.yt.outputs.uploaded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: longform-jp-${{ env.SHORTS_STAMP }}
          path: docs/shorts/jp/
          retention-days: 1
          if-no-files-found: warn

      # PURGE the rendered MP4 + metadata from the runner after upload — nothing rendered
      # lingers on GitHub. Always runs.
      - name: Save cinematic ONNX depth/matte maps + parallax clips (grows the shared cache for every channel)
        if: always() && env.SHORTS_DEPTH_3D == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/agyata-depth
            /tmp/agyata-matte
            /tmp/agyata-parallax
          key: cinematic-maps-${{ runner.os }}-v1
      - name: Purge staged output
        if: always()
        run: rm -rf docs/shorts/jp/* || true
