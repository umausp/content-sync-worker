name: longform-bharat

# Render a HINDI/HINGLISH long-form daily recap for the @agyata_dot_com (भारत) channel — sourced,
# synthesised, voiced and captioned natively in Hindi (Devanagari + English proper nouns), then
# auto-uploaded PUBLIC to its OWN channel (YT_REFRESH_TOKEN_BHARAT — a standalone channel, NOT a
# playlist). TTS: edge-tts newsroom (multivoice) → Piper hi_IN fallback (Gemini eliminated). Nothing is committed;
# the staged output is purged after upload.
#
# PUBLIC SHELL: checks out the PRIVATE agyata-pipeline-private repo (all render code) then runs it.
# CADENCE: agyata-cron-pinger workflow_dispatch (re-enabled 2026-08-29, unified 2-shorts+1-longform/day
# cadence alongside every other channel — this workflow now needs the SAME category/content_mode
# inputs longform-usa.yml etc. already declare, or the pinger's dispatch call fails outright).
on:
  workflow_dispatch:
    inputs:
      category:
        description: 'SHORTS_CATEGORY_FILTER'
        required: false
        default: ''
      content_mode:
        description: 'CONTENT_MODE'
        required: false
        default: ''

concurrency:
  group: longform-bharat
  cancel-in-progress: false

permissions:
  contents: read

env:
  # ── CINEMATIC ENGINE (setup_cinematic.sh provisions the models; all fail-open) ──
  SHORTS_CINEMATIC: '1'
  SHORTS_LONGFORM_BEAT_FINISH: '0'  # perf fix (2026-08-29, built 2026-08-08 but never deployed): per-beat finish blew the 12-min composite timeout on 70-116s/14-26-shot beats
  SHORTS_CINEMATIC_CONCAT: '1'  # same grade applied ONCE over the full concatenated video instead — same look, a fraction of the time
  # missed on longform-*.yml the first pass) - render.mjs now uses a plain left-right slide pan
  # (media/window.mjs) for every still; DOF+SPATIAL_GFX below are sub-gated on this flag and go
  # inert with it.
  SHORTS_DEPTH_3D: '0'
  SHORTS_DEPTH_OCCLUSION: '0'
  SHORTS_SPATIAL_GFX: '0'   # story-keyword graphic behind the matted subject (occlusion route); fail-open, $0. render.mjs auto-wiring landed (shorts/visual/spatial_keyword.mjs).
  DEPTH_MODEL: /tmp/models/depth_anything_v2_vits.onnx
  MATTE_MODEL: /tmp/models/u2net.onnx
  DEPTH_SIZE: '392'
  DEPTH_CACHE_DIR: /tmp/agyata-depth
  MATTE_CACHE_DIR: /tmp/agyata-matte
  PARALLAX_CACHE_DIR: /tmp/agyata-parallax
  DEPTH_MAX_IMAGES: '18'
  MATTE_MAX_IMAGES: '18'
  DEPTH_BUDGET_MS: '20000'
  MATTE_BUDGET_MS: '20000'
  DEPTH_THREADS: '2'
  MATTE_THREADS: '2'
  OCCLUSION_MAX_PER_CLIP: '4'
  ASSEMBLE_CONCURRENCY: '2'
  SHORTS_LONGFORM_HOSTS: '6'
  SHORTS_LONGFORM_FORMAT: magazine
  SHORTS_LONGFORM_FORCE: '1'
  LONGFORM_MIN_BEATS: '6'
  MAGAZINE_DIVES: '1'
  MAGAZINE_DIVE_BEATS: 'hook,promise,stakes,context,history,conflict,evidence,case_study,host_reaction,background,counterpoint,debate,analysis,meaning,future,close'
  MAGAZINE_HEADLINES: '10'
  LONGFORM_CORPUS_CHARS: '32000'
  LONGFORM_DEEPEN_OUTLETS: '16'
  SHORTS_DEBUG: '1'
  LONGFORM_RAG_TRACE: '1'
  LONGFORM_BEAT_SCALE: '1.8'   # deep-editorial length: ~10-12min ceiling (anti-padding fills only from real corpus)
  API_BASE: https://api.agyata.com
  SHORTS_PY: python
  SHORTS_ORIENTATION: landscape # 1920x1080, multi-story recap
  LONGFORM_PIPELINE: '1' # single-story pipeline (select→research→script→visuals→narrate→assemble)
  # PUBLIC + monetized. build_short reads SHORTS_PRIVACY into meta.privacyStatus → upload.mjs sets it
  # on videos.insert, so the video is public the moment it's uploaded. A DEMONETIZATION GUARD
  # (shorts/safety.mjs) drops policy-unsafe stories + masks strong profanity before render.
  SHORTS_PRIVACY: public
  SHORTS_CATEGORY_FILTER: ${{ github.event.inputs.category }}
  CONTENT_MODE: ${{ github.event.inputs.content_mode }}
  # Durable VIDEO-DEDUP ledger (Upstash Redis) — render reads (drop already-made stories),
  # upload writes after a successful publish. Keyed by channel label (bharat) so it is independent.
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  # ── LLM PROVIDER LADDER — Ollama Cloud PRIMARY (same fix as every other currently-active channel;
  # this file hadn't been touched since it was disabled 2026-08-08, so it was still Gemini-first —
  # re-enabling it as-is would have quietly resumed PAID Gemini billing the user removed elsewhere).
  PROVIDER_ORDER: 'ollama,cerebras,openrouter,sambanova,nvidia,cohere,mistral,gitmodels,huggingface,huggingface1'
  PROVIDER_USE_OLLAMA: '1'  # Ollama Cloud (Pro, flat $20/mo) is PRIMARY now
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OLLAMA_MAX_TRIES: '6'
  WM_RENDER_CLAIMS: '1' # Worldmodel graph-backed render (claims/divergence) — noise-filtered content
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  NVIDIA_MODEL: 'meta/llama-3.3-70b-instruct'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: 'gemini-flash-lite-latest'
  SOMBANOVA_API_KEY: ${{ secrets.SOMBANOVA_API_KEY }}
  SAMBANOVA_MODEL: 'Meta-Llama-3.3-70B-Instruct'
  COHERA_API_KEY: ${{ secrets.COHERA_API_KEY }}
  COHERE_MODEL: 'command-r-08-2024'
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: 'openrouter/free'
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MISTRAL_MODEL: 'mistral-small-latest'
  GITMODELS_API_KEY: ${{ secrets.GITMODELS_API_KEY }}
  GITMODELS_MODEL: 'openai/gpt-4o-mini'
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: 'gpt-4o-mini'
  OPENAI_DAILY_CAP: '30'
  OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'gpt-oss:120b' }}  # match every other active channel (user 2026-08-09: "use gpt-oss:120b everywhere")
  PROVIDER_HOSTED_TIMEOUT_MS: '60000'
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
  DEEPINFRA1_API_KEY: ${{ secrets.DEEPINFRA1_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF1_TOKEN: ${{ secrets.HF1_TOKEN }}
  HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
  HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true

      # ── SHARED SETUP (perf): node+npm, apt+fonts, python+pip cache, cinematic ONNX provisioning,
      # + the ONNX model-WEIGHTS cache — ONE composite action (private repo; resolves after the
      # checkout above). Replaces the per-channel setup; all deps preserved verbatim as inputs.
      - name: Render setup (cached)
        uses: ./.github/actions/render-setup
        with:
          tts-pip: 'piper-tts numpy soundfile faster-whisper edge-tts'
          apt-packages: 'ffmpeg librsvg2-bin espeak-ng fonts-dejavu fonts-noto-core fonts-noto-cjk fonts-noto-extra'
          voice-cache-path: '/tmp/piper-voices'
          voice-cache-key: 'piper-voices-bharat-v1'

      - name: Restore cinematic ONNX depth/matte maps + parallax clips (shared across ALL channels/runs)
        if: env.SHORTS_DEPTH_3D == '1'
        id: cinematic-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/agyata-depth
            /tmp/agyata-matte
            /tmp/agyata-parallax
          key: cinematic-maps-${{ runner.os }}-v1

      - name: Stamp
        run: echo "SHORTS_STAMP=lf-$(date -u +%Y%m%dT%H%M)" >> "$GITHUB_ENV"

      - name: Render Hindi long-form recap
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIPER_VOICES_DIR: /tmp/piper-voices
          PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          # Cross-run dedup: claim story keys via api.agyata.com before rendering so a bharat Short
          # and this long-form in the same window never publish the same story.
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
        run: node shorts/build_short.mjs bharat

      # AUTO-UPLOAD to YouTube as PUBLIC. bharat is its OWN channel (YT_REFRESH_TOKEN_BHARAT), NOT a
      # playlist on @AgyataWorld. Best-effort — never fails the run.
      - name: Auto-upload to YouTube (public)
        id: yt
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_BHARAT: ${{ secrets.YT_REFRESH_TOKEN_BHARAT }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN_BHARAT" ]; then echo "no refresh token — skipping upload (artifact only)"; exit 0; fi
          node shorts/upload.mjs bharat "$SHORTS_STAMP"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      # REVIEW COPY only — kept solely when the YouTube upload did NOT happen. On a PUBLIC repo an
      # artifact is publicly downloadable, so once the video is on YouTube we never publish it here.
      - name: Upload staged artifact (only if NOT uploaded to YouTube)
        if: steps.yt.outputs.uploaded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: longform-bharat-${{ env.SHORTS_STAMP }}
          path: docs/shorts/bharat/
          retention-days: 1
          if-no-files-found: warn

      # PURGE the rendered MP4 + metadata from the runner after upload. Always runs.
      - name: Save cinematic ONNX depth/matte maps + parallax clips (grows the shared cache for every channel)
        if: always() && env.SHORTS_DEPTH_3D == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/agyata-depth
            /tmp/agyata-matte
            /tmp/agyata-parallax
          key: cinematic-maps-${{ runner.os }}-v1
      - name: Purge staged output
        if: always()
        run: rm -rf docs/shorts/bharat/* || true
