# Self-hosted (Apple-silicon MacBook, labels self-hosted/macOS/ARM64) HEAVY lane. Job `heavy` runs prepare + render of
# every beat in parallel on the Mac (concurrency from the core count, work dir on a RAM disk, venv/models cached), then
# uploads the run state (incl. rendered clips) as a GitHub artifact. Job `finalize` runs on a GitHub-hosted runner, exactly
# like the cron's: concat, release gate, stage, then (only when `upload` is true) the YouTube upload with the channel token,
# and keeps the staged mp4/meta as an artifact. Secrets for upload never leave GitHub-hosted runners.
# Source of truth for the PUBLIC shell's .github/workflows/selfhosted-verify.yml (umausp/content-sync-worker).
# Flags are the cron's: the env block is read from _longform-doc.yml by tools/ci/shell_env.mjs.
name: selfhosted-verify
on:
  workflow_dispatch:
    inputs:
      pipeline_ref: { description: 'ref of umausp/agyata-pipeline-private', default: 'feat/longform-studio' }
      channel: { description: 'channel id', default: 'nl' }
      ramdisk_gb: { description: 'RAM disk for the work dir (0 = disk)', default: '70' }
      local_llm: { description: 'serve LLM + VLM from the cached mlx-community/gemma-4-31b-it-4bit on this Mac (think=false) instead of Ollama Cloud', type: boolean, default: false }
      upload: { description: 'upload to YouTube from the GitHub-hosted finalize job (default: stage only)', type: boolean, default: false }
concurrency: { group: selfhosted-verify, cancel-in-progress: false }
jobs:
  heavy:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 240
    outputs:
      stamp: ${{ steps.envs.outputs.stamp }}
    env:
      CH: ${{ inputs.channel }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      WIKIMEDIA_BOT_USER: ${{ secrets.WIKIMEDIA_BOT_USER }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIMEDIA_BOT_PASSWORD }}
      OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
      OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
      DDG_PROXY_URL: ${{ secrets.DDG_PROXY_URL }}
      EDGE_TTS_RELAY_TOKEN: ${{ secrets.EDGE_TTS_RELAY_TOKEN }}
      EDGE_TTS_RELAY_URL: ${{ vars.EDGE_TTS_RELAY_URL }}
      EDGE_TTS_RELAY_DISABLE: ${{ vars.EDGE_TTS_RELAY_DISABLE }}
      RESEARCH_POD_ENDPOINT: ${{ secrets.RESEARCH_POD_ENDPOINT }}
      RESEARCH_POD_TOKEN: ${{ secrets.RESEARCH_POD_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
    steps:
      - name: Checkout private pipeline (./pipeline) + this shell (./shell)
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ inputs.pipeline_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: pipeline
      - uses: actions/checkout@v4
        with: { path: shell }

      - name: Machine profile + tuning
        run: |
          export PATH=/opt/homebrew/bin:/usr/local/bin:$PATH
          P=$(sysctl -n hw.perflevel0.physicalcpu 2>/dev/null || sysctl -n hw.physicalcpu)
          L=$(sysctl -n hw.logicalcpu); M=$(( $(sysctl -n hw.memsize) / 1073741824 ))
          echo "machine: $(sysctl -n machdep.cpu.brand_string) | perf cores $P | logical $L | RAM ${M} GiB"
          {
            echo "PERF_CORES=$P"; echo "LOGICAL=$L"
            R=${{ inputs.ramdisk_gb }}; H=$(( (M - R - 6) * 1024 / 8 )); [ $H -ge 2048 ] || H=2048   # per-process cap: what the RAM disk leaves, split over ~8 node processes
            echo "NODE_HEAP_MB=$H"   # NODE_OPTIONS itself cannot be set through GITHUB_ENV (blocked); exported in pipeline.env below
            echo "UV_THREADPOOL_SIZE=64"
            echo "DOC_VISUALS_CONCURRENCY=8"     # network-bound fetch/ground: more in flight, same budgets and gates
            echo "OMP_NUM_THREADS=$P"; echo "PYTORCH_ENABLE_MPS_FALLBACK=1"
            echo "PATH=/opt/homebrew/bin:/usr/local/bin:$PATH"
          } >> "$GITHUB_ENV"
          # keep the laptop awake for the whole job: a detached caffeinate (own session, survives this step), 4 h cap, killed in Cleanup
          perl -MPOSIX -e 'POSIX::setsid(); exec @ARGV' caffeinate -dimsu -t 14400 >/dev/null 2>&1 < /dev/null &
          echo "CAFFEINATE_PID=$!" >> "$GITHUB_ENV"; pmset -g assertions | grep -iE 'PreventUserIdleSystemSleep|caffeinate' | head -2 || true
          echo "T_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Work dir (RAM disk when asked and possible, else disk)
        run: |
          WR="$RUNNER_TEMP/lfwork"
          RD=${{ inputs.ramdisk_gb }}; MEM=$(( $(sysctl -n hw.memsize) / 1073741824 ))
          # a local 31B 4-bit model needs ~25 GB resident: leave 40 GB for model + node + the OS
          if [ "${{ inputs.local_llm }}" = "true" ] && [ "$RD" -gt $(( MEM - 40 )) ]; then RD=$(( MEM - 40 )); echo "RAM disk capped to ${RD} GB for the local model"; fi
          if [ "$RD" != "0" ]; then
            SECT=$(( RD * 2097152 ))
            DEV=$(hdiutil attach -nomount "ram://$SECT" | awk 'NR==1{print $1}')
            if [ -n "$DEV" ] && diskutil erasevolume HFS+ lfwork "$DEV" >/dev/null 2>&1 && [ -d /Volumes/lfwork ]; then
              echo "RAMDISK_DEV=$DEV" >> "$GITHUB_ENV"; WR=/Volumes/lfwork; df -h "$WR" | tail -1
            else
              echo "RAM disk unavailable — using disk"; [ -z "$DEV" ] || hdiutil detach "$DEV" -force >/dev/null 2>&1 || true
            fi
          fi
          mkdir -p "$WR"; echo "WORKROOT=$WR" >> "$GITHUB_ENV"; echo "work dir: $WR"
      - name: System deps (brew, idempotent)
        run: brew install ffmpeg librsvg espeak-ng node@22 python@3.12 jq uv 2>&1 | tail -3 || true
      - name: Node 22 on PATH + npm ci
        working-directory: pipeline
        run: |
          echo "$(brew --prefix node@22)/bin" >> "$GITHUB_PATH"; export PATH="$(brew --prefix node@22)/bin:$PATH"
          node --version && npm ci --no-audit --no-fund
      - name: Python 3.12 venv + TTS stack (cached in ~/.cache/lf-venv)
        run: |
          V=$HOME/.cache/lf-venv
          [ -x "$V/bin/python" ] || uv venv --python 3.12 "$V"
          . "$V/bin/activate"
          uv pip install --quiet kokoro soundfile sentencepiece faster-whisper "av<19" edge-tts pyyaml
          echo "$V/bin" >> "$GITHUB_PATH"
      - name: ONNX provisioning (cached in ~/.cache/lf-models)
        working-directory: pipeline
        run: |
          export CINEMATIC_MODELS_DIR=$HOME/.cache/lf-models; mkdir -p "$CINEMATIC_MODELS_DIR"
          bash scripts/setup_image_clip.sh || echo "clip setup failed open"
          bash scripts/setup_cinematic.sh || echo "cinematic setup failed open"
          echo "CINEMATIC_MODELS_DIR=$CINEMATIC_MODELS_DIR" >> "$GITHUB_ENV"

      - name: Local MLX model (gemma-4-31b 4-bit, think=false) behind an Ollama-protocol shim
        if: inputs.local_llm
        working-directory: pipeline
        run: |
          . "$HOME/.cache/lf-venv/bin/activate"
          uv pip install --quiet --upgrade mlx-vlm
          export HF_HUB_OFFLINE=1   # the weights are already in ~/.cache/huggingface; never re-download
          M=mlx-community/gemma-4-31b-it-4bit
          ls "$HOME/.cache/huggingface/hub" | grep -i 'gemma-4-31b' || { echo "::error::$M not in the HF cache on this Mac"; exit 1; }
          perl -MPOSIX -e 'POSIX::setsid(); exec @ARGV' python -m mlx_vlm.server --model "$M" --port 8081 > "$RUNNER_TEMP/mlx.log" 2>&1 < /dev/null &
          echo "MLX_PID=$!" >> "$GITHUB_ENV"
          perl -MPOSIX -e 'POSIX::setsid(); exec @ARGV' node tools/ci/mlx_ollama_shim.mjs --listen 11434 --upstream http://127.0.0.1:8081 --model "$M" > "$RUNNER_TEMP/shim.log" 2>&1 < /dev/null &
          echo "SHIM_PID=$!" >> "$GITHUB_ENV"
          for i in $(seq 1 120); do
            R=$(curl -s -m 120 http://127.0.0.1:11434/api/chat -d '{"model":"x","stream":false,"think":false,"messages":[{"role":"user","content":"Reply with the single word: ok"}],"options":{"num_predict":8}}' || true)
            echo "$R" | grep -q '"done":true' && { echo "model ready after ~$((i*10)) s: $R" | cut -c1-300; exit 0; }
            sleep 10
          done
          echo "::error::local model did not come up"; tail -30 "$RUNNER_TEMP/mlx.log" "$RUNNER_TEMP/shim.log"; exit 1
      - name: Pipeline env (the cron's flags) + machine overrides
        id: envs
        working-directory: pipeline
        run: |
          node tools/ci/shell_env.mjs ../shell/.github/workflows/_longform-doc.yml > "$RUNNER_TEMP/pipeline.env"
          echo "env lines: $(grep -c '^export' "$RUNNER_TEMP/pipeline.env")"
          STAMP=$(date -u +%Y%m%dT%H%M); echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"
          { echo "export SHORTS_WORK_DIR='$WORKROOT/.shorts-work'"; echo "export SHORTS_PY=python"; echo "export NODE_OPTIONS=--max-old-space-size=$NODE_HEAP_MB"
            echo "export SHORTS_STAMP=$STAMP"; echo "export TMPDIR='$WORKROOT'"; } >> "$RUNNER_TEMP/pipeline.env"
          if [ "${{ inputs.local_llm }}" = "true" ]; then
            L=mlx-community/gemma-4-31b-it-4bit
            { echo "export OLLAMA_HOST=http://127.0.0.1:11434"; echo "export OLLAMA_API_KEY=local"   # non-empty key = chat protocol; the shim ignores auth
              for v in DOC_WRITER_MODEL DOC_CRITIC_MODEL DOC_RESEARCH_MODEL OLLAMA_MODEL SHORTS_VLM_GATE_MODEL SHORTS_VLM_GATE_FALLBACK_MODELS NAME_GUARD_OLLAMA_MODEL; do echo "export $v=$L"; done
              echo "export OLLAMA_GLOBAL_CONCURRENCY=2"; echo "export DOC_VISUALS_CONCURRENCY=3"   # one local GPU serves LLM and VLM: do not queue 10 deep
              echo "export SHORTS_VLM_GATE_TIMEOUT_MS=180000"; } >> "$RUNNER_TEMP/pipeline.env"
            echo "local model env applied"
          fi
          mkdir -p "$WORKROOT"

      - name: Prepare
        working-directory: pipeline
        run: |
          set -o pipefail; . "$RUNNER_TEMP/pipeline.env"
          export DOC_MOTION_CONCURRENCY=$PERF_CORES
          S=$(date +%s); SHORTS_PHASE=prepare node shorts/build_short.mjs "$CH" 2>&1 | tee "$RUNNER_TEMP/prepare.log"
          echo "T_PREPARE=$(( $(date +%s) - S ))" >> "$GITHUB_ENV"
      - name: Render every beat in parallel
        working-directory: pipeline
        run: |
          . "$RUNNER_TEMP/pipeline.env"
          P=$(ls "$SHORTS_WORK_DIR/$CH"/*/lf_plan.json 2>/dev/null | head -1); [ -n "$P" ] || { echo "no render plan — nothing to render"; exit 1; }
          N=$(jq '.plans|length' "$P"); export DOC_MOTION_CONCURRENCY=$(( (PERF_CORES * 3 / 2 + N - 1) / N ))
          echo "beats=$N, motion workers per beat=$DOC_MOTION_CONCURRENCY, perf cores=$PERF_CORES"
          S=$(date +%s)
          jq -r '.plans[].i' "$P" | xargs -P "$N" -I{} sh -c 'SHORTS_PHASE=render LF_BEATS={} node shorts/build_short.mjs "$CH" > "$RUNNER_TEMP/render-{}.log" 2>&1; echo "beat {} exit $?"'
          echo "T_RENDER=$(( $(date +%s) - S ))" >> "$GITHUB_ENV"
      - name: Re-root absolute paths for the GitHub-hosted finalize job
        working-directory: pipeline
        run: |
          # the checkpoint stores absolute paths under SHORTS_WORK_DIR; the hosted runner's workspace differs from this Mac's
          HOSTED=/home/runner/work/content-sync-worker/content-sync-worker/.shorts-work
          MINE="$WORKROOT/.shorts-work"
          grep -rIl --exclude='*.mp4' --exclude='*.wav' --exclude='*.mp3' -F "$MINE" "$MINE/$CH" 2>/dev/null | while read -r f; do
            perl -pi -e 's#\Q'"$MINE"'\E#'"$HOSTED"'#g' "$f"
          done
          echo "re-rooted $MINE -> $HOSTED"; du -sh "$MINE/$CH"
      - name: Upload run state + rendered clips
        uses: actions/upload-artifact@v4
        with:
          name: longform-${{ inputs.channel }}-${{ github.run_id }}-state
          path: ${{ env.WORKROOT }}/.shorts-work/${{ inputs.channel }}/
          include-hidden-files: true
          retention-days: 7
          compression-level: 0
      - name: Summary (heavy lane timings)
        if: always()
        run: |
          {
            echo "## heavy lane $CH @ ${{ inputs.pipeline_ref }} — $(sysctl -n machdep.cpu.brand_string), ${PERF_CORES} perf cores, $(( $(sysctl -n hw.memsize) / 1073741824 )) GiB"
            echo "- wall: prepare ${T_PREPARE:-?} s | render ${T_RENDER:-?} s | total $(( $(date +%s) - T_START )) s  (GitHub 4-vCPU baseline: prepare ~2900 s, render ~1200 s)"
            grep -hE '\[studio:density2\]' "$RUNNER_TEMP/prepare.log" | tail -1 | sed 's/^/- /'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Cleanup (RAM disk)
        if: always()
        run: |
          [ -z "${RAMDISK_DEV:-}" ] || hdiutil detach "$RAMDISK_DEV" -force || true
          [ -z "${CAFFEINATE_PID:-}" ] || kill "$CAFFEINATE_PID" 2>/dev/null || true
          [ -z "${SHIM_PID:-}" ] || kill "$SHIM_PID" 2>/dev/null || true
          [ -z "${MLX_PID:-}" ] || kill "$MLX_PID" 2>/dev/null || true

  finalize:
    needs: heavy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHORTS_PHASE: finalize
      SHORTS_STAMP: ${{ needs.heavy.outputs.stamp }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      WIKIMEDIA_BOT_USER: ${{ secrets.WIKIMEDIA_BOT_USER }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIMEDIA_BOT_PASSWORD }}
      OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
      OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
      DDG_PROXY_URL: ${{ secrets.DDG_PROXY_URL }}
      EDGE_TTS_RELAY_TOKEN: ${{ secrets.EDGE_TTS_RELAY_TOKEN }}
      EDGE_TTS_RELAY_URL: ${{ vars.EDGE_TTS_RELAY_URL }}
      EDGE_TTS_RELAY_DISABLE: ${{ vars.EDGE_TTS_RELAY_DISABLE }}
      RESEARCH_POD_ENDPOINT: ${{ secrets.RESEARCH_POD_ENDPOINT }}
      RESEARCH_POD_TOKEN: ${{ secrets.RESEARCH_POD_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ inputs.pipeline_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Render setup (cached)
        uses: ./.github/actions/render-setup
        with:
          tts-pip: 'kokoro soundfile sentencepiece faster-whisper "av<19" edge-tts'
          apt-packages: 'ffmpeg librsvg2-bin espeak-ng fonts-dejavu fonts-noto-core fonts-noto-cjk fonts-noto-extra'
          voice-cache-path: '~/.cache/huggingface'
          voice-cache-key: 'hf-kokoro-m2m100-v1'
      - name: Download run state + clips from the Mac
        uses: actions/download-artifact@v4
        with:
          name: longform-${{ inputs.channel }}-${{ github.run_id }}-state
          path: .shorts-work/${{ inputs.channel }}/
      - uses: actions/checkout@v4
        with: { path: shell }
      - name: Pipeline env (the cron's flags) into this job
        run: |
          node tools/ci/shell_env.mjs shell/.github/workflows/_longform-doc.yml | sed -E "s/^export ([A-Z0-9_]+)='(.*)'$/\1=\2/" >> "$GITHUB_ENV"
          grep -c . "$GITHUB_ENV"
      - name: Finalize (concat, release gate, stage)
        run: |
          set -o pipefail
          node shorts/build_short.mjs ${{ inputs.channel }} 2>&1 | tee "$RUNNER_TEMP/finalize.log"
      - name: Select channel YouTube token
        id: yt_token
        if: inputs.upload
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_WORLD: ${{ secrets.YT_REFRESH_TOKEN_WORLD }}
          YT_REFRESH_TOKEN_USA: ${{ secrets.YT_REFRESH_TOKEN_USA }}
          YT_REFRESH_TOKEN_UK: ${{ secrets.YT_REFRESH_TOKEN_UK }}
          YT_REFRESH_TOKEN_BHARAT: ${{ secrets.YT_REFRESH_TOKEN_BHARAT }}
          YT_REFRESH_TOKEN_DE: ${{ secrets.YT_REFRESH_TOKEN_DE }}
          YT_REFRESH_TOKEN_NL: ${{ secrets.YT_REFRESH_TOKEN_NL }}
          YT_REFRESH_TOKEN_FR: ${{ secrets.YT_REFRESH_TOKEN_FR }}
          YT_REFRESH_TOKEN_JP: ${{ secrets.YT_REFRESH_TOKEN_JP }}
          YT_REFRESH_TOKEN_SV: ${{ secrets.YT_REFRESH_TOKEN_SV }}
          YT_REFRESH_TOKEN_NO: ${{ secrets.YT_REFRESH_TOKEN_NO }}
          YT_REFRESH_TOKEN_DA: ${{ secrets.YT_REFRESH_TOKEN_DA }}
          YT_REFRESH_TOKEN_IT: ${{ secrets.YT_REFRESH_TOKEN_IT }}
          YT_REFRESH_TOKEN_ES: ${{ secrets.YT_REFRESH_TOKEN_ES }}
          YT_REFRESH_TOKEN_PT: ${{ secrets.YT_REFRESH_TOKEN_PT }}
          YT_REFRESH_TOKEN_PL: ${{ secrets.YT_REFRESH_TOKEN_PL }}
          YT_REFRESH_TOKEN_ID: ${{ secrets.YT_REFRESH_TOKEN_ID }}
          YT_REFRESH_TOKEN_VI: ${{ secrets.YT_REFRESH_TOKEN_VI }}
          YT_REFRESH_TOKEN_TR: ${{ secrets.YT_REFRESH_TOKEN_TR }}
          YT_REFRESH_TOKEN_AR: ${{ secrets.YT_REFRESH_TOKEN_AR }}
          YT_REFRESH_TOKEN_MX: ${{ secrets.YT_REFRESH_TOKEN_MX }}
          YT_REFRESH_TOKEN_AU: ${{ secrets.YT_REFRESH_TOKEN_AU }}
          YT_REFRESH_TOKEN_CA: ${{ secrets.YT_REFRESH_TOKEN_CA }}
        run: |
          CH="${{ inputs.channel }}"
          VAR="YT_REFRESH_TOKEN_$(printf '%s' "$CH" | tr '[:lower:]' '[:upper:]')"
          TOKEN="${!VAR:-}"
          if [ -z "$TOKEN" ]; then echo "::error::no token for $CH ($VAR empty); upload refused"; exit 1; fi
          echo "::add-mask::$TOKEN"; echo "$VAR=$TOKEN" >> "$GITHUB_ENV"
          echo "YT_CLIENT_ID=$YT_CLIENT_ID" >> "$GITHUB_ENV"; echo "YT_CLIENT_SECRET=$YT_CLIENT_SECRET" >> "$GITHUB_ENV"
      - name: Auto-upload to YouTube
        id: yt
        if: inputs.upload
        continue-on-error: true
        run: |
          set -o pipefail
          node shorts/upload.mjs ${{ inputs.channel }} "$SHORTS_STAMP" 2>&1 | tee "$RUNNER_TEMP/upload.log"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
      - name: Summary (finalize)
        if: always()
        run: |
          {
            echo "## finalize ${{ inputs.channel }} (upload=${{ inputs.upload }})"
            grep -hE '\[studio:[a-z0-9_-]+\]' "$RUNNER_TEMP/finalize.log" "$RUNNER_TEMP/upload.log" 2>/dev/null | sed 's/^/- /' || true
            find docs/shorts/${{ inputs.channel }} -name 'short.mp4' -exec ls -lh {} \; 2>/dev/null | awk '{print "- mp4 " $5 " " $9}'
            grep -hoE 'https://youtube\.com/watch\?v=[A-Za-z0-9_-]+' "$RUNNER_TEMP/upload.log" 2>/dev/null | head -1 | sed 's/^/- YouTube: /' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload studio meta (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longform-${{ inputs.channel }}-${{ github.run_id }}-studio-meta
          path: |
            docs/shorts/${{ inputs.channel }}/*/meta.json
            docs/shorts/${{ inputs.channel }}/*/growth_plan.json
          retention-days: 14
          if-no-files-found: warn
      - name: Upload staged doc artifact (only if NOT uploaded)
        if: always() && steps.yt.outputs.uploaded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: longform-${{ inputs.channel }}-${{ github.run_id }}-staged
          path: docs/shorts/${{ inputs.channel }}/
          retention-days: 14
          if-no-files-found: warn
      - name: Purge staged output
        if: always()
        run: rm -rf docs/shorts/${{ inputs.channel }}/* || true
