name: gemini-models
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe 3.5-flash-lite callability + which alias flash-lite-latest resolves to
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "== what does gemini-flash-lite-latest currently alias to? =="
          curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-lite-latest?key=${GEMINI_API_KEY}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('displayName:', d.get('displayName'), '| version:', d.get('version'))" || true
          echo ""
          echo "== probe explicit IDs (200 = usable, 404 = new-user-locked) =="
          for M in gemini-3.5-flash-lite gemini-3.5-flash gemini-3.6-flash gemini-2-flash gemini-2.0-flash gemini-flash-lite-latest; do
            CODE=$(curl -s -o /tmp/r.json -w "%{http_code}" -X POST \
              "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent?key=${GEMINI_API_KEY}" \
              -H "content-type: application/json" \
              -d '{"contents":[{"parts":[{"text":"Reply with the single word OK"}]}],"generationConfig":{"maxOutputTokens":2048}}')
            TXT=$(python3 -c "import json;d=json.load(open('/tmp/r.json'));c=(d.get('candidates') or [{}])[0];print((((c.get('content') or {}).get('parts') or [{}])[0].get('text') or '').strip()[:20])" 2>/dev/null)
            echo "$M -> HTTP $CODE ${TXT:+| $TXT}"
          done
