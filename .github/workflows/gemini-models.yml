name: gemini-models
on:
  workflow_dispatch: {}
jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Probe gemini-flash-latest output behaviour
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "== which model does gemini-flash-latest alias to? =="
          curl -s "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest?key=${GEMINI_API_KEY}" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); print('version:', d.get('version'), '| name:', d.get('displayName'))" || true
          echo ""
          echo "== A: small budget (400), NO thinkingConfig (the OLD behaviour) =="
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${GEMINI_API_KEY}" \
            -H "content-type: application/json" \
            -d '{"contents":[{"parts":[{"text":"Write one Hindi sentence about Indian Railways."}]}],"generationConfig":{"maxOutputTokens":400}}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); c=(d.get('candidates') or [{}])[0]; print('finishReason:', c.get('finishReason'), '| text:', (((c.get('content') or {}).get('parts') or [{}])[0].get('text') or '(EMPTY)')[:80])" || true
          echo ""
          echo "== B: budget 2048 + thinkingBudget:0 (the NEW behaviour) =="
          curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent?key=${GEMINI_API_KEY}" \
            -H "content-type: application/json" \
            -d '{"contents":[{"parts":[{"text":"Write one Hindi sentence about Indian Railways."}]}],"generationConfig":{"maxOutputTokens":2048,"thinkingConfig":{"thinkingBudget":0}}}' \
            | python3 -c "import json,sys; d=json.load(sys.stdin); c=(d.get('candidates') or [{}])[0]; print('finishReason:', c.get('finishReason'), '| text:', (((c.get('content') or {}).get('parts') or [{}])[0].get('text') or '(EMPTY)')[:80])" || true
