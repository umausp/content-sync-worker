name: gemini-models
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe models with a REALISTIC synth prompt for CLEAN output
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, urllib.request, os
          KEY = os.environ["GEMINI_API_KEY"]
          # A realistic Hindi synth prompt like enrichSummary sends (HOOK: instruction + word limit).
          PROMPT = ("You are a Hindi news writer. BEGIN with a line 'HOOK:' then ONE opening line of AT MOST 12 words. "
                    "THEN write a 3-sentence Hindi brief. WRITE ENTIRELY IN HINDI.\n\n"
                    "HEADLINE: Government asks Meta to explain removal of PM Modi post\n"
                    "SOURCES: The government has sought a response from Meta after a post was removed.")
          def call(model, cfg):
              body = {"contents":[{"parts":[{"text":PROMPT}]}], "generationConfig": cfg}
              req = urllib.request.Request(
                  f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent?key={KEY}",
                  data=json.dumps(body).encode(), headers={"content-type":"application/json"})
              try:
                  r = urllib.request.urlopen(req, timeout=40)
                  d = json.loads(r.read())
                  c = (d.get("candidates") or [{}])[0]
                  parts = ((c.get("content") or {}).get("parts") or [])
                  txt = "".join(p.get("text","") for p in parts)
                  fr = c.get("finishReason")
                  # contamination markers
                  bad = any(m in txt for m in ["(9)","(10)","(11)","(12)","(13)","words.","Shorter:","(No,","(no,"]) or txt.count("HOOK:")>1
                  return f"finish={fr} len={len(txt)} clean={'NO' if bad else 'yes'} | {txt[:90].replace(chr(10),' ')}"
              except Exception as e:
                  return f"ERROR {e}"
          configs = {
              "plain-400": {"maxOutputTokens":400},
              "plain-2048": {"maxOutputTokens":2048},
              "think0-2048": {"maxOutputTokens":2048, "thinkingConfig":{"thinkingBudget":0}},
              "think128-4096": {"maxOutputTokens":4096, "thinkingConfig":{"thinkingBudget":128}},
          }
          for model in ["gemini-flash-latest","gemini-flash-lite-latest","gemini-2.5-flash-lite","gemma-4-31b-it"]:
              print(f"\n=== {model} ===")
              for name,cfg in configs.items():
                  print(f"  [{name}] {call(model,cfg)}")
          PY
