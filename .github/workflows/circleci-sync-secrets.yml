# One-off, manual: copy this repo's pipeline secrets into the CircleCI context `longform-keys` (org umausp) so the
# CircleCI verification lane (.circleci/config.yml) can clone the private pipeline and run it. GitHub never exposes
# secret values outside a job, so the copy has to run HERE; values go straight from the job env to CircleCI's API
# and are never printed (every value is masked by GitHub anyway). Re-run after rotating any key.
name: circleci-sync-secrets
on:
  workflow_dispatch:
    inputs:
      context:
        description: CircleCI context name
        default: longform-keys
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CCI_API_KEY: ${{ secrets.CCI_API_KEY }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      WIKIMEDIA_BOT_USER: ${{ secrets.WIKIMEDIA_BOT_USER }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIMEDIA_BOT_PASSWORD }}
      OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
      OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
      DDG_PROXY_URL: ${{ secrets.DDG_PROXY_URL }}
      EDGE_TTS_RELAY_TOKEN: ${{ secrets.EDGE_TTS_RELAY_TOKEN }}
      EDGE_TTS_RELAY_URL: ${{ vars.EDGE_TTS_RELAY_URL }}
      RESEARCH_POD_ENDPOINT: ${{ secrets.RESEARCH_POD_ENDPOINT }}
      RESEARCH_POD_TOKEN: ${{ secrets.RESEARCH_POD_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
    steps:
      - name: Find or create the context
        id: ctx
        run: |
          set -e
          [ -n "$CCI_API_KEY" ] || { echo "::error::CCI_API_KEY secret is empty"; exit 1; }
          API=https://circleci.com/api/v2
          ORG=$(curl -sS -H "Circle-Token: $CCI_API_KEY" "$API/me/collaborations" | jq -r '.[] | select(.slug=="gh/umausp" or .slug=="github/umausp" or .name=="umausp") | .id' | head -1)
          [ -n "$ORG" ] || { echo "::error::org umausp not found among CircleCI collaborations"; curl -sS -H "Circle-Token: $CCI_API_KEY" "$API/me/collaborations" | jq -r '.[].slug'; exit 1; }
          CTX=$(curl -sS -H "Circle-Token: $CCI_API_KEY" "$API/context?owner-id=$ORG" | jq -r --arg n "${{ inputs.context }}" '.items[] | select(.name==$n) | .id' | head -1)
          if [ -z "$CTX" ]; then
            CTX=$(curl -sS -X POST -H "Circle-Token: $CCI_API_KEY" -H 'Content-Type: application/json' "$API/context" \
              -d "{\"name\":\"${{ inputs.context }}\",\"owner\":{\"id\":\"$ORG\",\"type\":\"organization\"}}" | jq -r .id)
            echo "created context ${{ inputs.context }}"
          fi
          [ -n "$CTX" ] && [ "$CTX" != null ] || { echo "::error::no context id"; exit 1; }
          echo "ctx=$CTX" >> "$GITHUB_OUTPUT"
      - name: Put every non-empty secret into the context
        run: |
          set -e
          API=https://circleci.com/api/v2
          ok=0; skipped=0
          for NAME in PRIVATE_REPO_TOKEN OLLAMA_API_KEY PEXELS_API_KEY PIXBAY_API_KEY UNSPLASH_ACCESS_KEY EUROPEANA_API_KEY \
                      WIKIMEDIA_BOT_USER WIKIMEDIA_BOT_PASSWORD OPENVERSE_CLIENT_ID OPENVERSE_CLIENT_SECRET DDG_PROXY_URL \
                      EDGE_TTS_RELAY_TOKEN EDGE_TTS_RELAY_URL RESEARCH_POD_ENDPOINT RESEARCH_POD_TOKEN HF_TOKEN \
                      UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN NEWS_INGEST_TOKEN; do
            VAL="${!NAME:-}"
            if [ -z "$VAL" ]; then echo "skip $NAME (empty)"; skipped=$((skipped+1)); continue; fi
            CODE=$(jq -n --arg v "$VAL" '{value:$v}' | curl -sS -o /dev/null -w '%{http_code}' -X PUT -H "Circle-Token: $CCI_API_KEY" -H 'Content-Type: application/json' \
              "$API/context/${{ steps.ctx.outputs.ctx }}/environment-variable/$NAME" -d @-)
            echo "$NAME -> $CODE"; [ "$CODE" = 200 ] && ok=$((ok+1))
          done
          echo "synced $ok, skipped $skipped"
      - name: Verify names present in the context
        run: |
          curl -sS -H "Circle-Token: $CCI_API_KEY" "https://circleci.com/api/v2/context/${{ steps.ctx.outputs.ctx }}/environment-variable" | jq -r '.items[].variable' | sort | tr '\n' ' '; echo
