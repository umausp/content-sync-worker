name: longform-weekly

# ONE long-form documentary for ONE channel, dispatched once per channel per week by agyata-cron-pinger
# (DOC_SLOTS, generated from the private registry shorts/doc/registry/channels.json). Public repo = free
# minutes. Never on pull_request. All logic lives in _longform-doc.yml; this file only carries inputs.
# A new channel is a registry row + a YT_REFRESH_TOKEN_<ID> secret — never a YAML edit, except the
# `channel` options list below, which is generated by `tools/longform_schedule.mjs print --dispatch-options`
# and checked by workflow-lint.yml.

run-name: longform ${{ inputs.channel }} ${{ inputs.format }} week ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel id (registry row)'
        type: choice
        options: ['world', 'usa', 'uk', 'bharat', 'de', 'nl', 'fr', 'jp', 'sv', 'no', 'da', 'it', 'es', 'pt', 'pl', 'id', 'vi', 'tr', 'ar', 'mx', 'au', 'ca']
        required: true
      format:
        description: 'mid (watch-hours lane) or flagship (weekly long-form)'
        type: choice
        options: [mid, flagship]
        default: mid
        required: false
      privacy:
        description: 'YouTube privacy for the upload'
        type: choice
        options: [public, unlisted, private]
        default: private
        required: false
      script_only:
        description: 'Run only the script front half (no ffmpeg/TTS, no render, no upload); still uploads work/doc/*.json'
        type: boolean
        default: false
        required: false
      pipeline_ref:
        description: 'agyata-pipeline-private branch/ref to run (empty = default branch; cron leaves it empty)'
        type: string
        default: ''
        required: false
      parallel:
        description: 'Run alongside another run of this workflow instead of queueing behind it (own concurrency group)'
        type: boolean
        default: false
        required: false

concurrency:
  # one doc run per channel at a time; parallel=true gives that run its own group (manual verify renders only).
  # The fleet overlap bound lives in the pinger schedule lint, not here.
  group: doc-${{ inputs.channel }}${{ inputs.parallel && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: false

permissions:
  contents: read # artifacts only, nothing committed back to the repo

jobs:
  doc:
    uses: ./.github/workflows/_longform-doc.yml
    with:
      channel: ${{ inputs.channel }}
      pipeline_ref: ${{ inputs.pipeline_ref }}
      format: ${{ inputs.format }}
      privacy: ${{ inputs.privacy }}
      script_only: ${{ inputs.script_only }}
    secrets: inherit
