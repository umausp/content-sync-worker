# m1-content — Agyata Doc v2, module M1 (content) proven on its own real output. NOT an end-to-end render.
# Per fixture topic: grounded fact packet from Wikipedia (verbatim quotes, numbers inside quotes) → outline + chapter writer
# (narration AND picture brief per beat) → deterministic lints (incl. every brief through the M2 prompt compiler) + reviewer
# → ≤ AGD_MAX_REWRITES targeted rewrites → beat_sheet.json, m2_fixture.json, storyboard.md, review.json/md in artifact
# agyata-m1-review-<run>. User 2026-10-21: run on the self-hosted Mac with the LOCAL gemma-4 from the HF cache
# (mlx_vlm server + Ollama-protocol shim, think=false) — no cloud LLM. Lane mac-llm: a second runner on the same Mac (labels
# mac-llm only, so legacy jobs never land on it), beside M2 on mac-img. Ports 8181/8182/11635/11636 belong to this lane (8081 and
# 11535 are mac-img's); cleanup is by port, never by name.
# Canonical copy: tools/ci/m1-content.yml in the private repo; the live copy is the public shell's.
name: m1-content
on:
  workflow_dispatch:
    inputs:
      pipeline_ref: { description: 'ref of umausp/agyata-pipeline-private', default: 'feat/longform-studio' }
      only: { description: 'topic ids (empty = all fixture topics)', default: '' }
      minutes: { description: 'target documentary length in minutes', default: '6' }
      research: { description: 'library (local Wikipedia dossier) or live', default: 'library' }
      quality_bar: { description: 'every rubric aspect must reach this (minimum, not average)', default: '9' }
      drafts: { description: 'best-of-N drafts per chapter', default: '3' }
concurrency: { group: mac-llm, cancel-in-progress: false }
jobs:
  m1:
    runs-on: [mac-llm]
    timeout-minutes: 300
    env:
      AGD_TOPICS: packages/agyata-doc/content/fixtures/topics.json
      AGD_ONLY: ${{ inputs.only }}
      AGD_MINUTES: ${{ inputs.minutes }}
      AGD_LLM_URL: http://127.0.0.1:11635
      AGD_LOCAL_MODEL: mlx-community/gemma-4-31b-it-4bit
      AGD_WRITER_MODEL: mlx-community/gemma-4-26b-a4b-it-4bit   # A: fast MoE writer (64 tok/s single, 110 at 4 parallel; probe 39857383031)
      AGD_WRITER_LLM_URL: http://127.0.0.1:11637
      AGD_REVIEW_MODEL: mlx-community/gemma-4-31b-it-4bit      # B: critic + final reviewer (quality)
      AGD_MAX_ROUNDS: '6'                                     # A/B rounds per chapter until the bar; per-beat rewrites keep rounds cheap
      AGD_QUALITY_BAR: ${{ inputs.quality_bar }}
      AGD_RESEARCH: ${{ inputs.research }}
      AGD_DRAFTS: ${{ inputs.drafts }}
      AGD_LLM_INFLIGHT: '8'                                   # requests in flight per model: the 26b's measured best is 8 parallel
      AGD_CHAPTER_CONCURRENCY: '4'                            # chapters in parallel; aggregate gain flattens past 4
      AGD_FACT_MODEL: mlx-community/gemma-3-12b-it-4bit   # facts are simple extraction: the faster 12B (cached on the Mac)
      AGD_FACT_LLM_URL: http://127.0.0.1:11636
      AGD_MAX_REWRITES: '2'
      AGD_LLM_TIMEOUT_S: '240'                                # longest call seen 70 s; one retry on timeout
      AGD_FACT_CONCURRENCY: '1'   # 2 only after a measured run proves mlx_vlm serves concurrent requests
    steps:
      - name: Checkout private pipeline (./pipeline)
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ inputs.pipeline_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: pipeline
      - name: Node 22 on PATH + unit suites (lints are the first gate)
        working-directory: pipeline
        run: |
          echo "$(brew --prefix node@22)/bin" >> "$GITHUB_PATH"; export PATH="$(brew --prefix node@22)/bin:$PATH"
          node --version
          node --test 'packages/agyata-doc/core/test/*_test.mjs' 'packages/agyata-doc/profiles/test/*_test.mjs' 'packages/agyata-doc/content/test/*_test.mjs' 'packages/agyata-doc/illustration/test/*_test.mjs'
      - name: Local gemma-4 (mlx_vlm, from the HF cache) behind the Ollama-protocol shim, think=false
        working-directory: pipeline
        run: |
          AGD_OUT="$RUNNER_TEMP/m1"; echo "AGD_OUT=$AGD_OUT" >> "$GITHUB_ENV"; mkdir -p "$AGD_OUT"
          echo "AGD_RESEARCH_CACHE=$HOME/.cache/agyata/research" >> "$GITHUB_ENV"   # Wikipedia responses cached on the Mac (429 avoidance)
          lane_kill() { for p in "$@"; do for pid in $(lsof -ti tcp:$p -sTCP:LISTEN 2>/dev/null); do kill -- -$pid 2>/dev/null || kill $pid 2>/dev/null || true; done; done; }
          lane_kill 8181 8182 8183 8184 11635 11636 11637   # a leftover from a killed run of THIS lane would hold the ports
          . "$HOME/.cache/lf-venv/bin/activate"
          python -c "import mlx_vlm" 2>/dev/null || lockf -k "$HOME/.cache/lf-venv.lock" uv pip install --quiet mlx-vlm   # no --upgrade: the other lane may be serving from this venv
          export HF_HUB_OFFLINE=1   # weights already in ~/.cache/huggingface; never download
          echo "gemma models in the HF cache:"; ls "$HOME/.cache/huggingface/hub" | grep -i gemma || true
          ls "$HOME/.cache/huggingface/hub" | grep -i 'gemma-4-31b' || { echo "::error::$AGD_LOCAL_MODEL not in the HF cache"; exit 1; }
          perl -MPOSIX -e 'POSIX::setsid(); exec @ARGV' python -m mlx_vlm.server --model "$AGD_LOCAL_MODEL" --port 8181 > "$AGD_OUT/mlx.log" 2>&1 < /dev/null &
          perl -MPOSIX -e 'POSIX::setsid(); exec @ARGV' node tools/ci/mlx_ollama_shim.mjs --listen 11635 --upstream http://127.0.0.1:8181 --model "$AGD_LOCAL_MODEL" > "$AGD_OUT/shim.log" 2>&1 < /dev/null &
          # The fact model is ungated (Gemma licence, ~8 GB): fetched once into the HF cache, then offline like the rest.
          ls "$HOME/.cache/huggingface/hub" | grep -qi 'gemma-3-12b' || HF_HUB_OFFLINE=0 lockf -k "$HOME/.cache/hf-fetch.lock" python -c "import sys; from huggingface_hub import snapshot_download; snapshot_download(sys.argv[1])" "$AGD_FACT_MODEL"
          ls "$HOME/.cache/huggingface/hub" | grep -i 'gemma-3-12b' || { echo "::error::$AGD_FACT_MODEL not in the HF cache"; exit 1; }
          perl -MPOSIX -e 'POSIX::setsid(); exec @ARGV' python -m mlx_vlm.server --model "$AGD_FACT_MODEL" --port 8182 > "$AGD_OUT/mlx_fact.log" 2>&1 < /dev/null &
          perl -MPOSIX -e 'POSIX::setsid(); exec @ARGV' node tools/ci/mlx_ollama_shim.mjs --listen 11636 --upstream http://127.0.0.1:8182 --model "$AGD_FACT_MODEL" > "$AGD_OUT/shim_fact.log" 2>&1 < /dev/null &
          # A: the writer (gemma-4-26b-a4b, ungated, Apache-2.0, ~15 GB; fetched once, resumable) on its own server.
          if ! ls "$HOME/.cache/huggingface/hub" | grep -qi 'gemma-4-26b-a4b'; then
            for t in 1 2 3 4 5; do HF_HUB_OFFLINE=0 HF_HUB_DOWNLOAD_TIMEOUT=60 lockf -k "$HOME/.cache/hf-fetch.lock" python -c "import sys; from huggingface_hub import snapshot_download; snapshot_download(sys.argv[1])" "$AGD_WRITER_MODEL" && break; sleep 10; done
          fi
          perl -MPOSIX -e 'POSIX::setsid(); exec @ARGV' python -m mlx_vlm.server --model "$AGD_WRITER_MODEL" --port 8183 > "$AGD_OUT/mlx_writer.log" 2>&1 < /dev/null &
          perl -MPOSIX -e 'POSIX::setsid(); exec @ARGV' node tools/ci/mlx_ollama_shim.mjs --listen 11637 --upstream http://127.0.0.1:8183 --model "$AGD_WRITER_MODEL" > "$AGD_OUT/shim_writer.log" 2>&1 < /dev/null &
          for i in $(seq 1 120); do
            R=$(curl -s -m 120 http://127.0.0.1:11635/api/chat -d '{"model":"x","stream":false,"think":false,"messages":[{"role":"user","content":"Reply with the single word: ok"}],"options":{"num_predict":8}}' || true)
            R2=$(curl -s -m 120 http://127.0.0.1:11636/api/chat -d '{"model":"x","stream":false,"think":false,"messages":[{"role":"user","content":"Reply with the single word: ok"}],"options":{"num_predict":8}}' || true)
            R3=$(curl -s -m 120 http://127.0.0.1:11637/api/chat -d '{"model":"x","stream":false,"think":false,"messages":[{"role":"user","content":"Reply with the single word: ok"}],"options":{"num_predict":8}}' || true)
            echo "$R" | grep -q '"done":true' && echo "$R2" | grep -q '"done":true' && echo "$R3" | grep -q '"done":true' && { echo "all three local models ready after ~$((i*10)) s"; exit 0; }
            sleep 10
          done
          echo "::error::local model did not come up"; tail -30 "$AGD_OUT/mlx.log" "$AGD_OUT/shim.log"; exit 1
      - name: Local Wikipedia library (Postgres query service on 8184; required for research=library)
        if: inputs.research == 'library'
        working-directory: pipeline
        run: bash tools/ci/lanes/start_library.sh "$AGD_OUT"
      - name: M1 run (research → write → lint + review → rewrites → storyboard)
        working-directory: pipeline
        run: node packages/agyata-doc/content/bin/m1_run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agyata-m1-review-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m1
            !${{ runner.temp }}/m1/*.log
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agyata-m1-logs-${{ github.run_id }}
          path: ${{ runner.temp }}/m1/*.log
          retention-days: 7
      - name: Cleanup
        if: always()
        run: |
          lane_kill() { for p in "$@"; do for pid in $(lsof -ti tcp:$p -sTCP:LISTEN 2>/dev/null); do kill -- -$pid 2>/dev/null || kill $pid 2>/dev/null || true; done; done; }
          lane_kill 8181 8182 8183 8184 11635 11636 11637; rm -rf "$RUNNER_TEMP/m1"
