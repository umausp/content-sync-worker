# 1-minute network probe of the self-hosted Mac: download/upload speed to a CDN and to GitHub (the lane moves 200-300 MB of state each way).
name: selfhosted-netcheck
on: workflow_dispatch
concurrency: { group: selfhosted-verify, cancel-in-progress: false }
jobs:
  net:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 10
    steps:
      - name: Speeds
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          sp() { curl -s -o /dev/null -m 40 -w "$1: %{speed_download} B/s down, %{size_download} bytes in %{time_total}s\n" "${@:2}"; }
          sp "cloudflare 50MB" "https://speed.cloudflare.com/__down?bytes=52428800"
          sp "github codeload (pipeline repo tarball)" -H "Authorization: Bearer $GH_TOKEN" -L "https://api.github.com/repos/${{ github.repository }}/tarball/main"
          sp "huggingface (config.json)" "https://huggingface.co/bert-base-uncased/resolve/main/model.safetensors" --range 0-20000000
          head -c 20000000 /dev/zero > "$RUNNER_TEMP/up.bin"
          curl -s -o /dev/null -m 60 -w "cloudflare upload 20MB: %{speed_upload} B/s up in %{time_total}s\n" --data-binary @"$RUNNER_TEMP/up.bin" "https://speed.cloudflare.com/__up"
          rm -f "$RUNNER_TEMP/up.bin"
          echo "proxy env: ${HTTPS_PROXY:-none} ${https_proxy:-none}"; scutil --proxy 2>/dev/null | grep -E 'HTTPSEnable|HTTPSProxy' || true
          networksetup -getairportnetwork en0 2>/dev/null || true
      - name: Make a 100 MB incompressible file
        run: head -c 104857600 /dev/urandom > "$RUNNER_TEMP/blob.bin"; echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - name: GitHub artifact UPLOAD from the Mac (100 MB)
        uses: actions/upload-artifact@v4
        with:
          name: netcheck-${{ github.run_id }}
          path: ${{ runner.temp }}/blob.bin
          retention-days: 1
          compression-level: 0
      - name: GitHub artifact DOWNLOAD to the Mac via curl (same artifact)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "upload step finished; elapsed since file made: $(( $(date +%s) - T0 )) s"
          ID=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" | jq -r '.artifacts[0].id')
          curl -sSL -m 180 -o /dev/null -w "github artifact download: %{speed_download} B/s, %{size_download} bytes in %{time_total}s\n" -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/artifacts/$ID/zip"
          rm -f "$RUNNER_TEMP/blob.bin"
