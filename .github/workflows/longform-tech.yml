name: longform-tech

# Render ONE long-form documentary for Agyata Tech (internal slug 'nl') and upload it to that
# channel's own YouTube token. Dispatched by agyata-cron-pinger (DOC_SLOTS). Public repo =
# free minutes. Never on pull_request. The jobs live in _longform-doc.yml (prepare -> parallel
# chapter render -> finalize); this file only names the channel.
#
# script_only=true runs only the front half (topic -> research -> writer/critic script) and
# publishes the script/critic/validation JSON as the doc-script artifact for quality review.

run-name: longform-tech ${{ inputs.format }}${{ inputs.script_only && ' script-only' || '' }}

on:
  workflow_dispatch:
    inputs:
      pipeline_ref:
        description: 'agyata-pipeline-private branch/ref to run (empty = default branch; cron leaves it empty)'
        type: string
        default: ''
        required: false
      format:
        description: 'mid (watch-hours lane) or flagship (weekly long-form)'
        type: choice
        options: [mid, flagship]
        default: mid
        required: false
      privacy:
        description: 'YouTube privacy for the upload'
        type: choice
        options: [public, unlisted, private]
        default: unlisted
        required: false
      script_only:
        description: 'Run only the script front half (no ffmpeg/TTS, no render, no upload); still uploads work/doc/*.json'
        type: boolean
        default: false
        required: false

concurrency:
  # one doc run per channel per ref at a time; a second dispatch queues behind it
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read # artifacts only, nothing committed back to the repo

jobs:
  doc:
    uses: ./.github/workflows/_longform-doc.yml
    with:
      channel: 'nl'
      name: longform-tech
      pipeline_ref: ${{ inputs.pipeline_ref }}
      format: ${{ inputs.format }}
      privacy: ${{ inputs.privacy }}
      script_only: ${{ inputs.script_only }}
    secrets: inherit
