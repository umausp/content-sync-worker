name: music-visual-preview

# Photoreal music-visual preview.
#  gen    - (optional) generate FLUX.1-schnell stills on CPU with stable-diffusion.cpp
#  maps   - (optional, motion_ab or sr) CPU depth + semantic masks (make_maps.py) and super-resolution
#           comparison (sr_swinir.py, 3 models) per scene
#  i2v    - (optional, i2v_scene; 'all' = every scene of the render list in ONE warm process) LTX-Video 2B
#           image-to-video CPU probe; prompt embeddings cached across runs so T5 is skipped on a hit
#  render - motion.sh loop render + loop check + thumbnail + report, per scene
#           (motion_ab=true also renders motion v2 and a v1-over-v2 comparison clip)
# Pipeline code is checked out from the PRIVATE repo; this public shell only holds the workflow.

on:
  workflow_dispatch:
    inputs:
      pipeline_ref:
        description: "agyata-pipeline-private ref to check out"
        required: false
        default: feat/photoreal-scenes
        type: string
      generate:
        description: "comma list of scene ids to (re)generate stills for on CI, or none"
        required: false
        default: beta_work
        type: string
      render:
        description: "comma list of scene ids to render previews for; empty = the generate list (or the 3 original scenes)"
        required: false
        default: ''
        type: string
      gen_size:
        description: "FLUX generation size WxH (multiples of 16), upscaled to 1920x1080"
        required: false
        default: 1344x768
        type: string
      e2e_minutes:
        description: "minutes for the end-to-end build_mix run (live profile, focus slot); 0 = skip"
        required: false
        default: '0'
        type: string
      motion_ab:
        description: "'true' = also render motion v2 (depth+masks) and an A/B clip (v1 top / v2 bottom)"
        required: false
        default: 'false'
        type: string
      stills_run_id:
        description: "run id of a previous run of this workflow to pull still-<scene> artifacts from when no still is generated in this run"
        required: false
        default: ''
        type: string
      sr:
        description: "'true' = run the super-resolution comparison (3 models) in the maps job"
        required: false
        default: 'false'
        type: string
      i2v_scene:
        description: "scene id to run the LTX-Video image-to-video CPU probe on, or 'all' = every scene in the render list (one warm process); empty = skip"
        required: false
        default: ''
        type: string
      gen_opts:
        description: "space-separated KEY=VAL env for the gen job; allowed keys: SD_VAE_TILING (0|1), UPSCALER (lanczos|swinir), SR_MODEL, MOTION_ENGINE (v1|v2; also used by e2e), SD_CACHE_MODE (easycache|dbcache|cache-dit), SD_FLASH_ATTN"
        required: false
        default: ''
        type: string
  push:
    branches: [feat/photoreal-preview]
    paths: [.github/workflows/music-visual-preview.yml]

permissions:
  contents: read
  actions: read   # cross-run artifact download (stills_run_id)

env:
  SDCPP_TAG: master-975-95b3090
  PIPELINE_DIR: pipeline/shorts/music_mix/photoreal
  # authenticated HF downloads (higher rate limits) for transformers/diffusers/hf_hub in every job
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  setup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gen: ${{ steps.matrix.outputs.gen }}
      render: ${{ steps.matrix.outputs.render }}
    steps:
      - id: matrix
        env:
          GEN_INPUT: ${{ github.event.inputs.generate }}
          RENDER_INPUT: ${{ github.event.inputs.render }}
        run: |
          tojson() { printf '%s' "$1" | jq -R -c 'split(",") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))'; }
          LIST="${GEN_INPUT:-beta_work}"
          [ "$LIST" = none ] && LIST=""
          JSON=$(tojson "$LIST")
          RLIST="${RENDER_INPUT:-$LIST}"
          [ -z "$RLIST" ] && RLIST="ceo_dawn,rain_forest,beta_work"
          RJSON=$(tojson "$RLIST")
          echo "gen=$JSON" >> "$GITHUB_OUTPUT"
          echo "render=$RJSON" >> "$GITHUB_OUTPUT"
          echo "generate list: $JSON  render list: $RJSON"

  gen:
    needs: setup
    if: ${{ needs.setup.outputs.gen != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON(needs.setup.outputs.gen) }}
    steps:
      - name: Checkout pipeline (private)
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ github.event.inputs.pipeline_ref || 'feat/photoreal-scenes' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: pipeline

      - name: Free disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Install ffmpeg, jq, unzip
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq unzip

      - name: Download pinned stable-diffusion.cpp release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DL="$RUNNER_TEMP/sdcpp"
          mkdir -p "$DL/x"
          gh release download "$SDCPP_TAG" -R leejet/stable-diffusion.cpp \
            -p '*-bin-Linux-Ubuntu-24.04-x86_64.zip' -D "$DL"
          unzip -q "$DL"/*.zip -d "$DL/x"
          BIN=""
          for name in sd-cli sd; do
            found=$(find "$DL/x" -type f -name "$name" | head -1)
            if [ -n "$found" ]; then BIN="$found"; break; fi
          done
          if [ -z "$BIN" ]; then echo "no sd-cli/sd binary in release zip"; find "$DL/x" | head -50; exit 1; fi
          chmod +x "$BIN"
          echo "SD_BIN=$BIN" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$(dirname "$BIN"):${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "found binary: $BIN"
          ls -la "$(dirname "$BIN")"
          LD_LIBRARY_PATH="$(dirname "$BIN")" ldd "$BIN" | grep -i 'not found' && exit 1 || true

      - name: Download FLUX.1-schnell weights
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          M="$HOME/sdmodels"
          mkdir -p "$M"
          dl() { curl -fL --retry 3 -H "Authorization: Bearer $HF_TOKEN" -o "$M/$2" "$1"; }
          dl https://huggingface.co/city96/FLUX.1-schnell-gguf/resolve/main/flux1-schnell-Q4_K_S.gguf flux1-schnell-Q4_K_S.gguf
          dl https://huggingface.co/city96/t5-v1_1-xxl-encoder-gguf/resolve/main/t5-v1_1-xxl-encoder-Q5_K_M.gguf t5-v1_1-xxl-encoder-Q5_K_M.gguf
          dl https://huggingface.co/comfyanonymous/flux_text_encoders/resolve/main/clip_l.safetensors clip_l.safetensors
          dl https://huggingface.co/black-forest-labs/FLUX.1-schnell/resolve/main/ae.safetensors ae.safetensors
          ls -la "$M"
          df -h /

      - name: Python venv (CPU torch) for Real-ESRGAN
        run: |
          python3 -m venv "$HOME/venv"
          . "$HOME/venv/bin/activate"
          pip install -q --upgrade pip
          pip install -q torch==2.14.1 torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -q timm==1.0.30 pillow numpy opencv-python-headless
          echo "$HOME/venv/bin" >> "$GITHUB_PATH"

      - name: Generate still
        env:
          SCENE: ${{ matrix.scene }}
          GEN_SIZE: ${{ github.event.inputs.gen_size || '1344x768' }}
          GEN_OPTS: ${{ github.event.inputs.gen_opts }}
        run: |
          set -o pipefail
          export GEN_W="${GEN_SIZE%x*}" GEN_H="${GEN_SIZE#*x}"
          # production default (as music-scene-refresh): Real-ESRGAN x2 on the native still; gen_opts may override
          export UPSCALER=swinir SR_MODEL=realesrgan_x2plus
          # gen_opts: space-separated KEY=VAL, allow-listed keys only (value charset restricted)
          for kv in $GEN_OPTS; do
            k="${kv%%=*}"; v="${kv#*=}"
            case "$k" in
              SD_VAE_TILING|UPSCALER|SR_MODEL|MOTION_ENGINE|SD_CACHE_MODE|SD_FLASH_ATTN) ;;
              *) echo "gen_opts: key '$k' not allowed (SD_VAE_TILING, UPSCALER, SR_MODEL)"; exit 1 ;;
            esac
            [[ "$kv" == *=* && "$v" =~ ^[A-Za-z0-9_.-]+$ ]] || { echo "gen_opts: bad value in '$kv'"; exit 1; }
            export "$k=$v"; echo "gen_opts: $k=$v"
          done
          mkdir -p "$GITHUB_WORKSPACE/out"
          bash "$GITHUB_WORKSPACE/$PIPELINE_DIR/gen_still.sh" "$SCENE" \
            "$GITHUB_WORKSPACE/out/$SCENE.png" "$HOME/sdmodels" 2>&1 | tee "$GITHUB_WORKSPACE/out/gen_$SCENE.log"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Upload still
        uses: actions/upload-artifact@v4
        with:
          name: still-${{ matrix.scene }}
          path: |
            out/${{ matrix.scene }}.png
            out/${{ matrix.scene }}.webp
            out/${{ matrix.scene }}.raw.png
            out/gen_${{ matrix.scene }}.log
          retention-days: 3
          if-no-files-found: error

  maps:
    needs: [setup, gen]
    if: ${{ always() && needs.setup.result == 'success' && needs.setup.outputs.render != '[]' && (github.event.inputs.motion_ab == 'true' || github.event.inputs.sr == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON(needs.setup.outputs.render) }}
    steps:
      - name: Checkout pipeline (private)
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ github.event.inputs.pipeline_ref || 'feat/photoreal-scenes' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: pipeline

      - name: Install ffmpeg, jq, time
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq time

      - name: Download generated still (if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: still-${{ matrix.scene }}
          path: gen

      - name: Download still from earlier run (stills_run_id)
        if: ${{ github.event.inputs.stills_run_id != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: still-${{ matrix.scene }}
          path: prev
          run-id: ${{ github.event.inputs.stills_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve still
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          SCENES="$GITHUB_WORKSPACE/$PIPELINE_DIR/scenes.json"
          COMMITTED=$(jq -r --arg id "$SCENE" '.[] | select(.id == $id) | .still' "$SCENES")
          SRC=""
          if [ -s "$GITHUB_WORKSPACE/gen/$SCENE.png" ]; then
            STILL="$GITHUB_WORKSPACE/gen/$SCENE.png"; SRC="generated-on-ci"
          elif [ -s "$GITHUB_WORKSPACE/gen/$SCENE.webp" ]; then
            STILL="$GITHUB_WORKSPACE/gen/$SCENE.webp"; SRC="generated-on-ci"
          elif [ -s "$GITHUB_WORKSPACE/prev/$SCENE.png" ]; then
            STILL="$GITHUB_WORKSPACE/prev/$SCENE.png"; SRC="run:${{ github.event.inputs.stills_run_id }}"
          elif [ -s "$GITHUB_WORKSPACE/prev/$SCENE.webp" ]; then
            STILL="$GITHUB_WORKSPACE/prev/$SCENE.webp"; SRC="run:${{ github.event.inputs.stills_run_id }}"
          elif [ -n "$COMMITTED" ] && [ "$COMMITTED" != null ] && [ -s "$GITHUB_WORKSPACE/$PIPELINE_DIR/$COMMITTED" ]; then
            STILL="$GITHUB_WORKSPACE/$PIPELINE_DIR/$COMMITTED"; SRC="committed:$COMMITTED"
          elif [ "$SCENE" = "beta_work" ] && [ -s "$GITHUB_WORKSPACE/$PIPELINE_DIR/stills/beta_work_zerogpu_draft.webp" ]; then
            STILL="$GITHUB_WORKSPACE/$PIPELINE_DIR/stills/beta_work_zerogpu_draft.webp"; SRC="draft:beta_work_zerogpu_draft.webp"
          else
            echo "no still available for $SCENE"; exit 1
          fi
          echo "STILL=$STILL" >> "$GITHUB_ENV"
          echo "STILL_SRC=$SRC" >> "$GITHUB_ENV"
          echo "still: $STILL ($SRC)"

      # SR weights only (Real-ESRGAN ~67 MB, SwinIR). HF model weights (DA2-small, dpt-large-ade ~1.5 GB) are NOT
      # cached: the HF CDN download is fast and the repo cache is at its 10 GB cap.
      - name: Cache SR weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/sr_swinir
          key: maps-sr-weights-v1

      - name: Pinned requirements (venv cache key)
        run: |
          R="$GITHUB_WORKSPACE/.venv-reqs"; mkdir -p "$R"
          PYV=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          printf '%s\n' "# python $PYV" '--index-url https://download.pytorch.org/whl/cpu' 'torch==2.14.1' 'torchvision' > "$R/maps-torch.txt"
          printf '%s\n' "# python $PYV" 'transformers==5.20.1' 'pillow' 'numpy' 'opencv-python-headless' 'timm==1.0.30' 'accelerate==1.15.0' > "$R/maps-rest.txt"

      - name: Cache venv
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-maps-v1-${{ runner.os }}-${{ hashFiles('.venv-reqs/maps-*.txt') }}

      - name: Python venv + CPU torch stack
        env:
          VENV_HIT: ${{ steps.venv.outputs.cache-hit }}
        run: |
          CHECK='from transformers import AutoImageProcessor, AutoModelForDepthEstimation, DPTForSemanticSegmentation; import torch, timm, cv2, PIL, numpy; print("imports ok", torch.__version__)'
          if [ "$VENV_HIT" = true ] && "$HOME/venv/bin/python" -c "$CHECK"; then
            echo "venv cache hit: skipping pip install"
          else
            rm -rf "$HOME/venv"
            python3 -m venv "$HOME/venv"
            . "$HOME/venv/bin/activate"
            pip install -q --upgrade pip
            pip install -q -r "$GITHUB_WORKSPACE/.venv-reqs/maps-torch.txt"
            pip install -q -r "$GITHUB_WORKSPACE/.venv-reqs/maps-rest.txt"
            python -c "$CHECK"
          fi
          . "$HOME/venv/bin/activate"
          pip list 2>/dev/null | grep -iE '^(torch|transformers|timm|pillow|numpy|opencv)' || true

      - name: Depth + masks (make_maps.py)
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          . "$HOME/venv/bin/activate"
          D="$GITHUB_WORKSPACE/out/maps_$SCENE"
          mkdir -p "$D"
          /usr/bin/time -v -o "$D/maps_time.txt" \
            python "$GITHUB_WORKSPACE/$PIPELINE_DIR/make_maps.py" "$STILL" "$D/m" 2>&1 | tee "$D/maps.log"
          mv "$D/m.depth.png" "$D/depth.png"
          mv "$D/m.mask.png" "$D/mask.png"
          mv "$D/m.maps_preview.jpg" "$D/maps_preview.jpg"
          grep -E 'Elapsed|Maximum resident' "$D/maps_time.txt" | tee -a "$D/timing.txt"
          { echo "### maps $SCENE"; grep -E 'maps elapsed_s|group ' "$D/maps.log"; } >> "$GITHUB_STEP_SUMMARY"
          ls -la "$D"

      - name: Super-resolution comparison (3 models)
        if: ${{ github.event.inputs.sr == 'true' }}
        continue-on-error: true
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          . "$HOME/venv/bin/activate"
          D="$GITHUB_WORKSPACE/out/maps_$SCENE"
          for M in realsr_m_x2_gan classical_m_x2 realesrgan_x2plus; do
            echo "== $M"
            /usr/bin/time -v -o "$D/sr_$M.time.txt" \
              python "$GITHUB_WORKSPACE/$PIPELINE_DIR/sr_swinir.py" "$STILL" "$D/sr_$M.png" --model "$M" 2>&1 | tee "$D/sr_$M.log" \
              || echo "sr $M FAILED"
            {
              echo "[$M]"
              grep -E '^sr elapsed_s' "$D/sr_$M.log" || echo "no result"
              grep -E 'Elapsed|Maximum resident' "$D/sr_$M.time.txt" || true
            } >> "$D/sr_timing.txt"
          done
          cat "$D/sr_timing.txt"
          { echo "### sr $SCENE"; echo '```'; cat "$D/sr_timing.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          ls -la "$D"

      - name: Upload maps
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: maps-${{ matrix.scene }}
          path: |
            out/maps_${{ matrix.scene }}/depth.png
            out/maps_${{ matrix.scene }}/mask.png
            out/maps_${{ matrix.scene }}/maps_preview.jpg
            out/maps_${{ matrix.scene }}/sr_*.png
            out/maps_${{ matrix.scene }}/*.compare.png
            out/maps_${{ matrix.scene }}/*.txt
            out/maps_${{ matrix.scene }}/*.log
          retention-days: 3
          if-no-files-found: warn

  i2v:
    needs: [setup, gen]
    if: ${{ always() && needs.setup.result == 'success' && github.event.inputs.i2v_scene != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      I2V_SCENE: ${{ github.event.inputs.i2v_scene }}
      RENDER_JSON: ${{ needs.setup.outputs.render }}
    steps:
      - name: Checkout pipeline (private)
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ github.event.inputs.pipeline_ref || 'feat/photoreal-scenes' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: pipeline

      - name: Free disk and add swap
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost /usr/share/swift /usr/local/.ghcup /usr/local/lib/node_modules || true
          sudo apt-get clean || true
          sudo docker image prune --all --force >/dev/null 2>&1 || true
          sudo swapoff -a || true
          sudo fallocate -l 12G /swapfile && sudo chmod 600 /swapfile && sudo mkswap /swapfile && sudo swapon /swapfile || true
          df -h /; free -g

      - name: Install ffmpeg, jq, time
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq time

      # merge-multiple: stills of every scene land flat in gen/ (<scene>.png etc. are unique per scene)
      - name: Download generated stills (if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: still-*
          merge-multiple: true
          path: gen

      - name: Download stills from earlier run (stills_run_id)
        if: ${{ github.event.inputs.stills_run_id != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: still-*
          merge-multiple: true
          path: prev
          run-id: ${{ github.event.inputs.stills_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve stills
        run: |
          SCENES="$GITHUB_WORKSPACE/$PIPELINE_DIR/scenes.json"
          if [ "$I2V_SCENE" = all ]; then LIST=$(printf '%s' "$RENDER_JSON" | jq -r '.[]'); else LIST="$I2V_SCENE"; fi
          ITEMS='[]'
          for SCENE in $LIST; do
            COMMITTED=$(jq -r --arg id "$SCENE" '.[] | select(.id == $id) | .still' "$SCENES")
            STILL=""
            for c in "gen/$SCENE.png" "gen/$SCENE.webp" "prev/$SCENE.png" "prev/$SCENE.webp" "$PIPELINE_DIR/$COMMITTED" "$PIPELINE_DIR/stills/beta_work_zerogpu_draft.webp"; do
              if [ -s "$GITHUB_WORKSPACE/$c" ] && [ "${c##*/}" != "null" ]; then STILL="$GITHUB_WORKSPACE/$c"; break; fi
            done
            if [ -z "$STILL" ]; then echo "no still available for $SCENE, skipping"; continue; fi
            echo "still: $SCENE -> $STILL"
            echo "STILL=$STILL" >> "$GITHUB_ENV"   # last one wins; only used by the single-scene path
            ITEMS=$(jq -c --arg s "$STILL" --arg o "$GITHUB_WORKSPACE/out/i2v_$SCENE/i2v.mp4" '. + [{still: $s, out: $o}]' <<<"$ITEMS")
          done
          [ "$ITEMS" != '[]' ] || { echo "no still available for any scene"; exit 1; }
          mkdir -p "$GITHUB_WORKSPACE/out"
          printf '%s' "$ITEMS" > "$GITHUB_WORKSPACE/out/i2v_items.json"
          echo "i2v items: $(jq -c 'map(.out)' <<<"$ITEMS")"

      - name: Pinned requirements (venv cache key)
        run: |
          R="$GITHUB_WORKSPACE/.venv-reqs"; mkdir -p "$R"
          PYV=$(python3 -c 'import sys; print("%d.%d" % sys.version_info[:2])')
          printf '%s\n' "# python $PYV" '--index-url https://download.pytorch.org/whl/cpu' 'torch==2.14.1' 'torchvision' > "$R/i2v-torch.txt"
          printf '%s\n' "# python $PYV" 'diffusers==0.41.0' 'transformers==5.20.1' 'accelerate==1.15.0' 'sentencepiece==0.2.2' 'safetensors' 'pillow' 'numpy' 'protobuf' > "$R/i2v-rest.txt"

      # venv only (CPU torch ~1 GB). HF model weights (T5 9.5 GB, LTX 6.3 GB) are deliberately NOT cached.
      - name: Cache venv
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/venv
          key: venv-i2v-v1-${{ runner.os }}-${{ hashFiles('.venv-reqs/i2v-*.txt') }}

      - name: Python venv + diffusers stack (pinned)
        env:
          VENV_HIT: ${{ steps.venv.outputs.cache-hit }}
        run: |
          CHECK='import torch, diffusers, transformers, sentencepiece, accelerate, PIL, numpy; print("imports ok", torch.__version__, diffusers.__version__)'
          if [ "$VENV_HIT" = true ] && "$HOME/venv/bin/python" -c "$CHECK"; then
            echo "venv cache hit: skipping pip install"
          else
            rm -rf "$HOME/venv"
            python3 -m venv "$HOME/venv"
            . "$HOME/venv/bin/activate"
            pip install -q --upgrade pip
            pip install -q -r "$GITHUB_WORKSPACE/.venv-reqs/i2v-torch.txt"
            pip install -q -r "$GITHUB_WORKSPACE/.venv-reqs/i2v-rest.txt"
            python -c "$CHECK"
          fi
          . "$HOME/venv/bin/activate"
          pip list 2>/dev/null | grep -iE '^(torch|diffusers|transformers|accelerate|sentencepiece|huggingface)' || true

      # Prompt-embedding cache (tiny .pt files): a hit skips the 215 s T5 download+load+encode. Accumulates across runs.
      - name: Prepare embed cache dir
        run: mkdir -p "$HOME/.cache/agyata/ltx_embeds"

      - name: Cache i2v prompt embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/agyata/ltx_embeds
          key: i2v-embeds-v1-${{ hashFiles('pipeline/shorts/music_mix/photoreal/i2v_ltx_probe.py') }}-${{ github.run_id }}
          restore-keys: |
            i2v-embeds-v1-

      - name: LTX-Video 2B image-to-video probe
        run: |
          . "$HOME/venv/bin/activate"
          P="$GITHUB_WORKSPACE/$PIPELINE_DIR/i2v_ltx_probe.py"
          E="$HOME/.cache/agyata/ltx_embeds"
          set +e
          if [ "$I2V_SCENE" = all ]; then
            # warm mode: one process, transformer + VAE loaded once, embeds cached per prompt
            python "$P" --prompts-json "$GITHUB_WORKSPACE/out/i2v_items.json" --embed-cache "$E" \
              --width 768 --height 432 --frames 49 --steps 8 --budget-min 70 \
              --report "$GITHUB_WORKSPACE/out/i2v_batch.report.json" 2>&1 | tee "$GITHUB_WORKSPACE/out/i2v_batch.log"
            echo "probe rc=${PIPESTATUS[0]}"
            set -e
            { echo "### i2v all"; echo '```'; jq -c '.items[] | {out, status, gen_s, item_s, sec_per_step}' "$GITHUB_WORKSPACE/out/i2v_batch.report.json" 2>/dev/null || echo "no report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            ls -laR "$GITHUB_WORKSPACE/out" | head -60; df -h /
          else
            D="$GITHUB_WORKSPACE/out/i2v_$I2V_SCENE"
            mkdir -p "$D"
            python "$P" "$STILL" "$D/i2v.mp4" --embed-cache "$E" \
              --width 768 --height 432 --frames 49 --steps 8 --budget-min 70 --report "$D/i2v_report.json" 2>&1 | tee "$D/i2v.log"
            echo "probe rc=${PIPESTATUS[0]}"
            set -e
            { echo "### i2v $I2V_SCENE"; echo '```'; cat "$D/i2v_report.json" 2>/dev/null || echo "no report"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            ls -la "$D"; df -h /
          fi

      - name: Upload i2v
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: i2v-${{ github.event.inputs.i2v_scene }}
          path: |
            out/i2v_*/i2v.mp4
            out/i2v_*/i2v_report.json
            out/i2v_*/i2v.report.json
            out/i2v_*/i2v.log
            out/i2v_batch.report.json
            out/i2v_batch.log
          retention-days: 3
          if-no-files-found: warn

  render:
    needs: [setup, gen, maps]
    if: ${{ always() && needs.setup.result == 'success' && needs.setup.outputs.render != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        scene: ${{ fromJSON(needs.setup.outputs.render) }}
    steps:
      - name: Checkout pipeline (private)
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ github.event.inputs.pipeline_ref || 'feat/photoreal-scenes' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: pipeline

      - name: Install ffmpeg, jq, time
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg jq time

      - name: Install motion v2 prerequisites (fonts, python deps)
        if: ${{ github.event.inputs.motion_ab == 'true' }}
        run: |
          sudo apt-get install -y fonts-dejavu python3 python3-pip
          python3 -m pip install -q --user --break-system-packages opencv-python-headless numpy
          python3 -c 'import cv2, numpy; print("cv2", cv2.__version__, "numpy", numpy.__version__)'

      - name: Download generated still (if any)
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: still-${{ matrix.scene }}
          path: gen

      - name: Download still from earlier run (stills_run_id)
        if: ${{ github.event.inputs.stills_run_id != '' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: still-${{ matrix.scene }}
          path: prev
          run-id: ${{ github.event.inputs.stills_run_id }}
          github-token: ${{ github.token }}

      - name: Resolve still and scene metadata
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          SCENES="$GITHUB_WORKSPACE/$PIPELINE_DIR/scenes.json"
          get() { jq -r --arg id "$SCENE" ".[] | select(.id == \$id) | $1" "$SCENES"; }
          PROFILE=$(get .profile)
          WORDS=$(get .thumb_words)
          TAG=$(get .thumb_tag)
          COMMITTED=$(get .still)
          if [ "$PROFILE" = "null" ] || [ -z "$PROFILE" ]; then echo "scene $SCENE not in scenes.json"; exit 1; fi

          SRC=""
          if [ -s "$GITHUB_WORKSPACE/gen/$SCENE.png" ]; then
            STILL="$GITHUB_WORKSPACE/gen/$SCENE.png"; SRC="generated-on-ci"
          elif [ -s "$GITHUB_WORKSPACE/gen/$SCENE.webp" ]; then
            STILL="$GITHUB_WORKSPACE/gen/$SCENE.webp"; SRC="generated-on-ci"
          elif [ -s "$GITHUB_WORKSPACE/prev/$SCENE.png" ]; then
            STILL="$GITHUB_WORKSPACE/prev/$SCENE.png"; SRC="run:${{ github.event.inputs.stills_run_id }}"
          elif [ -s "$GITHUB_WORKSPACE/prev/$SCENE.webp" ]; then
            STILL="$GITHUB_WORKSPACE/prev/$SCENE.webp"; SRC="run:${{ github.event.inputs.stills_run_id }}"
          elif [ -s "$GITHUB_WORKSPACE/$PIPELINE_DIR/$COMMITTED" ]; then
            STILL="$GITHUB_WORKSPACE/$PIPELINE_DIR/$COMMITTED"; SRC="committed:$COMMITTED"
          elif [ "$SCENE" = "beta_work" ] && [ -s "$GITHUB_WORKSPACE/$PIPELINE_DIR/stills/beta_work_zerogpu_draft.webp" ]; then
            STILL="$GITHUB_WORKSPACE/$PIPELINE_DIR/stills/beta_work_zerogpu_draft.webp"; SRC="draft:beta_work_zerogpu_draft.webp"
          else
            echo "no still available for $SCENE"; exit 1
          fi
          {
            echo "PROFILE=$PROFILE"
            echo "WORDS=$WORDS"
            echo "TAG=$TAG"
            echo "STILL=$STILL"
            echo "STILL_SRC=$SRC"
          } >> "$GITHUB_ENV"
          echo "still: $STILL ($SRC) profile: $PROFILE"

      - name: Render loop segment (1920x1080, L=120, DUR=120)
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          OUT="$GITHUB_WORKSPACE/out/$SCENE"
          mkdir -p "$OUT"
          SEG="$RUNNER_TEMP/seg_$SCENE.mp4"
          /usr/bin/time -v -o "$RUNNER_TEMP/time_$SCENE.txt" \
            env MOTION_ENGINE="${{ github.event.inputs.motion_ab == 'true' && 'v1' || 'v2' }}" bash "$GITHUB_WORKSPACE/$PIPELINE_DIR/motion.sh" "$STILL" "$SEG" 1920 1080 120 120 "$PROFILE"
          ELAPSED=$(grep 'Elapsed (wall clock)' "$RUNNER_TEMP/time_$SCENE.txt" | awk '{print $NF}')
          RENDER_S=$(echo "$ELAPSED" | awk -F: '{s=0; for(i=1;i<=NF;i++) s=s*60+$i; print s}')
          RSS_KB=$(grep 'Maximum resident set size' "$RUNNER_TEMP/time_$SCENE.txt" | awk '{print $NF}')
          echo "RENDER_S=$RENDER_S" >> "$GITHUB_ENV"
          echo "RSS_KB=$RSS_KB" >> "$GITHUB_ENV"
          echo "SEG=$SEG" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -la "$SEG"

      - name: Preview clip, loop check, thumbnail
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          P="$GITHUB_WORKSPACE/$PIPELINE_DIR"
          ffmpeg -v error -y -i "$SEG" -t 30 -c copy "$OUT/preview_30s.mp4"
          bash "$P/thumb.sh" "$STILL" "$OUT/thumb.jpg" "$WORDS" "$TAG"
          cp "$STILL" "$OUT/still_used.${STILL##*.}"
          # loop check is informational here; its result is recorded in report.txt
          set +e
          bash "$P/check_loop.sh" "$SEG" 120 30 > "$RUNNER_TEMP/loop_$SCENE.txt" 2>&1
          echo "LOOP_RC=$?" >> "$GITHUB_ENV"
          set -e
          cat "$RUNNER_TEMP/loop_$SCENE.txt"

      - name: Write report
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          RT=$(awk -v r="$RENDER_S" 'BEGIN{printf "%.2f", r/120}')
          RSS_MB=$(awk -v k="${RSS_KB:-0}" 'BEGIN{printf "%.0f", k/1024}')
          VERDICT=$(grep -E '^loop verdict' "$RUNNER_TEMP/loop_$SCENE.txt" || echo "loop verdict: UNKNOWN (check_loop did not complete)")
          PROBE=$(ffprobe -v error -show_entries format=duration,size:stream=codec_name,width,height,avg_frame_rate \
                    -of compact "$OUT/preview_30s.mp4" 2>&1 || echo "ffprobe failed")
          {
            echo "scene: $SCENE  profile: $PROFILE  still: $STILL_SRC"
            echo "render_seconds: $RENDER_S  (output 120s; render/output = $RT, <1.0 is faster than realtime)"
            echo "max_rss_mb: $RSS_MB"
            echo "$VERDICT"
            grep -E 'seam_psnr|gop_boundary_psnr|looped' "$RUNNER_TEMP/loop_$SCENE.txt" || true
            echo "preview_30s.mp4: $PROBE"
            echo "check_loop_rc: $LOOP_RC"
          } | tee "$OUT/report.txt"
          cat "$OUT/report.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Download maps (motion_ab)
        if: ${{ github.event.inputs.motion_ab == 'true' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: maps-${{ matrix.scene }}
          path: maps

      - name: Motion v2 render, loop check, A/B clip
        if: ${{ github.event.inputs.motion_ab == 'true' }}
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          set -o pipefail
          P="$GITHUB_WORKSPACE/$PIPELINE_DIR"
          secs() { grep 'Elapsed (wall clock)' "$1" | awk '{print $NF}' | awk -F: '{s=0; for(i=1;i<=NF;i++) s=s*60+$i; print s}'; }

          # v1 outputs under their A/B names (v1 = the render above, default engine)
          cp "$OUT/preview_30s.mp4" "$OUT/preview_30s_v1.mp4"

          export MOTION_ENGINE=v2
          export MOTION_DEPTH="$GITHUB_WORKSPACE/maps/depth.png"
          export MOTION_MASK="$GITHUB_WORKSPACE/maps/mask.png"
          export MOTION_SCENE_OPTS=$(jq -c --arg id "$SCENE" '.[] | select(.id == $id) | .motion // {}' "$P/scenes.json")
          echo "maps: $(ls -la "$GITHUB_WORKSPACE/maps" 2>&1 | tr '\n' ' ')"
          [ -s "$MOTION_DEPTH" ] || echo "WARNING: depth map missing - motion.sh will fall back to v1 (A/B is then v1 vs v1)"
          echo "scene opts: $MOTION_SCENE_OPTS"

          SEG2="$RUNNER_TEMP/seg2_$SCENE.mp4"
          /usr/bin/time -v -o "$RUNNER_TEMP/time2_$SCENE.txt" \
            bash "$P/motion.sh" "$STILL" "$SEG2" 1920 1080 120 120 "$PROFILE" 2>&1 | tee "$RUNNER_TEMP/v2_$SCENE.log"
          unset MOTION_ENGINE MOTION_DEPTH MOTION_MASK MOTION_SCENE_OPTS
          echo "RENDER2_S=$(secs "$RUNNER_TEMP/time2_$SCENE.txt")" >> "$GITHUB_ENV"
          ls -la "$SEG2"

          ffmpeg -v error -y -i "$SEG2" -t 30 -c copy "$OUT/preview_30s_v2.mp4"
          set +e
          bash "$P/check_loop.sh" "$SEG2" 120 30 > "$RUNNER_TEMP/loop2_$SCENE.txt" 2>&1
          echo "LOOP2_RC=$?" >> "$GITHUB_ENV"
          set -e
          cat "$RUNNER_TEMP/loop2_$SCENE.txt"

          # v1 on top, v2 below, 1280x720 each -> 1280x1440
          F=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf
          DT="fontfile=$F:x=24:y=20:fontsize=40:fontcolor=white:box=1:boxcolor=black@0.55:boxborderw=10"
          ffmpeg -v error -y -i "$OUT/preview_30s_v1.mp4" -i "$OUT/preview_30s_v2.mp4" -filter_complex \
            "[0:v]scale=1280:720,drawtext=$DT:text='v1 (current)'[a];[1:v]scale=1280:720,drawtext=$DT:text='v2 (depth+masks)'[b];[a][b]vstack=inputs=2[v]" \
            -map "[v]" -an -c:v libx264 -preset veryfast -crf 20 -pix_fmt yuv420p -movflags +faststart "$OUT/ab_30s.mp4"
          # small review files (slow links): 12 s side-by-side at 960x270 each, frame sheets, v2 motion map
          ffmpeg -v error -y -i "$OUT/ab_30s.mp4" -t 12 -vf "scale=960:-2" -an -c:v libx264 -preset veryfast -crf 23 -movflags +faststart "$OUT/ab_small.mp4"
          ffmpeg -v error -y -i "$OUT/preview_30s_v1.mp4" -i "$OUT/preview_30s_v2.mp4" -filter_complex \
            "[0:v]select='eq(n\,150)',scale=960:-2[a];[1:v]select='eq(n\,150)',scale=960:-2[b];[a][b]hstack[v]" -map "[v]" -frames:v 1 -q:v 3 "$OUT/ab_frame.jpg"
          ffmpeg -v error -y -ss 5 -i "$OUT/preview_30s_v2.mp4" -ss 5.5 -i "$OUT/preview_30s_v2.mp4" -filter_complex \
            "[0:v]format=gbrp[p];[1:v]format=gbrp[q];[p][q]blend=all_mode=difference,lutrgb=r=val*6:g=val*6:b=val*6,scale=960:-2[v]" -map "[v]" -frames:v 1 -q:v 3 "$OUT/v2_motion.jpg" || true
          ffmpeg -v error -y -ss 10 -i "$OUT/preview_30s_v2.mp4" -vf "crop=640:360:640:540,fps=6" -t 2 -q:v 4 "$OUT/v2_crop_%02d.jpg" || true
          ls -la "$OUT"

      - name: Append A/B report
        if: ${{ github.event.inputs.motion_ab == 'true' }}
        env:
          SCENE: ${{ matrix.scene }}
        run: |
          {
            echo "--- motion A/B (v1 current vs v2 depth+masks) ---"
            echo "v1 render_seconds: $RENDER_S"
            grep -E '^loop verdict|seam_psnr|gop_boundary_psnr|looped' "$RUNNER_TEMP/loop_$SCENE.txt" | sed 's/^/v1 /' || true
            echo "v2 render_seconds: ${RENDER2_S:-unknown}  (target <= ~450 on 4 vCPU for 120 s)"
            grep -E '^loop verdict' "$RUNNER_TEMP/loop2_$SCENE.txt" | sed 's/^/v2 /' || echo "v2 loop verdict: UNKNOWN"
            grep -E 'seam_psnr|gop_boundary_psnr|looped' "$RUNNER_TEMP/loop2_$SCENE.txt" | sed 's/^/v2 /' || true
            echo "v2 check_loop_rc: ${LOOP2_RC:-?}"
            grep -E 'motion_v2 frames=|falling back|\[motion\]' "$RUNNER_TEMP/v2_$SCENE.log" | sed 's/^/v2 log: /' | tail -5 || true
            echo "v2 maps present: $([ -s "$GITHUB_WORKSPACE/maps/depth.png" ] && echo yes || echo NO)"
          } | tee -a "$OUT/report.txt"
          { echo '```'; tail -12 "$OUT/report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload preview
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ matrix.scene }}
          path: |
            out/${{ matrix.scene }}/preview_30s.mp4
            out/${{ matrix.scene }}/preview_30s_v1.mp4
            out/${{ matrix.scene }}/preview_30s_v2.mp4
            out/${{ matrix.scene }}/ab_30s.mp4
            out/${{ matrix.scene }}/thumb.jpg
            out/${{ matrix.scene }}/ab_small.mp4
            out/${{ matrix.scene }}/ab_frame.jpg
            out/${{ matrix.scene }}/v2_motion.jpg
            out/${{ matrix.scene }}/v2_crop_*.jpg
          retention-days: 3
          if-no-files-found: warn

      - name: Upload review (small)
        if: ${{ always() && github.event.inputs.motion_ab == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: review-${{ matrix.scene }}
          path: |
            out/${{ matrix.scene }}/ab_small.mp4
            out/${{ matrix.scene }}/ab_frame.jpg
            out/${{ matrix.scene }}/v2_motion.jpg
            out/${{ matrix.scene }}/v2_crop_*.jpg
            out/${{ matrix.scene }}/report.txt
            out/${{ matrix.scene }}/still_used.*
            out/${{ matrix.scene }}/report.txt
          retention-days: 3
          if-no-files-found: warn

  e2e:
    needs: setup
    if: ${{ github.event.inputs.e2e_minutes != '' && github.event.inputs.e2e_minutes != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHORTS_DEBUG: '1'
      NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
      # production default is v2; gen_opts MOTION_ENGINE=v1 runs the kill-switch path
      MOTION_ENGINE: ${{ contains(github.event.inputs.gen_opts, 'MOTION_ENGINE=v1') && 'v1' || 'v2' }}
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ github.event.inputs.pipeline_ref || 'feat/photoreal-scenes' }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Render setup (cached)
        uses: ./.github/actions/render-setup
        with:
          tts-pip: ''
          apt-packages: 'ffmpeg librsvg2-bin fonts-dejavu fonts-noto-core fluidsynth fluid-soundfont-gm'
          voice-cache-path: '~/.cache/huggingface'
          voice-cache-key: 'hf-kokoro-m2m100-v1'
      - name: build_mix (live profile, focus slot) — no upload, no stream
        run: |
          echo "SHORTS_STAMP=$(date -u +%Y%m%dT%H%M)" >> "$GITHUB_ENV"
          export SHORTS_STAMP=$(date -u +%Y%m%dT%H%M)
          mkdir -p "$RUNNER_TEMP/prog"
          /usr/bin/time -v -o "$RUNNER_TEMP/time.txt" node shorts/music_mix/build_mix.mjs fi --minutes "${{ github.event.inputs.e2e_minutes }}" --live-profile --slot focus --progress-dir "$RUNNER_TEMP/prog" 2>&1 | tee "$RUNNER_TEMP/build.log"
          grep -E '\[photoreal\]|\[motion\]|motion_v2 frames' "$RUNNER_TEMP/build.log" || true
          grep -E 'Elapsed|Maximum resident' "$RUNNER_TEMP/time.txt"
      - name: Check output
        run: |
          META=$(find docs/shorts/fi -name meta.json | head -1); D=$(dirname "$META")
          mkdir -p e2e
          {
            echo "visual: $(jq -c .visual "$META")"
            echo "durationSec: $(jq .durationSec "$META")"
            echo "ready pieces: $(wc -l < "$RUNNER_TEMP/prog/ready.jsonl")"
            ffprobe -v error -show_entries format=duration,bit_rate:stream=codec_name,width,height,avg_frame_rate -of compact "$D/short.mp4"
            ls -la "$D"
          } | tee e2e/report.txt
          cat e2e/report.txt >> "$GITHUB_STEP_SUMMARY"
          ffmpeg -v error -y -ss 60 -i "$D/short.mp4" -t 20 -c copy e2e/clip_20s.mp4
          cp "$D/meta.json" "$RUNNER_TEMP/prog/ready.jsonl" e2e/
          [ -f "$D/thumb.jpg" ] && cp "$D/thumb.jpg" e2e/ || echo "no thumb.jpg"
          jq -e '.visual.kind == "photoreal"' "$META"
          # the engine that actually rendered must be the one requested (v2 = production default)
          jq -e --arg e "$MOTION_ENGINE" '.visual.engine == $e' "$META" || { echo "engine mismatch: wanted $MOTION_ENGINE, got $(jq -c '.visual' "$META")"; exit 1; }
      - name: Upload e2e artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-build-mix
          path: e2e/
          retention-days: 3
          if-no-files-found: warn
      - name: Purge staged output
        if: always()
        run: rm -rf docs/shorts/fi/* || true
