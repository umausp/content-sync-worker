name: news-edition

# ─────────────────────────────────────────────────────────────────────────────
# PER-COUNTRY LOCAL EDITION — one parameterized pipeline for ALL 14 editions
# (migration 0016). The visitor sees THEIR country's local-language news on
# agyata.com (edge resolves cf-ipcountry → edition, ?edition= forwards it).
#
# This is 100% LOCAL: each native edition publishes ONLY its own local-language
# stories and pushes NOTHING when there's no fresh local news (never a world
# top-up). See services/news-svc/src/repo.ts (PURE-LOCAL feed) + src/editions.mjs
# (the per-edition source registry).
#
# ONE run gathers the FULL local firehose for the given edition — curated native
# RSS roster + native Google-Trends + native X-trends + curated high-RPM watch-
# terms (Business/Finance, Tech/AI, Real Estate) + the country's Google-News
# section feeds — so a local feed is ALWAYS fed (SOURCE_MODE=both, BUZZ_ENABLED=1).
# `world`/`in` keep their existing dedicated pipelines (news-p1-trends/news-p2-rss);
# this workflow drives the 12 NATIVE editions (de nl fr jp sv no da it es pt fi pl),
# though it accepts world/in too for manual backfill.
#
# CADENCE: dispatched EXTERNALLY, hourly per edition, by the agyata-cron-pinger
# Cloudflare Worker (services/cron-pinger/src/index.ts) — it passes the `edition`
# input and spreads the 14 editions across the hour so runners never pile up.
# workflow_dispatch only; never on pull_request (a fork PR must not read secrets).
# ─────────────────────────────────────────────────────────────────────────────
on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition code (world|in|de|nl|fr|jp|sv|no|da|it|es|pt|fi|pl)'
        required: true
        type: string

concurrency:
  # One in-flight run PER edition — a slow German run never blocks the French one,
  # but two German runs can't collide. Idempotent (dedup vs published + claim ledger).
  group: news-edition-${{ github.event.inputs.edition }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  EDITION: ${{ github.event.inputs.edition }}
  # BOTH real sources in one hourly pass: curated native RSS (deep, corroborated) +
  # the trend/buzz engine (native Trends + X + watch-terms + Google-News firehose).
  SOURCE_MODE: both
  BUZZ_ENABLED: '1'
  GDELT_ENABLED: '0' # GKG deferred per plan (re-enable with SOURCE_MODE incl gdelt)
  INGEST_URL: ${{ secrets.INGEST_URL }}
  STORIES_URL: ${{ secrets.STORIES_URL }}
  NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
  # No lockscreen push from the native editions yet (FCM copy is India-only) — a
  # native breaking still publishes to the feed, it just doesn't fire an alert.
  NEWS_PUSH: '0'
  # CROSS-RUN DEDUP CLAIM — shared D1 ledger. The claim key is edition-scoped in
  # review.mjs (web:de:… ), so a German run never blocks a French run on a shared
  # Latin proper noun ("Trump"), while two German runs still de-dup each other.
  NEWS_DEDUP_CLAIM: '1'
  CLAIM_WINDOW_H: '2'
  # ── LLM PROVIDER LADDER — NVIDIA FIRST, then the free tier, PAID OpenAI (tight
  #    cap), local Ollama last-resort. A provider is skipped if its key is absent.
  #    Fail-fast: one try/provider, bench on failure, never retry. The synth CHARTER
  #    (editions.mjs) tells the model to WRITE the title/summary/body in the edition's
  #    OWN language, so any provider produces native-language copy. ──
  PROVIDER_ORDER: 'sambanova,openrouter,groq,cohere,nvidia,mistral,gitmodels,huggingface,gemini,ollama'
  PROVIDER_USE_OLLAMA: '0'  # Gemini+free tiers carry every run; drop the 153s ollama install
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: 'gemini-flash-lite-latest'
  SOMBANOVA_API_KEY: ${{ secrets.SOMBANOVA_API_KEY }}
  SAMBANOVA_MODEL: 'Meta-Llama-3.3-70B-Instruct'
  COHERA_API_KEY: ${{ secrets.COHERA_API_KEY }}
  COHERE_MODEL: 'command-r-08-2024'
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: 'openrouter/free'
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  NVIDIA_MODEL: 'meta/llama-3.1-8b-instruct'
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MISTRAL_MODEL: 'mistral-small-latest'
  GITMODELS_API_KEY: ${{ secrets.GITMODELS_API_KEY }}
  GITMODELS_MODEL: 'openai/gpt-4o-mini'
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: 'gpt-4o-mini'
  OPENAI_DAILY_CAP: '40'
  OLLAMA_MODEL: qwen2.5:3b
  # TREND ENGINE — geo/hl/X-board come from the edition registry (ED_CFG.gnews),
  # NOT hard-coded env here, so a German run taps German Trends/X/GNews automatically.
  # (Leaving BUZZ_GEO/BUZZ_HL/BUZZ_X_GEO unset lets editions.mjs drive them.)
  BUZZ_X_TRENDS: '1'
  BUZZ_X_MAX_TERMS: '12'
  BUZZ_MAX_TERMS: '12'
  BUZZ_PER_TERM: '5'
  BUZZ_RESOLVE: '1'
  BUZZ_RESOLVE_MAX: '220'
  BUZZ_RESOLVE_CONCURRENCY: '10'
  # SYNTH — mid-size native pool; synth the notable events, extractive tail for the rest.
  SYNTH_MIN_SCORE: '6'
  SYNTH_HARD_MAX: '48'
  SYNTH_HOSTED_MAX: '90'
  SYNTH_MIN_IMPORTANCE: '3'
  SYNTH_BATCH: '8'
  SYNTH_TIMEOUT_MS: '150000'
  SYNTH_BUDGET_MS: '780000' # 13-min synth budget (yields early so verify+publish always run)
  MIN_IMPORTANCE: '3'
  # PUBLISH — corroboration-first, same bar as the deep RSS pipeline. A native edition
  # with no fresh corroborated local story simply publishes nothing (pure-local).
  PUBLISH_MIN_SCORE: '11'
  PUBLISH_MIN_IMPORTANCE: '4'
  PUBLISH_MIN_CORROBORATION: '2'
  PUBLISH_SOLO_IMPORTANCE: '5'
  MAX_AGE_H: '36'
  MAX_AGE_H_BUZZ: '24'
  VERIFY_FAITHFUL: '1'
  VERIFY_BUDGET_MS: '240000'
  PER_FEED: '15'
  # SEMANTIC DEDUP — MULTILINGUAL model (native titles aren't English). embed.mjs
  # already defaults non-English editions to gte-multilingual-base; set it explicitly
  # so the cache key + behaviour are unambiguous.
  EMBED_DEDUP: '1'
  EMBED_MODEL: 'onnx-community/gte-multilingual-base'
  EMBED_SIM_THRESHOLD: '0.82'
  EMBED_VERIFY: '1'
  EMBED_VERIFY_MIN: '0.4'

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm deps (transformers.js for semantic dedup)
        run: npm ci --no-audit --no-fund

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-embed-${{ env.EMBED_MODEL }}-v1

      - name: Install Ollama
        timeout-minutes: 3
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Cache Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.OLLAMA_MODEL }}-v2

      - name: Start Ollama + pull model
        timeout-minutes: 8
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          echo "pulling $OLLAMA_MODEL ..."
          ollama pull "$OLLAMA_MODEL"

      - name: Warm Ollama (best-effort, NON-fatal)
        timeout-minutes: 4
        continue-on-error: true
        run: |
          curl -sf http://127.0.0.1:11434/api/generate \
            -d "{\"model\":\"$OLLAMA_MODEL\",\"prompt\":\"Write one sentence of news.\",\"stream\":false,\"keep_alive\":\"30m\",\"options\":{\"num_predict\":40}}" >/dev/null || true
          echo "ollama warm attempted (hosted providers carry the run)"

      - name: Run LOCAL EDITION pipeline (native RSS + trends + X + watch-terms → synth → gate → publish)
        timeout-minutes: 38
        run: |
          echo "Running edition: $EDITION"
          node src/review.mjs
