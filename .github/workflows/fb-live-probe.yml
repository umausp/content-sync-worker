# Real-state probe for the Facebook live simulcast + Agyata Music repost (live/fb_probe.mjs).
# Creates an UNPUBLISHED live on Agyata World (Page admins only), pushes 60 s of a test pattern,
# ends it, and uploads a 10 s unpublished clip to Agyata Music. No YouTube, no music build.
name: Facebook live probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Probe Facebook live + repost
        env:
          LIVE_FACEBOOK_PAGE_ID: '1402811506238024'  # Agyata World
          FB_REPOST_PAGE_ID: '1346624568531932'      # Agyata Music
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_LIVE_USER_TOKEN: ${{ secrets.META_LIVE_USER_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        run: node live/fb_probe.mjs --seconds 60
