name: kaggle-smoke

# Simplest GitHub -> Kaggle -> GitHub check: a script kernel loads Gemma with transformers, answers one prompt and
# writes result.json; GitHub polls the kernel status (no logs stream, no tunnel) and downloads the output file.
on:
  workflow_dispatch:
    inputs:
      handle:
        description: 'Hugging Face repo (ungated mirror), e.g. unsloth/gemma-3-12b-it-bnb-4bit'
        default: 'unsloth/gemma-3-12b-it-bnb-4bit'
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q kaggle
      - name: Push, poll status, download result
        shell: bash
        env:
          HANDLE: ${{ inputs.handle }}
        run: |
          set -uo pipefail
          KUSER=$(kaggle config view | sed -n 's/^- username: //p')
          kaggle quota --format json | python3 -c "import sys,json;print([ (x['resource'],x['used'],x['remaining']) for x in json.load(sys.stdin)])"
          W="$RUNNER_TEMP/smoke"; mkdir -p "$W"
          sed "s|__HANDLE__|$HANDLE|" kaggle/smoke/smoke.py > "$W/smoke.py"
          VER=$(kaggle models instances versions list "$HANDLE" --format json 2>/dev/null | python3 -c "import sys,json;d=json.load(sys.stdin);print(max(int(x.get('versionNumber', x.get('version', 0))) for x in d))" 2>/dev/null || echo "")
          echo "model version: ${VER:-unknown} ($HANDLE)"
          MS=""; [ -n "$VER" ] && MS="\"$HANDLE/$VER\""
          cat > "$W/kernel-metadata.json" <<JSON
          {"id":"$KUSER/agyata-smoke","title":"agyata-smoke","code_file":"smoke.py","language":"python","kernel_type":"script","is_private":true,"enable_gpu":true,"enable_internet":true,"dataset_sources":[],"competition_sources":[],"kernel_sources":[]}
          JSON
          kaggle kernels push -p "$W" -t 1500 --accelerator NvidiaTeslaT4 || { echo "::error::push failed"; exit 1; }
          for i in $(seq 1 90); do
            ST=$(kaggle kernels status "$KUSER/agyata-smoke" 2>&1 | sed -n 's/.*KernelWorkerStatus\.\([A-Z_]*\).*/\1/p')
            echo "[$(date -u +%H:%M:%S)] state=${ST:-unknown}"
            case "$ST" in COMPLETE|ERROR|CANCEL_ACKNOWLEDGED) break;; esac
            sleep 20
          done
          mkdir -p "$W/out"; kaggle kernels output "$KUSER/agyata-smoke" -p "$W/out" || true
          ls -la "$W/out"
          if [ -f "$W/out/result.json" ]; then cat "$W/out/result.json"; else echo "::error::no result.json (state=$ST)"; kaggle kernels logs "$KUSER/agyata-smoke" 2>&1 | tail -40; exit 1; fi
