name: dump-secrets-oneshot
# ONE-SHOT, MANUAL-ONLY secrets export for migrating to the Oracle render box.
# Encrypts ALL Actions secrets with an embedded PUBLIC cert (RSA+AES via CMS); only the
# operator's local PRIVATE key can decrypt. The plaintext NEVER touches the logs or the
# artifact — only ciphertext is uploaded. DELETE this workflow file after one run.
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Encrypt all secrets to ciphertext
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          echo "$ALL_SECRETS" > /tmp/secrets.json
          # sanity: how many keys? (count only — never print values)
          node -e 'const s=require("/tmp/secrets.json");console.log("secret keys:",Object.keys(s).length)'
          echo "" | base64 -d > /tmp/cert.pem
          openssl cms -encrypt -aes-256-cbc -binary -outform DER             -in /tmp/secrets.json -out /tmp/secrets.enc /tmp/cert.pem
          rm -f /tmp/secrets.json
          ls -l /tmp/secrets.enc
      - name: Upload ciphertext artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrets-enc
          path: /tmp/secrets.enc
          retention-days: 1
