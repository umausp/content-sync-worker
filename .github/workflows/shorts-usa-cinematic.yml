name: shorts-usa-cinematic

# CINEMATIC + FOLEY test cron for a PORTRAIT 1080x1920 Short. Pins the private-pipeline checkout to
# the `cinematic-engine` BRANCH (now carries the merged foley from main) and turns the $0 cinematic
# engine ON (film grade + depth parallax + subject-cutout occlusion dolly) WITH diegetic foley
# (SHORTS_FOLEY=1). Purpose: hear the sound design + see the engine on a real Short, once a day, on
# the live channel as an UNLISTED (link-only) review copy — before enabling foley on production.
#
# SAFETY (TEST, not production):
#   • Renders from branch `cinematic-engine` (NOT main) — production shorts-usa is untouched. The
#     branch = main (incl. foley) + 3 perf commits (concurrent assemble, parallax cache, debug logs).
#   • SHORTS_PRIVACY: unlisted → upload.mjs publishes UNLISTED (link-only, not on the channel page)
#     and NO YT_PLAYLIST_* is passed, so it never enters the real USA/English playlists.
#   • MANUAL one-off (workflow_dispatch), NOT on the cron-pinger — dispatched by hand to review the
#     foley before it's rolled out to the production channels. No WORKFLOWS entry.
on:
  workflow_dispatch:
    inputs:
      category:
        description: 'SHORTS_CATEGORY_FILTER'
        required: false
        default: ''
      content_mode:
        description: 'CONTENT_MODE'
        required: false
        default: ''
      region:
        description: 'Target region (usa | europe).'
        required: false
        default: ''

concurrency:
  group: shorts-usa-cinematic
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHORTS_DEBUG: '1'
  LONGFORM_RAG_TRACE: '1'
  SHORTS_CATEGORY_FILTER: ${{ github.event.inputs.category }}
  CONTENT_MODE: ${{ github.event.inputs.content_mode }}
  API_BASE: https://api.agyata.com
  SHORTS_PY: python

  # ── CINEMATIC ENGINE (the point of this test) — PORTRAIT (no SHORTS_ORIENTATION=landscape) ─────
  # Film finish + depth parallax + occlusion dolly. Depth/occlusion are fail-open (missing model / bad
  # photo → Ken-Burns). Portrait tuning: Shorts shots are shorter & faster-paced, so a slow behind-
  # subject dolly needs to be reserved for the 1-2 HERO shots (OCCLUSION_MAX_PER_CLIP=2), and shots
  # under PARALLAX_MIN_SEC stay Ken-Burns (a dolly can't develop in <1.5s). ASSEMBLE_CONCURRENCY only
  # matters for multi-beat longform; a single-story Short has few clips but it's harmless.
  SHORTS_CINEMATIC: '1'
  SHORTS_DEPTH_3D: '1'
  SHORTS_DEPTH_OCCLUSION: '1'
  SHORTS_RVM_MATTE: '1'   # Phase 1a: RVM hair/face-accurate matte (kills the mid-face cut). TEST wf only.
  SHORTS_GROUNDEDNESS_GATE: '1'   # Phase 1b: drop cross-story on-screen text bleed. TEST wf only.
  SHORTS_SPATIAL_GFX: '1'   # story-keyword graphic behind the matted subject (occlusion route); fail-open, $0. render.mjs auto-wiring landed (shorts/visual/spatial_keyword.mjs).
  DEPTH_MODEL: /tmp/models/depth_anything_v2_vits.onnx
  MATTE_MODEL: /tmp/models/u2net.onnx
  DEPTH_SIZE: '392'
  DEPTH_CACHE_DIR: /tmp/agyata-depth
  MATTE_CACHE_DIR: /tmp/agyata-matte
  PARALLAX_CACHE_DIR: /tmp/agyata-parallax
  DEPTH_MAX_IMAGES: '12'
  MATTE_MAX_IMAGES: '12'
  DEPTH_BUDGET_MS: '20000'
  MATTE_BUDGET_MS: '20000'
  DEPTH_THREADS: '2'
  MATTE_THREADS: '2'
  OCCLUSION_MAX_PER_CLIP: '4'   # Shorts: reserve the expensive behind-subject dolly for the hero shots
  ASSEMBLE_CONCURRENCY: '2'

  # ── DIEGETIC FOLEY (the reason this is now a CRON) — event-synced $0 self-synthesized SFX ──────
  # Clicks on text-appear, clunks on image-slide, risers/whooshes on camera-push, all on the KNOWN
  # render timestamps. Fail-open (missing bank → clean video, no foley), voice band untouched
  # (transient high-passed at 1200 Hz, riser sidechain-ducked under narration). Proven FO-4/FO-5 on
  # the cinematic-engine branch this workflow checks out. This is the surface for LISTENING to the
  # sound design before enabling SHORTS_FOLEY on production channels.
  SHORTS_FOLEY: '1'

  # Cinematic+foley TEST publishes as UNLISTED (privacyStatus in meta → upload.mjs), so it's a
  # link-only review copy that never appears on the public channel page or in a playlist.
  SHORTS_PRIVACY: unlisted
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  PROVIDER_ORDER: 'ollama,cerebras,openrouter,sambanova,nvidia,cohere,mistral,gitmodels,huggingface,huggingface1'
  SHORTS_RESEARCH_BUNDLE: '0'
  PROVIDER_USE_OLLAMA: '1'
  WM_RENDER_CLAIMS: '1'
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  NVIDIA_MODEL: 'meta/llama-3.3-70b-instruct'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: 'gemini-flash-lite-latest'
  SOMBANOVA_API_KEY: ${{ secrets.SOMBANOVA_API_KEY }}
  SAMBANOVA_MODEL: 'Meta-Llama-3.3-70B-Instruct'
  COHERA_API_KEY: ${{ secrets.COHERA_API_KEY }}
  COHERE_MODEL: 'command-r-08-2024'
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: 'openrouter/free'
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MISTRAL_MODEL: 'mistral-small-latest'
  GITMODELS_API_KEY: ${{ secrets.GITMODELS_API_KEY }}
  GITMODELS_MODEL: 'openai/gpt-4o-mini'
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: 'gpt-4o-mini'
  OPENAI_DAILY_CAP: '30'
  OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'gpt-oss:120b' }}  # switched from deepseek-v4-flash:cloud (dropped off live tag list, #10 model-ID rot; user 2026-08-09)
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OLLAMA_MAX_TRIES: '6'
  PROVIDER_HOSTED_TIMEOUT_MS: '60000'
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
  DEEPINFRA1_API_KEY: ${{ secrets.DEEPINFRA1_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF1_TOKEN: ${{ secrets.HF1_TOKEN }}
  HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
  HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private pipeline code (cinematic-engine branch)
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true

      # ── SHARED SETUP (perf): node+npm, apt+fonts (retry-hardened), python+pip cache, cinematic ONNX
      # provisioning, and the ONNX model-WEIGHTS cache — all in ONE composite action (private repo,
      # resolves after the checkout above). Replaces ~55 lines of copy-pasted setup. Kokoro TTS + the
      # onnxruntime/pillow the cinematic engine needs are the tts-pip line.
      - name: Render setup (cached)
        uses: ./.github/actions/render-setup
        with:
          tts-pip: 'kokoro soundfile sentencepiece faster-whisper onnxruntime pillow'
          voice-cache-path: '~/.cache/huggingface'
          voice-cache-key: 'hf-kokoro-m2m100-v1'

      - name: Restore cinematic ONNX depth/matte maps + parallax clips (shared across ALL channels/runs)
        if: env.SHORTS_DEPTH_3D == '1'
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/agyata-depth
            /tmp/agyata-matte
            /tmp/agyata-parallax
          key: cinematic-maps-${{ runner.os }}-v1

      - name: Stamp
        run: echo "SHORTS_STAMP=cine-$(date -u +%Y%m%dT%H%M)" >> "$GITHUB_ENV"

      - name: Render English Short (cinematic)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          WORLD_REGION: usa
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
        run: node shorts/build_short.mjs usa

      # AUTO-UPLOAD to YouTube as UNLISTED (privacyStatus=unlisted from SHORTS_PRIVACY in the meta).
      # This is the LISTEN surface — an unlisted link plays on any phone so the foley can be heard.
      # NO YT_PLAYLIST_* is passed, so upload.mjs skips the playlist-add: the review copy never enters
      # the real USA/English playlists. Best-effort (continue-on-error): a token/scope problem keeps the
      # artifact below instead. On success uploaded=true suppresses the public artifact.
      - name: Auto-upload to YouTube (UNLISTED review copy)
        id: yt
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_USA: ${{ secrets.YT_REFRESH_TOKEN_USA }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN_USA" ]; then echo "no refresh token — skipping upload (artifact only)"; exit 0; fi
          node shorts/upload.mjs usa "$SHORTS_STAMP"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      # ARTIFACT is the fallback review copy — kept only when the unlisted upload did NOT happen
      # (no token, or upload errored). On a PUBLIC repo an artifact is publicly downloadable, so once
      # the unlisted video is on YouTube we don't also publish it here. Short retention either way.
      - name: Upload staged Short artifact (only if NOT uploaded to YouTube)
        if: steps.yt.outputs.uploaded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: short-usa-cinematic-${{ env.SHORTS_STAMP }}
          path: docs/shorts/usa/
          retention-days: 3
          if-no-files-found: warn

      # PURGE the rendered MP4 from the runner after upload — nothing lingers on GitHub.
      - name: Save cinematic ONNX depth/matte maps + parallax clips (grows the shared cache for every channel)
        if: always() && env.SHORTS_DEPTH_3D == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/agyata-depth
            /tmp/agyata-matte
            /tmp/agyata-parallax
          key: cinematic-maps-${{ runner.os }}-v1
      - name: Purge staged output
        if: always()
        run: rm -rf docs/shorts/usa/* || true
