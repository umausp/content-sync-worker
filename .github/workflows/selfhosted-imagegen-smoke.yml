# selfhosted-imagegen-smoke — prove a LOCAL FLUX.1-schnell (mflux, 4-bit) on the Mac runner: probe the install, save the
# 4-bit weights once (~7 GB under ~/.cache/lf-models), time one 1344x768 image, print the Python API signature, upload the PNG.
# $0: nothing leaves the machine except the HF weight download on the first run (HF_TOKEN from secrets; schnell is gated).
name: selfhosted-imagegen-smoke
on:
  workflow_dispatch:
    inputs:
      pipeline_ref: { description: 'ref of umausp/agyata-pipeline-private (for services/imagegen/local_server.py)', default: 'feat/longform-studio' }
      width:  { description: 'image width (multiple of 16)',  default: '1344' }
      height: { description: 'image height (multiple of 16)', default: '768' }
      steps:  { description: 'schnell steps', default: '4' }
      prompt: { description: 'prompt', default: 'hand-drawn graphic novel illustration, storybook documentary style, a cargo plane on a rain-wet runway at night, crates of gold being loaded, warm sepia and gold, soft paper grain, wide cinematic composition, no text, no letters, not photorealistic' }
jobs:
  smoke:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 120
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout private pipeline (./pipeline) for the local server
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ inputs.pipeline_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: pipeline
      - name: Reinstall mflux on Python 3.12 when the current install cannot import (owner OK, 2026-10-21)
        run: |
          set +e
          CLI="$(command -v mflux-generate)"; PY="$(head -1 "$CLI" 2>/dev/null | sed -E 's/^#! *//; s/ .*$//')"
          if [ -n "$PY" ] && "$PY" -c "import mflux; from mflux.models.flux.variants.txt2img.flux import Flux1" 2>/dev/null; then echo "mflux imports fine with $PY ($("$PY" -c 'import PIL;print("pillow",PIL.__version__)'))"; exit 0; fi
          [ -n "$PY" ] && "$PY" -c 'import PIL;print("broken install had pillow",PIL.__version__)' 2>/dev/null
          echo "mflux import broken (or missing) → uv tool install --force --python /opt/homebrew/bin/python3.12 mflux==0.23.0"
          /opt/homebrew/bin/uv tool install --force --python /opt/homebrew/bin/python3.12 --with "pillow>=12.3.0,<13" mflux==0.23.0 2>&1 | rg "pillow|mflux|mlx==|Installed" | head -8
          export PATH="$HOME/.local/bin:$PATH"; CLI="$(command -v mflux-generate)"; PY="$(head -1 "$CLI" | sed -E 's/^#! *//; s/ .*$//')"
          "$PY" -c "import mflux, sys, PIL; from mflux.models.flux.variants.txt2img.flux import Flux1; print('ok python', sys.version.split()[0], 'pillow', PIL.__version__)" || { echo "::error::mflux still cannot import after reinstall"; exit 1; }
      - name: Probe the mflux install
        run: |
          set +e
          export PATH="$HOME/.local/bin:$PATH"
          LF_MODELS="$HOME/.cache/lf-models"; echo "LF_MODELS=$LF_MODELS" >> "$GITHUB_ENV"
          echo "runner user: $(id -un)  HOME=$HOME  free: $(df -h "$HOME" | awk 'NR==2{print $4}')"
          for c in mflux-generate mflux-save python3 python3.12 uv pipx; do printf '%-16s %s\n' "$c" "$(command -v $c || echo '-')"; done
          ls -la "$LF_MODELS" 2>/dev/null || echo "no $LF_MODELS yet"
          # Find the interpreter that has mflux: the CLI's own shebang (pipx / uv tool venv), then known venvs, then brew pythons.
          SHEBANG=""; CLI="$(command -v mflux-generate)"; [ -n "$CLI" ] && SHEBANG="$(head -1 "$CLI" | sed -E 's/^#! *//; s/ .*$//')"
          echo "mflux-generate shebang: ${SHEBANG:--}"
          for py in "$SHEBANG" "$LF_MODELS/mflux-venv/bin/python" "$HOME/.local/pipx/venvs/mflux/bin/python" "$HOME/.local/share/uv/tools/mflux/bin/python" /opt/homebrew/bin/python3.12 /opt/homebrew/bin/python3.13 /opt/homebrew/bin/python3 python3; do
            [ -n "$py" ] || continue
            if "$py" -c "import mflux" 2>/dev/null; then echo "MFLUX_PY=$py" >> "$GITHUB_ENV"; echo "mflux python: $py ($("$py" -c 'import mflux,sys;print(getattr(mflux,"__version__","?"), sys.version.split()[0])'))"; break; fi
          done
          grep -q MFLUX_PY "$GITHUB_ENV" || { echo "::error::no python with mflux found (checked venv, pipx, brew pythons)"; exit 1; }
      - name: Python API signature (for the server)
        run: |
          "$MFLUX_PY" - <<'PY'
          import inspect, importlib, pkgutil, mflux
          mods=[m.name for m in pkgutil.walk_packages(mflux.__path__, 'mflux.')]
          print("modules with flux1:", [m for m in mods if m.split('.')[-1] in ('flux','flux1')][:8])
          for p in ("mflux.models.flux.variants.txt2img.flux","mflux.models.flux","mflux.models.flux.flux"):
              try:
                  m=importlib.import_module(p); c=getattr(m,'Flux1',None)
                  if c: print(p,"Flux1.__init__",inspect.signature(c.__init__)); print("generate_image",inspect.signature(c.generate_image)); break
              except Exception as e: print(p,"err",e)
          for p in ("mflux.models.common.config.model_config","mflux.models.common.config.config","mflux.models.common.config"):
              try:
                  m=importlib.import_module(p); mc=getattr(m,'ModelConfig',None); print(p,"ModelConfig:",[x for x in dir(mc) if not x.startswith('_')][:24] if mc else dir(m)[:10]); break
              except Exception as e: print(p,"err",e)
          PY
      - name: Save 4-bit schnell weights once
        run: |
          BIN="$(dirname "$MFLUX_PY")"
          if [ -d "$LF_MODELS/flux-schnell-4bit" ] && [ -n "$(ls -A "$LF_MODELS/flux-schnell-4bit")" ]; then echo "weights present: $(du -sh "$LF_MODELS/flux-schnell-4bit" | cut -f1)"; exit 0; fi
          mkdir -p "$LF_MODELS"; S=$(date +%s)
          "$BIN/mflux-save" --model schnell --quantize 4 --path "$LF_MODELS/flux-schnell-4bit"
          echo "saved in $(( $(date +%s) - S )) s: $(du -sh "$LF_MODELS/flux-schnell-4bit" | cut -f1)"
      - name: Generate one image (timed)
        run: |
          BIN="$(dirname "$MFLUX_PY")"; OUT="$RUNNER_TEMP/smoke"; mkdir -p "$OUT"; cd "$OUT"
          S=$(date +%s)
          "$BIN/mflux-generate" --model "$LF_MODELS/flux-schnell-4bit" --base-model schnell --quantize 4 --steps "${{ inputs.steps }}" --seed 7 --width "${{ inputs.width }}" --height "${{ inputs.height }}" --prompt "${{ inputs.prompt }}" --output "$OUT/smoke.png" || "$BIN/mflux-generate" --model "$LF_MODELS/flux-schnell-4bit" --base-model schnell --quantize 4 --steps "${{ inputs.steps }}" --seed 7 --width "${{ inputs.width }}" --height "${{ inputs.height }}" --prompt "${{ inputs.prompt }}"
          echo "first image (incl. model load): $(( $(date +%s) - S )) s"
          S=$(date +%s)
          "$BIN/mflux-generate" --model "$LF_MODELS/flux-schnell-4bit" --base-model schnell --quantize 4 --steps "${{ inputs.steps }}" --seed 8 --width "${{ inputs.width }}" --height "${{ inputs.height }}" --prompt "${{ inputs.prompt }}" --output "$OUT/smoke2.png" || true
          echo "second image (CLI, warm cache): $(( $(date +%s) - S )) s"
          ls -la "$OUT"; find "$OUT" -name '*.png' -exec file {} \;
      - name: Serve it (services/imagegen/local_server.py) and POST one plate — the contract the render lane uses
        run: |
          OUT="$RUNNER_TEMP/smoke"; mkdir -p "$OUT"
          trap 'echo "--- server.log ---"; cat "$OUT/server.log"' EXIT
          perl -MPOSIX -e 'POSIX::setsid(); exec @ARGV' "$MFLUX_PY" pipeline/services/imagegen/local_server.py --port 8090 --model-path "$LF_MODELS/flux-schnell-4bit" --quantize 4 --warm > "$OUT/server.log" 2>&1 < /dev/null &
          PID=$!
          for i in $(seq 1 60); do curl -sf -m 5 http://127.0.0.1:8090/health | grep -q '"loaded": *true' && break; sleep 5; done
          curl -s -m 5 http://127.0.0.1:8090/health; echo
          S=$(date +%s)
          curl -sf -m 600 -X POST http://127.0.0.1:8090/ -H 'content-type: application/json' -d "$(jq -cn --arg p "${{ inputs.prompt }}" --argjson w "${{ inputs.width }}" --argjson h "${{ inputs.height }}" --argjson s "${{ inputs.steps }}" '{prompt:$p,width:$w,height:$h,steps:$s,seed:9}')" -o "$OUT/server.png"
          echo "server plate: $(( $(date +%s) - S )) s  $(file "$OUT/server.png" | cut -d: -f2)"
          S=$(date +%s)
          curl -sf -m 600 -X POST http://127.0.0.1:8090/ -H 'content-type: application/json' -d '{"prompt":"a parchment map of the Indian Ocean, hand-drawn, warm sepia, no text","width":1344,"height":768,"steps":4,"seed":10}' -o "$OUT/server2.png"
          echo "server plate 2 (warm): $(( $(date +%s) - S )) s  $(file "$OUT/server2.png" | cut -d: -f2)"
          kill "$PID" 2>/dev/null || true; cat "$OUT/server.log"
      - uses: actions/upload-artifact@v4
        with:
          name: imagegen-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/smoke
          if-no-files-found: warn
          retention-days: 3
