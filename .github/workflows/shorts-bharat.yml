name: shorts-bharat

# Render ONE Hindi/Hinglish Short for the @agyata_dot_com channel (India audience).
# bharat SELF-GATHERS the India desks (native_feeds 'hi' spec) and synthesises the brief +
# hook NATIVELY IN HINDI via Gemini — like every other native channel — then TTS (PIPER Hindi,
# hi_IN-pratham-medium — user-verified natural) + captions. (Old flow: read the D1 India feed in
# English + offline m2m100 translate + robotic Kokoro-hi; that
# word-spliced compounds and is now only the BHARAT_READ_D1=1 escape hatch.)
#
# CADENCE: agyata-cron-pinger workflow_dispatch (offset from shorts-world). Public repo.
on:
  workflow_dispatch: {}

concurrency:
  group: shorts-bharat
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_BASE: https://api.agyata.com
  NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
  SHORTS_PY: python
  # NATIVE HINDI SYNTH (2026-07-30): bharat now SELF-GATHERS the India desks and synthesises the
  # brief + hook NATIVELY IN HINDI via Gemini (enrichSummary lang:'hi'), exactly like every other
  # native channel — NOT the old offline m2m100 word-splicer ("pre-book" → "पूर्व-पुस्तक"). So it
  # needs the SAME provider ladder as the other channels. gemini-flash-lite-latest is the only flash ID
  # the paid key can call (2.0/2.5 404 for new billing projects) and is a rot-proof alias.
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  PROVIDER_ORDER: 'gemini,sambanova,openrouter,groq,cohere,nvidia,mistral,gitmodels,hfspace,huggingface,huggingface1,deepinfra,deepinfra1,cerebras,openai,ollama'
  PROVIDER_USE_OLLAMA: '0'  # Gemini+free tiers carry every run; drop the 153s ollama install
  WM_RENDER_CLAIMS: '1'
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  NVIDIA_MODEL: 'meta/llama-3.3-70b-instruct'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: 'gemini-flash-lite-latest'
  SOMBANOVA_API_KEY: ${{ secrets.SOMBANOVA_API_KEY }}
  SAMBANOVA_MODEL: 'Meta-Llama-3.3-70B-Instruct'
  COHERA_API_KEY: ${{ secrets.COHERA_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  COHERE_MODEL: 'command-r-08-2024'
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: 'openrouter/free'
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MISTRAL_MODEL: 'mistral-small-latest'
  GITMODELS_API_KEY: ${{ secrets.GITMODELS_API_KEY }}
  GITMODELS_MODEL: 'openai/gpt-4o-mini'
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: 'gpt-4o-mini'
  OPENAI_DAILY_CAP: '30'
  OLLAMA_MODEL: llama3.1:8b
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
  DEEPINFRA1_API_KEY: ${{ secrets.DEEPINFRA1_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF1_TOKEN: ${{ secrets.HF1_TOKEN }}
  HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
  HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}

jobs:
  render:
    runs-on: ubuntu-latest
    # 40m like the other native channels: native Hindi synth (Gemini) + cold ffmpeg/Kokoro caches
    # were clipping the old 20m ceiling → runs cancelled mid-render.
    timeout-minutes: 40
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install system deps (ffmpeg + librsvg + Devanagari fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin espeak-ng fonts-noto-core fonts-noto-cjk fonts-noto-extra

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-v1

      - name: Install Piper TTS deps
        run: |
          python -m pip install --quiet --upgrade pip
          # PIPER Hindi (hi_IN-pratham-medium) — user-verified natural, replaces robotic Kokoro-hi.
          # kokoro + sentencepiece kept ONLY for the deprecated BHARAT_READ_D1=1 m2m100 escape hatch.
          python -m pip install --quiet piper-tts numpy soundfile kokoro sentencepiece faster-whisper

      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: /tmp/piper-voices
          key: piper-voices-hi-v1

      - name: Cache HuggingFace models (Kokoro fallback)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-m2m100-v1

      - name: Stamp
        run: echo "SHORTS_STAMP=$(date -u +%Y%m%dT%H%M)" >> "$GITHUB_ENV"

      - name: Render Hindi Short
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # Authenticated HF downloads (faster/reliable; m2m100 is public, token optional).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          PIPER_VOICES_DIR: /tmp/piper-voices   # cached Piper hi_IN voice model
        run: node shorts/build_short.mjs bharat

      - name: Auto-upload to YouTube (unlisted)
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_BHARAT: ${{ secrets.YT_REFRESH_TOKEN_BHARAT }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN_BHARAT" ]; then echo "no refresh token — skipping upload (artifact only)"; exit 0; fi
          node shorts/upload.mjs bharat "$SHORTS_STAMP"

      - name: Upload staged Short artifact
        uses: actions/upload-artifact@v4
        with:
          name: short-bharat-${{ env.SHORTS_STAMP }}
          path: docs/shorts/bharat/
          retention-days: 7
          if-no-files-found: warn
