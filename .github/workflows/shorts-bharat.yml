name: shorts-bharat

# Render ONE Hindi/Hinglish Short for the @agyata_dot_com channel (India audience).
# bharat SELF-GATHERS the India desks (native_feeds 'hi' spec) and synthesises the brief + hook
# NATIVELY IN HINDI via the LLM router — like every other native channel — then TTS.
# VOICE (verified 2026-08-29, re-enable pass): docs/voice/channel-voices.json PINS bharat to two
# edge-tts grade-B neural voices ONLY (hi-IN-SwaraNeural female, hi-IN-MadhurNeural male) —
# castForVideo/castNewsroom draw from this pinned list (shorts/voice/index.mjs), so the primary
# voice is always a real Microsoft neural voice, NEVER the config's raw fallback `voice` field
# (hi_IN-pratham-medium, Piper MEDIUM — that id is the LAST-RESORT-only synth id if edge itself is
# unreachable, not what listeners normally hear; the line below describing it as "user-verified
# natural" was stale from before the pinned-allowlist fix and is corrected here). (Old flow: read
# the D1 India feed in English + offline m2m100 translate + robotic Kokoro-hi; that word-spliced
# compounds and is now only the BHARAT_READ_D1=1 escape hatch.)
#
# CADENCE: agyata-cron-pinger workflow_dispatch (offset from shorts-world). Public repo.
on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Comma list of allowed categories/topics (SHORTS_CATEGORY_FILTER)'
        required: false
        default: ''
      content_mode:
        description: 'Entertainment content mode (movie-review/retro-movie/top10 → CONTENT_MODE)'
        required: false
        default: ''
      region:
        description: 'Region for world channel (usa/europe)'
        required: false
        default: ''

concurrency:
  group: shorts-bharat
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHORTS_FOLEY: '1'   # diegetic foley — event-synced $0/CPU SFX, fail-open (rolled out to all shorts 2026-08-06)
  # PUBLIC upload (user 2026-08-05: "all channels public") — build_short reads SHORTS_PRIVACY into
  # meta.privacyStatus → upload.mjs. bharat previously had no line (defaulted unlisted); made public.
  SHORTS_PRIVACY: public
  # ── CINEMATIC ENGINE (setup_cinematic.sh provisions the models; all fail-open) ──
  SHORTS_CINEMATIC: '1'
  # ROLLED BACK 2026-08-28 (user: distorted first frames + shorts landing 20-30s, not 45-60s) —
  # render.mjs now uses a plain left-right slide pan (media/window.mjs) for every still; DOF and
  # SPATIAL_GFX below are sub-gated on SHORTS_DEPTH_3D and go inert with it.
  SHORTS_DEPTH_3D: '0'
  SHORTS_DEPTH_OCCLUSION: '0'
  SHORTS_SPATIAL_GFX: '0'   # story-keyword graphic behind the matted subject (occlusion route); fail-open, $0. render.mjs auto-wiring landed (shorts/visual/spatial_keyword.mjs).
  DEPTH_MODEL: /tmp/models/depth_anything_v2_vits.onnx
  MATTE_MODEL: /tmp/models/u2net.onnx
  DEPTH_SIZE: '392'
  DEPTH_CACHE_DIR: /tmp/agyata-depth
  MATTE_CACHE_DIR: /tmp/agyata-matte
  PARALLAX_CACHE_DIR: /tmp/agyata-parallax
  DEPTH_MAX_IMAGES: '12'
  MATTE_MAX_IMAGES: '12'
  DEPTH_BUDGET_MS: '20000'
  MATTE_BUDGET_MS: '20000'
  DEPTH_THREADS: '2'
  MATTE_THREADS: '2'
  OCCLUSION_MAX_PER_CLIP: '4'
  ASSEMBLE_CONCURRENCY: '2'
  SHORTS_DEBUG: '1'
  LONGFORM_RAG_TRACE: '1'
  SHORTS_CATEGORY_FILTER: ${{ github.event.inputs.category }}
  CONTENT_MODE: ${{ github.event.inputs.content_mode }}
  API_BASE: https://api.agyata.com
  NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
  SHORTS_PY: python
  # NATIVE HINDI SYNTH (2026-07-30): bharat now SELF-GATHERS the India desks and synthesises the
  # brief + hook NATIVELY IN HINDI via Gemini (enrichSummary lang:'hi'), exactly like every other
  # native channel — NOT the old offline m2m100 word-splicer ("pre-book" → "पूर्व-पुस्तक"). So it
  # needs the SAME provider ladder as the other channels. gemini-flash-lite-latest is the only flash ID
  # the paid key can call (2.0/2.5 404 for new billing projects) and is a rot-proof alias.
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  PROVIDER_ORDER: 'ollama,cerebras,openrouter,sambanova,nvidia,cohere,mistral,gitmodels,huggingface,huggingface1'
  PROVIDER_USE_OLLAMA: '1'  # Ollama Cloud primary (user 2026-08-03: ollama first, free tiers fallback)
  WM_RENDER_CLAIMS: '1'
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  NVIDIA_MODEL: 'meta/llama-3.3-70b-instruct'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: 'gemini-flash-lite-latest'
  SOMBANOVA_API_KEY: ${{ secrets.SOMBANOVA_API_KEY }}
  SAMBANOVA_MODEL: 'Meta-Llama-3.3-70B-Instruct'
  COHERA_API_KEY: ${{ secrets.COHERA_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  COHERE_MODEL: 'command-r-08-2024'
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: 'openrouter/free'
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MISTRAL_MODEL: 'mistral-small-latest'
  GITMODELS_API_KEY: ${{ secrets.GITMODELS_API_KEY }}
  GITMODELS_MODEL: 'openai/gpt-4o-mini'
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: 'gpt-4o-mini'
  OPENAI_DAILY_CAP: '30'
  OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'gpt-oss:120b' }}  # switched from deepseek-v4-flash:cloud (dropped off live tag list, #10 model-ID rot; user 2026-08-09)
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OLLAMA_MAX_TRIES: '6'
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
  DEEPINFRA1_API_KEY: ${{ secrets.DEEPINFRA1_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF1_TOKEN: ${{ secrets.HF1_TOKEN }}
  HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
  HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}

jobs:
  render:
    runs-on: ubuntu-latest
    # 40m like the other native channels: native Hindi synth (Gemini) + cold ffmpeg/Kokoro caches
    # were clipping the old 20m ceiling → runs cancelled mid-render.
    timeout-minutes: 40
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true

      # ── SHARED SETUP (perf): node+npm, apt+fonts, python+pip cache, cinematic ONNX provisioning,
      # + the ONNX model-WEIGHTS cache — ONE composite action (private repo; resolves after the
      # checkout above). Replaces the per-channel setup; all deps preserved verbatim as inputs.
      - name: Render setup (cached)
        uses: ./.github/actions/render-setup
        with:
          tts-pip: 'piper-tts numpy soundfile kokoro sentencepiece faster-whisper edge-tts'
          apt-packages: 'ffmpeg librsvg2-bin espeak-ng fonts-noto-core fonts-noto-cjk fonts-noto-extra'
          voice-cache-path: '/tmp/piper-voices'
          voice-cache-key: 'piper-voices-hi-v1'

      - name: Restore cinematic ONNX depth/matte maps + parallax clips (shared across ALL channels/runs)
        if: env.SHORTS_DEPTH_3D == '1'
        id: cinematic-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/agyata-depth
            /tmp/agyata-matte
            /tmp/agyata-parallax
          key: cinematic-maps-${{ runner.os }}-v1

      - name: Stamp
        run: echo "SHORTS_STAMP=$(date -u +%Y%m%dT%H%M)" >> "$GITHUB_ENV"

      - name: Render Hindi Short
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          # Authenticated HF downloads (faster/reliable; m2m100 is public, token optional).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          PIPER_VOICES_DIR: /tmp/piper-voices   # cached Piper hi_IN voice model
        run: node shorts/build_short.mjs bharat

      - name: Auto-upload to YouTube (unlisted)
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_BHARAT: ${{ secrets.YT_REFRESH_TOKEN_BHARAT }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN_BHARAT" ]; then echo "no refresh token — skipping upload (artifact only)"; exit 0; fi
          node shorts/upload.mjs bharat "$SHORTS_STAMP"

      - name: Upload staged Short artifact
        uses: actions/upload-artifact@v4
        with:
          name: short-bharat-${{ env.SHORTS_STAMP }}
          path: docs/shorts/bharat/
          retention-days: 7
          if-no-files-found: warn
      - name: Save cinematic ONNX depth/matte maps + parallax clips (grows the shared cache for every channel)
        if: always() && env.SHORTS_DEPTH_3D == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/agyata-depth
            /tmp/agyata-matte
            /tmp/agyata-parallax
          key: cinematic-maps-${{ runner.os }}-v1
