name: yt-performance

# YouTube ANALYTICS FEEDBACK LOOP (user 2026-07-30: "check what's working well; feed it into which
# story goes to video"). For every channel with a YT_REFRESH_TOKEN_* secret, fetch recent uploads'
# statistics → compute a per-topic performance index → commit docs/analytics/topic-performance-*.json.
# The video runs read those files (editorial.loadTopicPerformance) and weight the story score by how
# well each topic actually performs. Read-only against YouTube (no publish); commits only the JSON.
#
# ALSO runs the Meta (Facebook + Instagram) half — shorts/social_performance.mjs — so the picker learns
# from EVERY platform a Short posts to, not YouTube alone (user 2026-09-12: "add fb and insta (meta)
# analytics as well … use them in scoring"). Same normalisation, so editorial.loadTopicPerformance can
# MERGE the YT + FB/IG per-topic maps into one weight-8 performance term. Read-only against Meta too.
#
# CADENCE: agyata-cron-pinger dispatches it a few times a day (performance changes slowly). Public repo.
on:
  workflow_dispatch: {}

concurrency:
  # unique per run so same-workflow dispatches run in PARALLEL, never queue (user 2026-09-02)
  group: yt-performance-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write # commits the refreshed docs/analytics/*.json back

env:
  # Retention (averageViewPercentage) needs the yt-analytics.readonly scope on re-minted tokens; until
  # then the loop uses a views+engagement proxy. Flip YT_ANALYTICS=1 here once the tokens carry it.
  YT_ANALYTICS: '1'
  # Persist the per-topic index to Upstash (WRITE-capable in CI — the git-commit path 403s under the
  # read-only PRIVATE_REPO_TOKEN). The video runs READ it from Upstash via editorial.loadTopicPerformance.
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci --no-audit --no-fund

      - name: Fetch YouTube performance → per-topic index
        env:
          # D1 persistence (2026-09-12): perfStore() writes agyata:ytperf:<channel> to Cloudflare D1 via
          # api-gateway (Bearer NEWS_INGEST_TOKEN), the reliable store the video runs READ. Without this the
          # D1 write no-ops and the loop relies only on the committed docs/analytics/*.json git fallback.
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_WORLD: ${{ secrets.YT_REFRESH_TOKEN_WORLD }}
          YT_REFRESH_TOKEN_BHARAT: ${{ secrets.YT_REFRESH_TOKEN_BHARAT }}
          YT_REFRESH_TOKEN_USA: ${{ secrets.YT_REFRESH_TOKEN_USA }}
          YT_REFRESH_TOKEN_UK: ${{ secrets.YT_REFRESH_TOKEN_UK }}
          YT_REFRESH_TOKEN_DE: ${{ secrets.YT_REFRESH_TOKEN_DE }}
          YT_REFRESH_TOKEN_NL: ${{ secrets.YT_REFRESH_TOKEN_NL }}
          YT_REFRESH_TOKEN_FR: ${{ secrets.YT_REFRESH_TOKEN_FR }}
          YT_REFRESH_TOKEN_JP: ${{ secrets.YT_REFRESH_TOKEN_JP }}
          YT_REFRESH_TOKEN_SV: ${{ secrets.YT_REFRESH_TOKEN_SV }}
          YT_REFRESH_TOKEN_NO: ${{ secrets.YT_REFRESH_TOKEN_NO }}
          YT_REFRESH_TOKEN_DA: ${{ secrets.YT_REFRESH_TOKEN_DA }}
          YT_REFRESH_TOKEN_IT: ${{ secrets.YT_REFRESH_TOKEN_IT }}
          YT_REFRESH_TOKEN_ES: ${{ secrets.YT_REFRESH_TOKEN_ES }}
          YT_REFRESH_TOKEN_PT: ${{ secrets.YT_REFRESH_TOKEN_PT }}
          YT_REFRESH_TOKEN_FI: ${{ secrets.YT_REFRESH_TOKEN_FI }}
          YT_REFRESH_TOKEN_PL: ${{ secrets.YT_REFRESH_TOKEN_PL }}
        run: node shorts/yt_performance.mjs

      - name: Fetch social (FB+IG) performance → per-topic index
        # The Meta half of the loop: enumerate each channel's recent FB Page videos + linked-IG reels,
        # pull insights, classify by caption, write agyata:socialperf:<chan> to D1 (NEWS_INGEST_TOKEN) +
        # docs/analytics/social-performance-*.json (committed below). Read-only; fail-open (never throws),
        # continue-on-error so a Meta hiccup can never redden the YouTube refresh above.
        continue-on-error: true
        env:
          SHORTS_SOCIAL_PUBLISH: '1'   # gate: only measure social while we're actually posting there
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          # Per-channel Page routing — the SAME literals each shorts-<chan>.yml posts through
          # (resolvePagesForChannel). The English channels share the Agyata World Page.
          META_PAGE_WORLD: '1402811506238024'
          META_PAGE_USA: '1402811506238024'
          META_PAGE_UK: '1402811506238024'
          META_PAGE_CA: '1402811506238024'
          META_PAGE_AU: '1402811506238024'
          META_PAGE_BHARAT: '1128779813662597'
          META_PAGE_FR: '1211796125361321'
          META_PAGE_JP: '1303550579508550'
          META_PAGE_ES: '1297861113416822'
          META_PAGE_SV: '1458580263997062'
          META_PAGE_PL: '1256328030904703'
          META_PAGE_TR: '1303613346172249'
          META_PAGE_AR: '1345843468605430'
        run: node shorts/social_performance.mjs

      - name: Commit topic-performance
        run: |
          git config user.name "agyata-analytics-bot"
          git config user.email "analytics-bot@agyata.com"
          git add docs/analytics/ || true
          if git diff --cached --quiet; then
            echo "no performance change — nothing to commit"
          else
            git commit -m "analytics: refresh per-topic YouTube + FB/IG performance [skip ci]"
            for attempt in 1 2 3; do
              if git push; then break; fi
              echo "push rejected (attempt $attempt) — rebasing onto latest main…"
              git pull --rebase --autostash origin main || true
            done
          fi
