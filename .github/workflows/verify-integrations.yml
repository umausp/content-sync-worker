name: verify-integrations

# One-shot smoke test: verify Ollama Cloud (OLLAMA_API_KEY → qwen3.5:397b-cloud) and TMDB
# (TMDB_ACCESS_TOKEN/TMDB_API_KEY) are LIVE on the runner before wiring them across the
# entertainment workflows. Runs the two acceptance probes and prints their verdicts.
# workflow_dispatch only — not scheduled. Cheap (no render, no upload).
on:
  workflow_dispatch:
    inputs:
      lang:
        description: 'TMDB test language (en/de/fr/ja/...)'
        required: false
        default: 'en'
      geo:
        description: 'TMDB test region (US/GB/DE/...)'
        required: false
        default: 'US'
      model:
        description: 'Ollama Cloud model id to test'
        required: false
        default: 'deepseek-v4-flash:cloud'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify Ollama Cloud (qwen3.5:397b-cloud)
        env:
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          OLLAMA_MODEL: ${{ github.event.inputs.model }}
        run: node tools/acceptance/probes/ollama_cloud.mjs

      - name: Verify TMDB adapter
        env:
          TMDB_ACCESS_TOKEN: ${{ secrets.TMDB_ACCESS_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node tools/acceptance/probes/tmdb_live.mjs "${{ github.event.inputs.lang }}" "${{ github.event.inputs.geo }}"
