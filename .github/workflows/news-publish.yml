name: news-publish

# Cloud-only text-news publish: one matrix job per edition, running the private
# pipeline entry point `node src/review.mjs` with EDITION=<code> on the GitHub
# runner (no local machine). Publishes to /news/ingest.
#
# workflow_dispatch ONLY. There is deliberately NO schedule: cadence is driven
# externally (agyata-cron-pinger), which dispatches this workflow.
on:
  workflow_dispatch:
    inputs:
      editions:
        description: 'Comma-separated edition codes, e.g. world,de,fr. Allowed: world in de nl fr jp sv no da it es pt fi pl us uk au ca mx id vi tr ar'
        required: true
        default: 'world'
        type: string
      dry_run:
        description: 'Preview only: run the full pipeline (gates, LLM summary, VLM image gate) but POST nothing, claim no dedup keys and send no push. Preview JSON is uploaded as the news-preview-<edition> artifact.'
        required: false
        default: false
        type: boolean
      kaggle:
        description: 'Run the text LLM on the Kaggle 2xT4 GPU lane (GitHub -> Kaggle -> GitHub). Falls back to the free ladder, then Ollama Cloud, if Kaggle is unavailable or out of quota.'
        required: false
        default: false
        type: boolean
      local_model:
        description: 'Optional: run the text LLM locally on the runner with this Ollama model (e.g. gemma3:4b, gemma4:12b) instead of Ollama Cloud. Empty = cloud gemma4 (default). The image VLM gate always stays on Ollama Cloud.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# One Kaggle session at a time (a single kernel slug); queued runs are replaced by the newest. Non-Kaggle runs are independent.
concurrency:
  group: ${{ inputs.kaggle && 'kaggle-llm' || format('np-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  plan:
    name: plan (validate editions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Validate editions and build matrix
        id: build
        shell: bash
        env:
          EDITIONS_INPUT: ${{ inputs.editions }}
          ALLOWED_EDITIONS: 'world in de nl fr jp sv no da it es pt fi pl us uk au ca mx id vi tr ar'
        run: |
          set -euo pipefail
          items=()
          IFS=',' read -r -a raw <<< "$EDITIONS_INPUT"
          for e in "${raw[@]}"; do
            code="$(printf '%s' "$e" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            if [ -z "$code" ]; then continue; fi
            case " $ALLOWED_EDITIONS " in
              *" $code "*) items+=("$code") ;;
              *) echo "::error::unknown edition code '$code' (allowed: $ALLOWED_EDITIONS)"; exit 1 ;;
            esac
          done
          if [ "${#items[@]}" -eq 0 ]; then echo "::error::no edition codes given"; exit 1; fi
          matrix="$(printf '%s\n' "${items[@]}" | awk '!seen[$0]++' | jq -R -s -c 'split("\n") | map(select(length > 0)) | {edition: .}')"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "editions to publish: $matrix"

  llm_up:
    name: kaggle llm up
    if: ${{ inputs.kaggle }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      url: ${{ steps.up.outputs.url }}
    env:
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_MODEL: 'gemma3:12b'
      KAGGLE_MIN_REMAINING_H: '1.5'  # skip the lane when less GPU quota than this is left this week
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q kaggle
      - name: Start Kaggle GPU server and wait for its endpoint
        id: up
        shell: bash
        run: |
          set -uo pipefail
          echo "url=" >> "$GITHUB_OUTPUT"
          REMAIN=$(kaggle quota --format json | python3 -c "import sys,json;d=json.load(sys.stdin);print(next(float(x['remaining'].rstrip('h')) for x in d if x['resource']=='GPU'))") || REMAIN=0
          echo "Kaggle GPU quota remaining: ${REMAIN}h"
          python3 -c "import sys;sys.exit(0 if float('$REMAIN')>=float('$KAGGLE_MIN_REMAINING_H') else 1)" || { echo "::notice::Kaggle GPU quota low (${REMAIN}h); using the free ladder"; exit 0; }
          KEY=$(printf '%s:%s' "$KAGGLE_API_TOKEN" "$GITHUB_RUN_ID" | sha256sum | cut -c1-40)
          echo "::add-mask::$KEY"
          KUSER=$(kaggle config view | sed -n 's/^- username: //p')
          WORK="$RUNNER_TEMP/kllm"; mkdir -p "$WORK"
          sed -e "s|__KEY__|$KEY|" -e "s|__MODEL__|$KAGGLE_MODEL|" -e "s|__RUN__|$GITHUB_RUN_ID|" kaggle/llm_server/server.py > "$WORK/server.py"
          cat > "$WORK/kernel-metadata.json" <<JSON
          {"id":"$KUSER/agyata-llm-server","title":"agyata-llm-server","code_file":"server.py","language":"python","kernel_type":"script","is_private":true,"enable_gpu":true,"enable_internet":true,"dataset_sources":[],"competition_sources":[],"kernel_sources":[]}
          JSON
          if ! kaggle kernels push -p "$WORK" -t 3300 --accelerator NvidiaTeslaT4 2>"$WORK/push.err"; then
            echo "push with --accelerator NvidiaTeslaT4 failed: $(tail -c 400 "$WORK/push.err")"
            kaggle kernels push -p "$WORK" -t 3300 || { echo "::warning::Kaggle push failed; using the free ladder"; exit 0; }
          fi
          kaggle kernels logs -f "$KUSER/agyata-llm-server" > "$WORK/log.txt" 2>&1 &
          for i in $(seq 1 84); do
            LINE=$(grep -a "KAGGLE_LLM_ENDPOINT=.* run=$GITHUB_RUN_ID" "$WORK/log.txt" | tail -1 || true)
            if [ -n "$LINE" ]; then
              URL=$(echo "$LINE" | sed -n 's/.*KAGGLE_LLM_ENDPOINT=\([^ ]*\) .*/\1/p')
              if curl -fsS -m 20 -H "Authorization: Bearer $KEY" "$URL/health" >/dev/null; then
                echo "Kaggle LLM ready: $URL"; echo "url=$URL" >> "$GITHUB_OUTPUT"; grep -a -E "MODEL_READY|OLLAMA_INSTALLED|GPU" "$WORK/log.txt" | head -5; exit 0
              fi
            fi
            if grep -aq "Traceback\|SystemExit\|failed" "$WORK/log.txt"; then break; fi
            sleep 10
          done
          echo "::warning::Kaggle LLM did not become ready; using the free ladder"; tail -n 40 "$WORK/log.txt" | cut -c1-200
          exit 0

  publish:
    name: publish ${{ matrix.edition }}
    needs: [plan, llm_up]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.local_model != '' && 70 || 25 }}
    strategy:
      fail-fast: false
      max-parallel: ${{ inputs.local_model != '' && 6 || 2 }}  # cloud shares the Ollama cap (10) with video renders; local models run on their own runners
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    concurrency:
      group: news-publish-${{ matrix.edition }}
      cancel-in-progress: false
    env:
      EDITION: ${{ matrix.edition }}
      SOURCE_MODE: both
      INGEST_URL: ${{ secrets.INGEST_URL }}
      STORIES_URL: ${{ secrets.STORIES_URL }}
      NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
      # ── Production flags. Values mirror shorts-world.yml on origin/main (2026-10-19).
      #    NEWS_DDG / NEWS_DDG_TOPICS / NEWS_DDG_MAX / NEWS_FOCUS: website-news DuckDuckGo
      #      finance+tech vertical (NEWS_DDG_MAX caps DDG items per edition run).
      #    SHORTS_DDG_NEWS / SHORTS_DDG_RETRIES / SHORTS_DDG_PROXY_URL: DDG news vertical and
      #      retry/backoff on 202/403/429 (Azure/GitHub runner IPs are throttled); the proxy
      #      secret is optional, empty => direct.
      #    NOT SET here on purpose: GDELT_ENABLED, BUZZ_ENABLED.
      #    These flags are LIVE only after pipeline branch feat/news-ddg-finance-tech is merged
      #    to the private repo's main. Until then the pipeline does not read them and unknown
      #    env vars are ignored harmlessly.
      # Ollama Cloud is the ONLY LLM provider (no paid Gemini/OpenAI spend). Other provider
      # keys below are kept in sync with shorts-world but are inert while PROVIDER_ORDER='ollama'.
      PROVIDER_ORDER: 'ollama'  # OLLAMA CLOUD ONLY, same as shorts-world.yml
      PROVIDER_USE_OLLAMA: '1'
      OLLAMA_MODEL: ${{ inputs.local_model != '' && inputs.local_model || 'gemma4:31b-cloud' }}  # news-publish pins gemma4 (owner decision 2026-10-21) unless local_model is given; other workflows keep the OLLAMA_MODEL secret
      OLLAMA_LLM_HOST: ${{ inputs.local_model != '' && 'http://127.0.0.1:11434' || '' }}  # text LLM only; VLM gate/image picker keep Ollama Cloud
      OLLAMA_THINK: '0'  # think:false everywhere (no reasoning tokens)
      # Local CPU model: small prompts. Cloud keeps the big batches.
      TRIAGE_BATCH: ${{ inputs.local_model != '' && '5' || '20' }}
      TRIAGE_MAX: ${{ inputs.local_model != '' && '60' || '600' }}
      SYNTH_BATCH: ${{ inputs.local_model != '' && '2' || '8' }}
      SYNTH_HOSTED_MAX: ${{ inputs.local_model != '' && '24' || '90' }}
      OLLAMA_LOCAL_TIMEOUT_MS: '300000'
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      OLLAMA_GLOBAL_CONCURRENCY: '10'  # cross-job Ollama semaphore, shared with video renders (cap 10)
      OLLAMA_MAX_TRIES: '6'
      CAT_CAP_FRACTION: '0.5'  # was 0.4: per-category share of NEW stories per run
      CAT_CAP_MIN: '10'  # was 6: do not cap small runs
      NEWS_DDG: '1'
      NEWS_DDG_TOPICS: 'finance,tech'
      NEWS_DDG_MAX: '24'
      NEWS_FOCUS: 'business,tech'
      # Single-source stories in NON-English editions publish when score >= 5 and importance >= 3 (their outlets rarely
      # repeat each other, so the two-outlet rule left `in` with ~1 story per run). Every other gate still applies
      # (LLM verifier, brand-fit, tip gate, summary checks). Validated in the QA lane: Hindi 4/4 stories passed the
      # strict cloud validator. English editions are unaffected by design.
      NEWS_NATIVE_SOLO: '1'
      PUBLISH_NATIVE_MIN_SCORE: '5'
      PUBLISH_NATIVE_MIN_IMPORTANCE: '3'
      SHORTS_DDG_NEWS: '1'
      SHORTS_DDG_RETRIES: '3'
      SHORTS_DDG_PROXY_URL: ${{ secrets.DDG_PROXY_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: 'gemini-flash-lite-latest'
      SOMBANOVA_API_KEY: ${{ secrets.SOMBANOVA_API_KEY }}
      SAMBANOVA_MODEL: 'Meta-Llama-3.3-70B-Instruct'
      COHERA_API_KEY: ${{ secrets.COHERA_API_KEY }}
      COHERE_MODEL: 'command-r-08-2024'
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: 'openrouter/free'  # auto-router to a free model, immune to model-ID rot
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL: 'meta/llama-3.3-70b-instruct'
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      MISTRAL_MODEL: 'mistral-small-latest'
      GITMODELS_API_KEY: ${{ secrets.GITMODELS_API_KEY }}
      GITMODELS_MODEL: 'openai/gpt-4o-mini'
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: 'gpt-4o-mini'
      OPENAI_DAILY_CAP: '30'
      # NEWS_DRY_RUN=1 only when dispatched with dry_run=true (anything else is '0', which the pipeline ignores).
      NEWS_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      # ── Website news summary + licence-free images (STAGE 1/2). Production values.
      NEWS_SUMMARY: '1'  # one small LLM call per story -> the card's summary and summaryShort; extractive fallback on failure
      NEWS_SUMMARY_MODEL: ${{ inputs.local_model != '' && inputs.local_model || 'gemma4:31b-cloud' }}  # same model as synthesis and the VLM gate; pinned here so a model-ID change is a reviewed diff
      NEWS_SUMMARY_MAX_CALLS: '120'  # was 40: calls past the cap got no LLM verdict and were rejected by the thin keyword gate
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}  # public IndexNow key (also served at agyata.com/<key>.txt): pings Bing/Yandex/Seznam/Naver after each publish; no-op when unset
      NEWS_IMAGES: '1'  # licence-free image picker (Commons / Openverse / origin-verified DDG)
      NEWS_IMAGES_VLM: '1'  # pixel relevance gate on the picker's candidates; fail-closed (no verdict -> no images)
      NEWS_IMAGES_MAX_STORIES: '60'  # cap on stories that run the image picker per run (was 25: stories past the cap got no photo)
      NEWS_IMAGES_FALLBACK_PUBLISHER: '0'  # never publish a news-site photo as a fallback (licence-free only)
      # ── VLM image gate (shorts/media/visual_gate.mjs). Values copied from shorts-world.yml on origin/main.
      #    The picker forces SHORTS_VLM_STRICT=1 for its own call; it is not set globally here.
      SHORTS_VLM_GATE: '1'  # gate enabled (also needs OLLAMA_API_KEY above)
      SHORTS_VLM_GATE_MODEL: 'deepseek-v4.1-flash:cloud'  # the pinned VLM (user directive 2026-10-06)
      SHORTS_VLM_GATE_FALLBACK_MODELS: 'gemma4:31b-cloud'  # used only when the primary returns no verdict; copied from shorts-world. Conflicts with the 2026-10-06 deepseek-only directive: set '' to disable the chain
      SHORTS_VLM_TIER: '1'  # 4-tier verdict (EXACT/CONTEXTUAL/GENERIC/WRONG); only WRONG is dropped, ranking uses the tier
      SHORTS_VLM_ENTITY_CTX: '1'  # story entities are passed to the judge
      SHORTS_VLM_CORP_CTX: '1'  # corporate/organisation context for company stories
    steps:
      - name: Kaggle lane
        if: ${{ needs.llm_up.outputs.url != '' }}
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KURL: ${{ needs.llm_up.outputs.url }}
        run: |
          KEY=$(printf '%s:%s' "$KAGGLE_API_TOKEN" "$GITHUB_RUN_ID" | sha256sum | cut -c1-40)
          echo "::add-mask::$KEY"
          { echo "KAGGLE_LLM_URL=$KURL"; echo "KAGGLE_LLM_KEY=$KEY"; echo "KAGGLE_LLM_MODEL=gemma3:12b"; echo "PROVIDER_ORDER=kaggle,$PROVIDER_ORDER"; } >> "$GITHUB_ENV"

      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm deps
        run: npm ci --no-audit --no-fund

      - name: Cache Ollama binary and models
        if: inputs.local_model != ''
        id: ollama-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/ollama-bin
            ~/.ollama
          key: ollama-v1-${{ inputs.local_model }}

      - name: Install Ollama and pull model (cached)
        if: inputs.local_model != ''
        shell: bash
        env:
          MODEL: ${{ inputs.local_model }}
        run: |
          set -euo pipefail
          if [ ! -x "$HOME/ollama-bin/bin/ollama" ]; then
            mkdir -p "$HOME/ollama-bin"
            curl -fsSL https://ollama.com/download/ollama-linux-amd64.tar.zst | zstd -d | tar -x -C "$HOME/ollama-bin"
          fi
          export PATH="$HOME/ollama-bin/bin:$PATH"
          nohup ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do curl -fs http://127.0.0.1:11434/api/tags >/dev/null && break; sleep 1; done
          curl -fs http://127.0.0.1:11434/api/tags >/dev/null || { cat "$RUNNER_TEMP/ollama.log"; exit 1; }
          ollama list | grep -q "^${MODEL}" || ollama pull "$MODEL"
          ollama list

      - name: Run review (publish edition)
        id: review
        shell: bash
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/review.log"
          node src/review.mjs 2>&1 | tee "$LOG"

      - name: Upload dry-run preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: news-preview-${{ matrix.edition }}
          path: out/news_preview_*.json
          retention-days: 7
          if-no-files-found: ignore

      - name: Summary
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          LOG="$RUNNER_TEMP/review.log"
          line="$(grep -a 'REVIEW DONE' "$LOG" 2>/dev/null | tail -n 1)"
          if [ -z "$line" ]; then line="no REVIEW DONE line (see log)"; fi
          msg="news-publish edition=$EDITION outcome=${{ steps.review.outcome }} | $line"
          echo "$msg"
          echo "$msg" >> "$GITHUB_STEP_SUMMARY"

  llm_down:
    name: kaggle llm down
    needs: [llm_up, publish]
    if: ${{ always() && needs.llm_up.outputs.url != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tell the Kaggle server to stop (saves GPU quota)
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KURL: ${{ needs.llm_up.outputs.url }}
        run: |
          KEY=$(printf '%s:%s' "$KAGGLE_API_TOKEN" "$GITHUB_RUN_ID" | sha256sum | cut -c1-40)
          echo "::add-mask::$KEY"
          curl -sS -m 20 -X POST -H "Authorization: Bearer $KEY" "$KURL/__shutdown" || true
