name: shorts-au

# Render a native-language Australian English Short for the @AgyataWorld channel — sourced,
# synthesised, voiced and captioned ENTIRELY IN AUSTRALIAN ENGLISH (no translation),
# then auto-uploaded PUBLIC to the AU playlist. Nothing is
# committed to the repo; the staged output is purged after upload.
#
# CADENCE: agyata-cron-pinger workflow_dispatch. Public repo = free minutes.
on:
  workflow_dispatch:
    inputs:
      curiosity_long:
        description: 'Render the LANDSCAPE long-form curiosity deep-dive (4-8 min, watch-hours lane) this run — same as the cron-pinger morning slot. Leave unchecked for a news Short. The cron path uses the separate curiosity field; setting either to true renders long-form.'
        type: boolean
        required: false
        default: false
      curiosity:
        description: 'CURIOSITY_SHORTS (1 = render a curiosity essay this run; empty = news). Set by the cron-pinger morning slot; empty on the evening news slot, fast-path, and manual runs.'
        required: false
        default: ''
      fastpath:
        description: 'SHORTS_FASTPATH (1 = only render if the lead story clears the high-stakes fast-path bar; empty/normal run otherwise)'
        required: false
        default: ''
      category:
        description: 'Comma list of allowed categories/topics (SHORTS_CATEGORY_FILTER)'
        required: false
        default: ''
      content_mode:
        description: 'Entertainment content mode (movie-review/retro-movie/top10 → CONTENT_MODE)'
        required: false
        default: ''
      region:
        description: 'Region for world channel (usa/europe)'
        required: false
        default: ''

concurrency:
  # unique per run so same-workflow dispatches run in PARALLEL, never queue (user 2026-09-02)
  group: shorts-au-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  SHORTS_FACTS_FIRST: '1'  # 2026-09-19: pure facts-first story SELECTION (docs plan zany-inventing-lecun Phase 1) — select the lead on story/fact-quality gates only, no per-candidate image probe; the winner's visuals are fetched ONCE at render (kills the double media-fetch the user flagged as "very very wrong"). Fail-open: an image-less winner is still caught by the render-time blue-screen guard. Exercised across every render-verify this session (pl) — always gate PASSED, real on-topic images, no blue-screens.
  SHORTS_DENSE_SCRIPT: '1'  # 2026-09-19 (user directive): density-engine script — buildDensePrompt does fact-extract->rank->dense beats + internal density audit in ONE call replacing the micro-arc (call-neutral, Ollama-metered ~5x). Branches news vs curiosity internally; breaking arm on isBreakingNews. Fail-open to buildShortPrompt on any gap.
  SHORTS_EDITORIAL_CARDS: '1'  # 2026-09-19 (user directive): editorial verification + number cards — llmAssignWindows picks WHICH beat earns a source-meter (WHAT/HOW-MANY/WHICH) or number card; placement editorial, copy deterministic real-data. Additive+fail-open. Render-verified tr (f8a19d4).
  SHORTS_OPENING_CARD: '1'  # 2026-09-19: the editorial hook gate (BREAKING_NEWS_MODE.md §HOOK) — opens on a designed card that STATES the news (headline, or an identity WHO+WHAT card when a protagonist resolves) only when the lead shot doesn't already depict the event; self-evident footage/evidence/reaction/consequence still leads unconditionally. Render-verified tr (VW/Porsche, 6539204) + pl (Pezeshkian/Domanski identity-card fix, f7fd030) — quality gate PASSED, no regression on any lead-role case.
  SHORTS_VISUAL_DIVERSITY: '1'  # 2026-09-19: same-SUBJECT repetition pass (diversifySubjects, shot_roles.mjs) — breaks adjacent same-subject shots (invisible to the role taxonomy alone, since two photos of one subject both classify as generic 'footage') and caps a dominant subject's share, swapping in an unused pool image. Render-verified pl (59cc61b): 2 same-subject adjacencies broken, longest same-subject run reduced to 1.
  SHORTS_GROUND_SUBJECT_CAP: '1'  # 2026-09-22: beat-grounding subject-aware cap (perceptual-hash cluster inside groundBeatsToWindows; caps one visual SUBJECT's share of grounded beats) -- fixes a same-subject-different-FILE monopoly the plain distinct-KEY preference missed (5 game-art files of one character grounding 6/7 beats while a real exec photo sat unused, never reaching a card). Unit-proven (6 network-free tests, beat_grounding_subject_cap_test.mjs) + render-verified usa (Activision/Halo layoffs story: capped correctly, no regression; a product-photo-rich Beats-headphones story grounded 7/9 beats cleanly with the flag on). Fleet go-live 2026-09-22.
  SHORTS_VLM_CORP_CTX: '1'  # 2026-09-22 (carried from the prior "deepen fix" cycle): corporate/institutional context on the TEXT image-relevance judge + floor re-admission (visuals.mjs reAdmitToFloor) -- prioritizes a story's named-entity portraits/HQ so an executive/company photo reaches the VLM pixel gate instead of losing to visually-striking but generic key-art on caption relevance alone. Render-verified usa (3 entity-priority floor re-admits fired). Fleet go-live 2026-09-22.
  SHORTS_VLM_CLIP_LANG_GATE: '1'  # 2026-09-22 (carried from the prior "deepen fix" cycle): b-roll LANGUAGE guard -- the VLM video judge reads on-screen burned-in caption language and drops a clip whose text doesn't match this render's own script language, so a foreign-subtitled clip can't leak into an off-language channel. Render-verified usa (dropped an Arabic-caption clip: "Foreign-Language Caption×1"). Fleet go-live 2026-09-22.
  SHORTS_ENTITY_FROM_BODY: '1'  # 2026-09-22: entity extraction also reads the article BODY (not just title/summary), decomposing per-named-org so a story mentioning several distinct companies/people gets one entity per proper name instead of one merged blob -- feeds the corp-ctx/entity-portrait fetch above with more/better-targeted names. Fleet go-live 2026-09-22.
  CURIOSITY_SHORTS: ${{ github.event.inputs.curiosity == '1' && '1' || '' }}  # 2026-09-22: DECOUPLED from curiosity_long (user: "curiosity_long we can do every week 3" -- a fixed 3x/week cadence, separate from the daily morning curiosity-SHORT). curiosity=1 (cron-pinger's daily morning slot on its 4 non-long-form days) -> a grounded per-region curiosity essay (gather_stories.mjs first branch, SINGLE-only, FAIL-OPEN to news); curiosity_long='true' (the cron-pinger's dedicated 3x/week dispatch) takes the landscape branch below instead of this one. Afternoon/evening news + fast-path + manual runs leave both empty -> news. $0 (2 Ollama calls/video, never paid Gemini).
  CURIOSITY_LONG: ${{ github.event.inputs.curiosity_long == 'true' && '1' || '' }}  # 2026-09-22: DECOUPLED -- only the dedicated curiosity_long input triggers the LANDSCAPE deep-dive now (cron-pinger dispatches it 3x/week on its own cadence, not tied to the daily curiosity=1 slot). gather_stories CURIOSITY_LONG branch -> poolCuriosityResearched (CURIOSITY_RESEARCHED below) single-topic essay; fail-open to curiosity-short then news.
  SHORTS_ORIENTATION: ${{ github.event.inputs.curiosity_long == 'true' && 'landscape' || '' }}  # 16:9 dims for the curiosity_long run only (exemption from the 180s Shorts ceiling too); portrait for every curiosity-SHORT/news run.
  CURIOSITY_RESEARCHED: ${{ github.event.inputs.curiosity_long == 'true' && '1' || '' }}  # 2026-09-17, re-scoped 2026-09-22: RESEARCHES each scouted topic (full-article Wikipedia corpus) and writes the LANDSCAPE deep-dive from that source material instead of free-writing from LLM recall -- scoped to curiosity_long only now (decoupled from the daily curiosity-SHORT, which keeps its own recall-pool path). $0 (Ollama + bot-tier Wikipedia, never paid Gemini).
  SHORTS_CAPTIONS: '1'  # synced karaoke captions — real edge WordBoundary word timings threaded end-to-end (captionWords uses verbatim words, no syllable-estimate drift). Fleet-wide go-live 2026-09-14 after render-proven sync fix (was OFF: the estimate ran ahead = fast-forward). Fail-open: no real words -> caption track omitted.
  RESEARCH_POD: '1'  # multi-agent research pod (Fact-Finder + Devil's-Advocate + Localizer) on the finalised lead — Ollama-Cloud generation, fail-open (Modal grounding/rerank degrade to null until deployed). Enabled FLEET-WIDE 2026-09-12 (user lock; Ollama flat-rate, no incremental cost).
  # ── Phase 6/7 LLM STAGES model tag (2026-09-05, retagged 2026-09-19) — image rerank+assembly (Ph6)
  # and research stages. qwen3.5:397b-cloud RETIRED 2026-09-19 (5-day notice) -> glm-5.3:cloud for every
  # text-only call (image rerank + contextual assembly read CAPTIONS/metadata, never raw pixels — the
  # actual vision role is SHORTS_VLM_GATE_MODEL below, untouched). The two RESEARCH stages (lead-pick
  # rerank + deep synth) stay on deepseek-v4-pro:0813-cloud (user 2026-09-13: off gemma4) — all via the
  # per-call model override. Kept in env (not only the code default) so a rotted Ollama Cloud tag (§10
  # model-ID rot) is a 1-line workflow fix, never a silent fallback to a stale default. Feature gates
  # (SHORTS_LLM_RERANK / SHORTS_LLM_ASSEMBLY / SHORTS_RESEARCH_SYNTH) default ON in code.
  SHORTS_LLM_RERANK_MODEL: 'glm-5.3:cloud'
  SHORTS_LLM_ASSEMBLY_MODEL: 'glm-5.3:cloud'
  SHORTS_RESEARCH_MODEL: 'deepseek-v4-pro:0813-cloud'  # research lead-pick rerank (user 2026-09-13: gemma4:31b → deepseek-v4-pro:0813-cloud; adapter sends think:false so no reasoning leak / empty responses; ~5x gemma token cost, user-approved §8)
  SHORTS_RESEARCH_SYNTH_MODEL: 'deepseek-v4-pro:0813-cloud'  # deep research brief (user 2026-09-13: both research stages on deepseek-v4-pro:0813-cloud, off gemma4:31b)
  EDITOR_ATTRACTIVENESS: '1'  # editor pool-level attractiveness rating (2026-09-03, Ollama-headroom quality plan) — near-zero extra cost, adds a field to the existing single editor call
  EDITOR_STAKES: '1'  # stakes gate (retention Initiative A, 2026-09-06) — LLM-judged human-stakes 0-5 rides the SAME editor call; demotes a rated sub-3 video pick and promotes the best higher-stakes eligible alt. Fail-open (unjudged never blocks).
  # ── CHATTERBOX TTS (Modal GPU) — natural voice, all channels (2026-08-30) ──
  # Fail-opens to the offline engine (kokoro/piper) on any Modal outage, so it can never drop a video.
  CHATTERBOX_TTS: '1'
  CHATTERBOX_ENDPOINT: ${{ secrets.CHATTERBOX_ENDPOINT }}
  CHATTERBOX_TOKEN: ${{ secrets.CHATTERBOX_TOKEN }}
  SHORTS_FOLEY: '1'   # diegetic foley — event-synced $0/CPU SFX, fail-open (rolled out to all shorts 2026-08-06)
  SHORTS_GDELT: '1'      # GDELT breaking-news gather source (GKG-first, fail-open) (2026-09-07)
  SHORTS_VLM_GATE: '1'   # pixel-truth VLM image gate (Ollama Cloud, via SHORTS_VLM_GATE_MODEL) — prune hallucinated off-topic photos before planShots; fail-open, staged world/au first (never bharat) 2026-09-07
  SHORTS_VLM_GATE_MODEL: 'deepseek-v4.1-flash:cloud'  # 2026-09-13: replace gemma4:31b on the pixel-truth image gate with a flagship-flash multimodal model (both vision-capable; deepseek-flash ~2.3s/img vs gemma ~1.6s; qwen3.5:397b ~5.1s = too slow for a 24-image gate). think:false already set (visual_gate.mjs). Fail-open; revert to gemma4:31b if pruning regresses.
  # ── FACT-INTEGRITY + ENTITY-RELEVANCE FLEET ROLLOUT (2026-09-20, render-verified across usa/vi/jp/pl/ar,
  # 2367/2367 tests) — root-caused via a real RAF-13/technical-fall confabulation + a Moscow/Japan render
  # review. SHORTS_STORY_FACTCHECK/SHORTS_FACTCHECK: reuse the existing factCheckBeats corpus-check to gate
  # a story's own synthesized claim (not just generated script beats) before it can become a video, and to
  # drop any script beat the source material doesn't support. SHORTS_ENTITY_RESOLVE_WIDE/
  # SHORTS_VISUAL_ENTITY_PLAN/SHORTS_VLM_ENTITY_CTX/SHORTS_STILL_ENTITY_GATE: widen+disambiguate entity
  # portraits and thread named entities into the VLM/caption/still relevance judges — fixed a real wrong-
  # country image bug (a UK political conference + a Hong Kong charity event survived into a Japan render
  # before this). Fail-open throughout; each independently render-verified this session.
  SHORTS_STORY_FACTCHECK: '1'
  SHORTS_FACTCHECK: '1'
  SHORTS_ENTITY_RESOLVE_WIDE: '1'
  SHORTS_VISUAL_ENTITY_PLAN: '1'
  SHORTS_VLM_ENTITY_CTX: '1'
  SHORTS_STILL_ENTITY_GATE: '1'
  # ── CINEMATIC ENGINE (setup_cinematic.sh provisions the models; all fail-open) ──
  SHORTS_CINEMATIC: '1'
  # ROLLED BACK 2026-08-28 (user: distorted first frames + shorts landing 20-30s, not 45-60s) —
  # render.mjs now uses a plain left-right slide pan (media/window.mjs) for every still; DOF and
  # SPATIAL_GFX below are sub-gated on SHORTS_DEPTH_3D and go inert with it.
  SHORTS_DEPTH_3D: '0'
  SHORTS_DEPTH_OCCLUSION: '0'
  SHORTS_SPATIAL_GFX: '0'   # story-keyword graphic behind the matted subject (occlusion route); fail-open, $0. render.mjs auto-wiring landed (shorts/visual/spatial_keyword.mjs).
  DEPTH_MODEL: /tmp/models/depth_anything_v2_vits.onnx
  MATTE_MODEL: /tmp/models/u2net.onnx
  DEPTH_SIZE: '392'
  DEPTH_CACHE_DIR: /tmp/agyata-depth
  MATTE_CACHE_DIR: /tmp/agyata-matte
  PARALLAX_CACHE_DIR: /tmp/agyata-parallax
  DEPTH_MAX_IMAGES: '12'
  MATTE_MAX_IMAGES: '12'
  DEPTH_BUDGET_MS: '20000'
  MATTE_BUDGET_MS: '20000'
  DEPTH_THREADS: '2'
  MATTE_THREADS: '2'
  OCCLUSION_MAX_PER_CLIP: '4'
  ASSEMBLE_CONCURRENCY: '2'
  SHORTS_DEBUG: '1'
  LONGFORM_RAG_TRACE: '1'
  # SCOPED TEST (2026-09-01, voice-QC follow-up — "3.5 g of methylamphetamine" read flat): word-level
  # emphasis on edge-tts via WordBoundary timing (tts_dsp.mjs's planWordEmphasis). Gain-only, default
  # OFF everywhere else — au is the ONE channel testing this before any wider rollout (see
  # build_short.mjs's ttsForStory for the full mechanism + why splitting calls/SSML were rejected).
  EDGE_TTS_WORD_EMPHASIS: '1'
  # SCOPED TEST (2026-09-01, user: "extend our video limit for shorts to 180sec"): the deep-tier
  # micro-arc (research_script.mjs SHORT_ARC extension, up to 6 beats) — default OFF everywhere else,
  # STILL gated per-story by isDepthWorthy even here (a thin story ships at today's normal length
  # regardless of this flag). au is the one channel testing this before any wider rollout.
  SHORTS_LONG_MICROARC: '0'  # 2026-09-12: reverted to the normal 3-beat 45-60s tier — user wants <=1 min for FB/IG/YT (was '1' deep 6-beat/150-180s; build_short.mjs 55s narration cap backstops)
  # SELECTION (user 2026-09-12: "select and produce most blazing and in demand stories"). Reward
  # slot:'trending' provenance (was inert at weight 0) + lift the hook/attractiveness rerank so
  # genuinely hot, high-retention picks win. Paired with the widened live-trending pull
  # (SHORTS_TRENDS_PERGEO/SHORTS_X_PERGEO code defaults). Fact-corroboration gate unchanged (primary).
  EDITORIAL_W_TRENDING: '6'
  EDITORIAL_W_HOOK: '5'
  EDITORIAL_W_ATTRACTIVENESS: '4'
  # SCOPED TEST (2026-09-07, real incident on THIS channel — run 34023683369 shipped an 83.3s video
  # whose stated "150-180s" target mismatched its actual 6-beat count, tripped the clipTooHeavy
  # cinematic-finish skip, and froze): assessStoryValue/durationTargetFor keep the prompt's stated
  # duration consistent with the real beat count instead of a fixed binary string. See
  # docs/acceptance/shorts-intelligent-duration.json. au is the one channel proving this before wider
  # rollout, same convention as SHORTS_LONG_MICROARC above.
  SHORTS_INTELLIGENT_DURATION: '1'
  # SCOPED TEST (2026-09-07, real incident on THIS channel — run 34104108639 shipped a real 55s freeze
  # on an unrelated image, frame-verified). Replaces the multi-window chained-xfade composite with
  # per-window trivial clips + a hard-cut concat (render.mjs's buildBackgroundTrack) — fail-open to
  # today's path on any error. au proves this before wider rollout, same convention as the two flags
  # above.
  SHORTS_BG_PRERENDER: '1'
  SHORTS_CATEGORY_FILTER: ${{ github.event.inputs.category }}
  CONTENT_MODE: ${{ github.event.inputs.content_mode }}
  SHORTS_FASTPATH: ${{ github.event.inputs.fastpath }}
  API_BASE: https://api.agyata.com
  SHORTS_PY: python
  # PUBLIC + monetized (user: "make all native language crons at direct public with right
  # playlist"). build_short reads SHORTS_PRIVACY into meta.privacyStatus → upload.mjs sets it
  # on videos.insert, so the video is public the moment it's uploaded (no manual Studio flip).
  # A DEMONETIZATION GUARD (shorts/safety.mjs) drops policy-unsafe stories + masks strong
  # profanity/slurs before render, so going straight-to-public is monetization-safe.
  SHORTS_PRIVACY: public
  # Durable VIDEO-DEDUP ledger (Upstash Redis) — render reads (drop already-made stories),
  # upload writes after a successful publish. Keyed by channel label so pl is independent.
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  # AUTHENTICATED WIKIMEDIA SESSION (2026-09-02, user created a bot account specifically for
  # this: "we have 200 request/sec limit, use it"). Fail-open: unset/wrong and every entity-
  # image call proceeds exactly as before this existed (anonymous, same as today).
  WIKIMEDIA_BOT_USER: ${{ secrets.WIKIMEDIA_BOT_USER }}
  WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIMEDIA_BOT_PASSWORD }}
  OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
  OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
  SHORTS_OPENVERSE_PAGE_SIZE: '100'  # authed tier (Openverse app email verified 2026-09-05); anon caps at 20. Effective = min(this, limit*3) in shorts/media/openverse.mjs; fail-open on any 4xx.
  # ── LLM PROVIDER LADDER — the SAME shared router the news pipeline uses
  #    (src/providers.mjs), NVIDIA-first then the rest of the free tier, local Ollama last.
  #    A provider is skipped if its key is absent; fail-fast. This turns the raw article body
  #    into a clean, non-repetitive brief per story — synthesised IN THE CHANNEL'S LANGUAGE.
  PROVIDER_ORDER: 'ollama'  # OLLAMA CLOUD ONLY (user 2026-09-12: "it should first hit the ollama cloud only"). Free-tier fallbacks were all dead (cerebras 402, nvidia 410, gitmodels retired, sambanova/mistral 429, openrouter/cohere timeout) — pure latency+log-noise. Ollama Max is the sole engine (project_ollama_max_switch); the 6-retry adapter + pipeline fail-open handle a transient blip.
  PROVIDER_USE_OLLAMA: '1'  # Ollama Cloud primary (user 2026-08-03: ollama first, free tiers fallback)
  WM_RENDER_CLAIMS: '1' # Worldmodel graph-backed render (claims/divergence) — noise-filtered content
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  NVIDIA_MODEL: 'meta/llama-3.3-70b-instruct'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: 'gemini-flash-lite-latest'
  SOMBANOVA_API_KEY: ${{ secrets.SOMBANOVA_API_KEY }}
  SAMBANOVA_MODEL: 'Meta-Llama-3.3-70B-Instruct'
  COHERA_API_KEY: ${{ secrets.COHERA_API_KEY }}
  COHERE_MODEL: 'command-r-08-2024'
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: 'openrouter/free'
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MISTRAL_MODEL: 'mistral-small-latest'
  GITMODELS_API_KEY: ${{ secrets.GITMODELS_API_KEY }}
  GITMODELS_MODEL: 'openai/gpt-4o-mini'
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: 'gpt-4o-mini'
  OPENAI_DAILY_CAP: '30'
  OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'deepseek-v4-pro:0813-cloud' }}  # global default (user 2026-09-13: gemma4:31b → deepseek-v4-pro:0813-cloud). NOTE: the OLLAMA_MODEL repo secret OVERRIDES this default — repointed to deepseek-v4-pro:0813-cloud via gh secret set.
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OLLAMA_GLOBAL_CONCURRENCY: '10'  # 2026-09-13: RE-ENABLED cross-job Ollama D1 semaphore (cap=10 = Ollama Max concurrency) after the Cloudflare free-tier quota reset (was '0' since 2026-09-12, when per-LLM-call acquire/release via api-gateway->news-svc + a 120s backoff poll storm under contention flooded those Workers toward the 100k/day cap). Fail-open on D1 error; the poll-storm amplifier under contention is still unfixed — watch news-svc request volume.
  SHOWRUNNER: '1'  # late-night-show rewrite pass (Stage 1b, enabled 2026-08-29 after real-render verification)
  OLLAMA_MAX_TRIES: '6'
  PROVIDER_HOSTED_TIMEOUT_MS: '60000'
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
  DEEPINFRA1_API_KEY: ${{ secrets.DEEPINFRA1_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF1_TOKEN: ${{ secrets.HF1_TOKEN }}
  HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
  HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}

jobs:
  render:
    runs-on: ubuntu-latest
    # BUMPED 40->60 (2026-09-01, SCOPED TEST): a deep-tier 6-beat/150-180s micro-arc (SHORTS_LONG_MICROARC
    # below) needs proportionally more render wall-time than the 3-beat/45-90s baseline this 40min budget
    # was sized for — raised so a job timeout doesn't mask whether the FEATURE itself works. Revert to 40
    # once this test is done (or if the deep tier proves it fits comfortably under 40 anyway).
    # 120min for every run (user 2026-09-17, "for simplicity make all job 120 minutes"): the morning
    # curiosity deep-dive overran the old 60min cap mid-encode (shorts-pl 2026-09-16 cancelled at ~61min).
    timeout-minutes: 120
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true

      # ── SHARED SETUP (perf): node+npm, apt+fonts, python+pip cache, cinematic ONNX provisioning,
      # + the ONNX model-WEIGHTS cache — ONE composite action (private repo; resolves after the
      # checkout above). Replaces the per-channel setup; all deps preserved verbatim as inputs.
      - name: Render setup (cached)
        uses: ./.github/actions/render-setup
        with:
          tts-pip: 'kokoro soundfile sentencepiece faster-whisper edge-tts num2words'
          apt-packages: 'ffmpeg librsvg2-bin espeak-ng fonts-dejavu fonts-noto-core fonts-noto-cjk fonts-noto-extra'

      - name: Restore cinematic ONNX depth/matte maps + parallax clips (shared across ALL channels/runs)
        if: env.SHORTS_DEPTH_3D == '1'
        id: cinematic-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/agyata-depth
            /tmp/agyata-matte
            /tmp/agyata-parallax
          key: cinematic-maps-${{ runner.os }}-v1

      - name: Stamp
        run: echo "SHORTS_STAMP=$(date -u +%Y%m%dT%H%M)" >> "$GITHUB_ENV"

      - name: Render Australian English Short
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          # Cross-run dedup: claim story keys via api.agyata.com before rendering so two
          # pl runs (a Short + a long-form in the same window) never publish the same story.
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
        run: node shorts/build_short.mjs au

      # AUTO-UPLOAD to YouTube as PUBLIC (SHORTS_PRIVACY=public). Native channels are PLAYLISTS
      # on @AgyataWorld, so they authenticate with YT_REFRESH_TOKEN_WORLD and land in the PL
      # playlist (YT_PLAYLIST_AU). On success sets uploaded=true so the video is NOT also
      # published as a public artifact. Best-effort — never fails the run.
      - name: Auto-upload to YouTube (public)
        id: yt
        continue-on-error: true
        env:
          # Durable video-dedup ledger WRITE — upload.mjs calls markPublished/markTopicsPublished/
          # markCuriosityTopicsPublished here; without this token d1Enabled() is false and every
          # ledger write silently no-ops → the render step reads an empty ledger → duplicates ship.
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          # Own channel token if minted (YT_REFRESH_TOKEN_AU), else the @AgyataWorld token.
          YT_REFRESH_TOKEN_AU: ${{ secrets.YT_REFRESH_TOKEN_AU }}
          YT_REFRESH_TOKEN_WORLD: ${{ secrets.YT_REFRESH_TOKEN_WORLD }}
          YT_PLAYLIST_AU: ${{ secrets.YT_PLAYLIST_AU }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN_AU" ] && [ -z "$YT_REFRESH_TOKEN_WORLD" ]; then echo "no refresh token — skipping upload (artifact only)"; exit 0; fi
          node shorts/upload.mjs au "$SHORTS_STAMP"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      # AUTO-POST to Facebook Pages + their linked Instagram accounts via the Meta Graph API — the
      # same token-based model as the YouTube upload above (user 2026-09-12: "use graph API and post
      # like you are doing for youtube ... post on all pages that it has with post and video"). Reads
      # the staged Short from STAGE_DIR (before the purge below) and posts the video with an SEO
      # caption + hashtags. Skips cleanly until META_USER_TOKEN is set; best-effort — never fails run.
      - name: Auto-post to Facebook + Instagram (Graph API)
        if: always()
        continue-on-error: true
        env:
          SHORTS_SOCIAL_PUBLISH: '1'
          META_PAGE_AU: ''  # un-mapped from Agyata World 2026-09-14 per user (only shorts-usa -> Agyata World; no other English Page, so FB posts nowhere; YouTube unaffected)
          META_USER_TOKEN: ${{ secrets.META_USER_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          THREADS_USER_TOKEN: ${{ secrets.THREADS_USER_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          if [ -z "$META_USER_TOKEN" ]; then echo "no META_USER_TOKEN — skipping social auto-post (run shorts/social_bootstrap.mjs, then add the secret)"; exit 0; fi
          node shorts/social_publish.mjs au "$SHORTS_STAMP"

      # LAST content-generating step: SEO-friendly title/description/hashtags for Facebook,
      # Instagram and X, derived from the SAME meta.json used for the YouTube upload above.
      # Generation only — nothing is posted to any platform (no app review, no new secrets).
      # Writes docs/shorts/au/<stamp>/social.json (meta+thumbnail+video bundled) and prints a
      # caption preview to the job's step summary, so the pack survives the purge step below
      # even though the staged file itself doesn't. Best-effort: never blocks the pipeline.
      - name: Generate social captions (Facebook/Instagram/X)
        if: always()
        continue-on-error: true
        run: node shorts/social_meta.mjs au "$SHORTS_STAMP"

      # REVIEW COPY only — kept solely when the YouTube upload did NOT happen. On a PUBLIC repo
      # an artifact is publicly downloadable, so once the video is on YouTube we never publish
      # it here. 1-day retention even then.
      - name: Upload staged artifact (only if NOT uploaded to YouTube)
        if: steps.yt.outputs.uploaded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: short-au-${{ env.SHORTS_STAMP }}
          path: docs/shorts/au/
          retention-days: 1
          if-no-files-found: warn

      # PURGE the rendered MP4 + metadata from the runner after upload — nothing rendered
      # lingers on GitHub. Always runs.
      - name: Save cinematic ONNX depth/matte maps + parallax clips (grows the shared cache for every channel)
        if: always() && env.SHORTS_DEPTH_3D == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/agyata-depth
            /tmp/agyata-matte
            /tmp/agyata-parallax
          key: cinematic-maps-${{ runner.os }}-v1
      - name: Purge staged output
        if: always()
        run: rm -rf docs/shorts/au/* || true
