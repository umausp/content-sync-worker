name: longform2-world

# NEW independent long-form class (shorts/longform2/) — MoviePy render, Gemini BATCH TTS, forced-
# alignment captions, deep grounded research, 2-speaker dialogue. Separate from the shorts engine.
# workflow_dispatch only for now (the vertical-slice pilot); a cron is added once it's proven.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Channel id (world|usa|uk)'
        required: false
        default: 'world'

concurrency:
  group: longform2-world
  cancel-in-progress: false

permissions:
  contents: read

env:
  API_BASE: https://api.agyata.com
  SHORTS_PY: python
  SHORTS_ORIENTATION: landscape
  SHORTS_PRIVACY: unlisted   # pilot — keep unlisted until the output is reviewed
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  PROVIDER_ORDER: 'gemini,sambanova,openrouter,groq,cohere,nvidia,mistral,gitmodels,hfspace,huggingface,huggingface1,deepinfra,deepinfra1,cerebras,openai,ollama'
  PROVIDER_USE_OLLAMA: '0'
  WM_RENDER_CLAIMS: '0'
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  NVIDIA_MODEL: 'meta/llama-3.3-70b-instruct'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: 'gemini-flash-lite-latest'
  # DEPTH — 8-10 min target (user 2026-07-31). Raise beat ceilings + corpus so the arc CAN reach 11-12
  # min; anti-padding still caps actual length to what the deep multi-outlet corpus supports.
  LONGFORM_BEAT_SCALE: '1.8'
  LONGFORM_CORPUS_CHARS: '32000'
  LONGFORM_DEEPEN_OUTLETS: '16'   # re-scrape up to 16 grounded outlets (was 10) → deeper corpus
  WORLD_SYNTH_PER_OUTLET: '2400'  # more prose kept per outlet (was 1200)
  WORLD_ENRICH_OUTLETS: '16'      # enrichSummary pulls prose+images from more outlets
  LONGFORM2_DEEPEN_CANDIDATES: '4'
  # PUBLISH the deep pool to the news site D1 (all gathered stories are site-worthy).
  NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
  WM_PUBLISH_MAX: '10'
  SOMBANOVA_API_KEY: ${{ secrets.SOMBANOVA_API_KEY }}
  SAMBANOVA_MODEL: 'Meta-Llama-3.3-70B-Instruct'
  COHERA_API_KEY: ${{ secrets.COHERA_API_KEY }}
  COHERE_MODEL: 'command-r-08-2024'
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: 'openrouter/free'
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MISTRAL_MODEL: 'mistral-small-latest'
  GITMODELS_API_KEY: ${{ secrets.GITMODELS_API_KEY }}
  GITMODELS_MODEL: 'openai/gpt-4o-mini'
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
  UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  longform2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci --no-audit --no-fund

      - name: Install system deps (ffmpeg + fonts + ImageMagick for MoviePy TextClip)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core imagemagick librsvg2-bin

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache HuggingFace models (faster-whisper alignment)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-whisper-lf2-v1

      - name: Install Python deps (MoviePy + faster-whisper + audio)
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet moviepy pillow numpy soundfile faster-whisper

      - name: Stamp
        id: stamp
        run: echo "stamp=$(date -u +%Y%m%dT%H%M%S)" >> "$GITHUB_OUTPUT"

      - name: Build long-form (research → dialogue → batch TTS → align → MoviePy)
        env:
          SHORTS_STAMP: ${{ steps.stamp.outputs.stamp }}
          ALIGN_WHISPER_MODEL: base
        run: node shorts/longform2/build.mjs ${{ inputs.channel }}

      - name: Upload rendered longform artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longform2-${{ inputs.channel }}-${{ steps.stamp.outputs.stamp }}
          path: docs/shorts/lf2-*/**/longform.mp4
          if-no-files-found: warn
          retention-days: 7
