name: _longform-doc (reusable)

# Fan-out / fan-in doc long-form render, called by longform-money/business/tech.yml.
#   prepare  : topic -> research -> script -> visuals -> narration -> plan + gate #5 preflight.
#              Saves a checkpoint + the work dir as an artifact. Fails fast (no render) on a bad plan.
#   render   : one job per chapter (matrix), each on its own runner with a fresh render budget.
#   finalize : concat + music/foley + release gate + YouTube upload (unchanged tail).
# Every job runs the SAME workdir path, so absolute paths in the checkpoint stay valid.

on:
  workflow_call:
    inputs:
      channel: { type: string, required: true }        # no | da | nl
      name: { type: string, required: true }           # longform-money | longform-business | longform-tech
      pipeline_ref: { type: string, required: false, default: '' }
      format: { type: string, required: false, default: mid }
      privacy: { type: string, required: false, default: unlisted }
      script_only: { type: boolean, required: false, default: false }

env:
  DOC_MODE: '1'
  DOC_FORMAT: ${{ inputs.format }}
  SHORTS_ORIENTATION: landscape
  LONGFORM_PIPELINE: '1'
  SHORTS_PRIVACY: ${{ inputs.privacy }}
  SHORTS_DEBUG: '1'
  SHORTS_CINEMATIC: '1'
  # Burned-in karaoke captions (real edge WordBoundary timings). Off by default in captions_fluid.mjs; every
  # shorts workflow sets it, the doc workflow never did → docs shipped with no captions (CI 39147389689).
  SHORTS_CAPTIONS: '1'
  # Provider-shaped queries (shared media/retrieval/query_adapt): Commons/Pixabay get concise nouns without
  # photo-style words. Same switch shorts-world runs with.
  SHORTS_PROVIDER_QUERY_ADAPT: '1'
  # Shorts' still chain for docs: wider DDG pull per query -> ffmpeg/sanity check -> local Gemma-4 rerank (the
  # Local VLM step below starts the server) -> cloud VLM gate -> per-sentence grounding. Same flags as shorts-*.yml.
  SHORTS_LOCAL_VLM_RANK: '1'
  # longform-studio Phase 1 (private repo packages/longform-studio): whisper audit of every narrated beat
  # against the spoken text — logs [studio:tts-audit] lines (number/lexicon misses). Fail-open; the
  # pronunciation pre-pass itself is default-on (STUDIO_TTS_PREPASS=0 disables).
  STUDIO_TTS_AUDIT: '1'
  # longform-studio Phase 2: per-market localized title+description (≤8 Ollama calls, fail-open) and the
  # payoff's polarising question posted as the channel's first comment (shorts/engage.mjs, best-effort).
  # Story rules + host persona are default-on in the private repo (STUDIO_STORY_RULES / STUDIO_PERSONA = 0 to disable).
  STUDIO_LOCALIZE: '1'
  SHORTS_ENGAGE: '1'
  # longform-studio Phase 3: per-sentence query expansion is default-on in the private repo
  # (STUDIO_QUERY_EXPAND=0 disables); the LLM variant adds one Ollama call per chapter; the per-segment
  # search budget doubles (DOC_SEG_SEARCH_MAX, default 40) so the extra queries actually get run. The
  # 0.75 grounding gate is unchanged — more candidates, same judge.
  STUDIO_QUERY_LLM: '1'
  DOC_SEG_SEARCH_MAX: '80'
  # longform-studio Phase 5 (DENSITY_ENGINE_PLAN.md): no still longer than 4 s (cuts on real word boundaries, split
  # parts move differently), a 1.5 s chapter card per chapter, density report in OBSERVE mode on the first real run
  # (STUDIO_DENSITY_BARS flips to '1' once the measured numbers are seen). More windows per clip → more safe-motion plans.
  STUDIO_DENSITY_BARS: '0'
  STUDIO_SHOT_MAX_HOLD: '4'
  STUDIO_CHAPTER_CARDS: '1'
  SAFE_MOTION_MAX_PER_CLIP: '12'
  SHORTS_DDG_IMAGE_PER_QUERY: '20'       # raw DDG hits per query (shorts default 6)
  SHORTS_DDG_IMAGE_QUERIES: '16'         # sentence queries + keywords sent to DDG per gather (default 10)
  SHORTS_DDG_IMAGE_LICENSE_CHECKS: '60'  # origin-licence verifications per gather (default 20); rights-host gate unchanged
  SHORTS_DDG_IMAGE_STORY_CAP: '120'      # per-story admitted DDG pool (default 48)
  SHORTS_WORK_DIR: ${{ github.workspace }}/.shorts-work
  # LLM ladder: Ollama Cloud ONLY. Gemini is a paid key and is deliberately NOT wired here.
  PROVIDER_ORDER: 'ollama'
  PROVIDER_USE_OLLAMA: '1'
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  OLLAMA_MAX_TRIES: '6'
  OLLAMA_GLOBAL_CONCURRENCY: '10'
  DOC_WRITER_MODEL: 'deepseek-v4-pro:0813-cloud'
  DOC_CRITIC_MODEL: 'deepseek-v4-pro:0813-cloud'
  DOC_RESEARCH_MODEL: 'deepseek-v4-pro:0813-cloud'
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
  PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
  PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
  UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
  EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
  WIKIMEDIA_BOT_USER: ${{ secrets.WIKIMEDIA_BOT_USER }}
  WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIMEDIA_BOT_PASSWORD }}
  OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
  OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
  SHORTS_OPENVERSE_PAGE_SIZE: '100'
  SHORTS_DDG_PROXY_URL: ${{ secrets.DDG_PROXY_URL }}
  SHORTS_DDG_RESEARCH: '1'
  SHORTS_DDG_RESEARCH_RECENCY: 'w'
  SHORTS_DDG_IMAGE_LICENSE: ShareCommercially
  SHORTS_DDG_VIDEO_LICENSE: creativeCommon
  SHORTS_DDG_RETRIES: '3'
  SHORTS_VLM_GATE: '1'
  SHORTS_VLM_STRICT: '1'
  SHORTS_VLM_GATE_MODEL: 'deepseek-v4.1-flash:cloud'
  # Same VLM gate flags as shorts-*.yml. Without TIER the strict gate is the binary news prompt, which
  # rejected 145/149 on-topic photos as "Unrelated Content" (run 39159448988). Tier still hard-rejects a
  # confident WRONG; entity/corp/still-entity guards stay strict on wrong people, brands and places, and
  # every placed photo still needs per-sentence grounding at 0.75.
  SHORTS_VLM_TIER: '1'
  SHORTS_VLM_ENTITY_CTX: '1'
  SHORTS_VLM_CORP_CTX: '1'
  SHORTS_VLM_CLIP_LANG_GATE: '1'
  SHORTS_STILL_ENTITY_GATE: '1'
  SHORTS_VLM_GATE_FALLBACK_MODELS: gemma4:31b-cloud
  SHORTS_ALLOW_STOCK: '1'
  EDGE_TTS_RELAY_URL: ${{ vars.EDGE_TTS_RELAY_URL }}
  EDGE_TTS_RELAY_TOKEN: ${{ secrets.EDGE_TTS_RELAY_TOKEN }}
  EDGE_TTS_RELAY_DISABLE: ${{ vars.EDGE_TTS_RELAY_DISABLE }}
  RESEARCH_POD_ENDPOINT: ${{ secrets.RESEARCH_POD_ENDPOINT }}
  RESEARCH_POD_TOKEN: ${{ secrets.RESEARCH_POD_TOKEN }}
  API_BASE: https://api.agyata.com
  SHORTS_PY: python
  YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
  YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}

jobs:
  # Script front half only (topic -> research -> writer/critic). No ffmpeg/TTS, no render, no upload.
  script:
    if: inputs.script_only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ inputs.pipeline_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci --no-audit --no-fund
      - name: Script only (doc_script_live probe)
        run: node tools/acceptance/probes/doc_script_live.mjs ${{ inputs.channel }} ${{ inputs.format }}
      - name: Upload doc script JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-script-${{ github.run_id }}
          path: work/doc/*.json
          retention-days: 7
          if-no-files-found: warn

  prepare:
    if: ${{ !inputs.script_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      stamp: ${{ steps.stamp.outputs.stamp }}
      beats: ${{ steps.plan.outputs.beats }}
      ready: ${{ steps.plan.outputs.ready }}
    env:
      SHORTS_PHASE: prepare
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ inputs.pipeline_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Render setup (cached)
        uses: ./.github/actions/render-setup
        with:
          tts-pip: 'kokoro soundfile sentencepiece faster-whisper edge-tts'
          apt-packages: 'ffmpeg librsvg2-bin espeak-ng fonts-dejavu fonts-noto-core fonts-noto-cjk fonts-noto-extra'
          voice-cache-path: '~/.cache/huggingface'
          voice-cache-key: 'hf-kokoro-m2m100-v1'
      - name: Local VLM (Gemma-4-E2B reranker, fail-open)
        uses: umausp/content-sync-worker/.github/actions/local-vlm@main
      - id: stamp
        name: Stamp
        run: |
          S=$(date -u +%Y%m%dT%H%M)
          echo "SHORTS_STAMP=$S" >> "$GITHUB_ENV"
          echo "stamp=$S" >> "$GITHUB_OUTPUT"
      - name: Prepare (script, visuals, narration, plan, preflight)
        run: node shorts/build_short.mjs ${{ inputs.channel }}
      - id: plan
        name: Read render plan
        run: |
          P=$(ls .shorts-work/${{ inputs.channel }}/*/lf_plan.json 2>/dev/null | head -1)
          if [ -z "$P" ]; then
            echo "no render plan (gate/preflight stopped the run) — nothing to render"
            echo "ready=false" >> "$GITHUB_OUTPUT"; echo "beats=[]" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "beats=$(jq -c '[.plans[].i]' "$P")" >> "$GITHUB_OUTPUT"
          jq -c '.plans[] | {i, beat, dur}' "$P"
      - name: Upload run state
        if: steps.plan.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-state-${{ github.run_id }}
          path: .shorts-work/${{ inputs.channel }}/
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
      - name: Upload doc script JSON (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-script-${{ steps.stamp.outputs.stamp }}
          path: work/doc/*.json
          retention-days: 7
          if-no-files-found: warn

  render:
    needs: prepare
    if: needs.prepare.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        beat: ${{ fromJSON(needs.prepare.outputs.beats) }}
    env:
      SHORTS_PHASE: render
      LF_BEATS: ${{ matrix.beat }}
      SHORTS_STAMP: ${{ needs.prepare.outputs.stamp }}
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ inputs.pipeline_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Render setup (cached)
        uses: ./.github/actions/render-setup
        with:
          tts-pip: 'kokoro soundfile sentencepiece faster-whisper edge-tts'
          apt-packages: 'ffmpeg librsvg2-bin espeak-ng fonts-dejavu fonts-noto-core fonts-noto-cjk fonts-noto-extra'
          voice-cache-path: '~/.cache/huggingface'
          voice-cache-key: 'hf-kokoro-m2m100-v1'
      - name: Download run state
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.name }}-state-${{ github.run_id }}
          path: .shorts-work/${{ inputs.channel }}/
      - name: Render chapter ${{ matrix.beat }}
        run: node shorts/build_short.mjs ${{ inputs.channel }}
      - name: Upload chapter clip
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-clip-${{ github.run_id }}-${{ matrix.beat }}
          path: |
            .shorts-work/${{ inputs.channel }}/${{ needs.prepare.outputs.stamp }}/pipeline/clip-*
            .shorts-work/${{ inputs.channel }}/${{ needs.prepare.outputs.stamp }}/pipeline/lf_render_*
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          if-no-files-found: warn

  finalize:
    needs: [prepare, render]
    if: always() && needs.prepare.outputs.ready == 'true' && needs.render.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SHORTS_PHASE: finalize
      SHORTS_STAMP: ${{ needs.prepare.outputs.stamp }}
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          ref: ${{ inputs.pipeline_ref }}
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
      - name: Render setup (cached)
        uses: ./.github/actions/render-setup
        with:
          tts-pip: 'kokoro soundfile sentencepiece faster-whisper edge-tts'
          apt-packages: 'ffmpeg librsvg2-bin espeak-ng fonts-dejavu fonts-noto-core fonts-noto-cjk fonts-noto-extra'
          voice-cache-path: '~/.cache/huggingface'
          voice-cache-key: 'hf-kokoro-m2m100-v1'
      - name: Download run state
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.name }}-state-${{ github.run_id }}
          path: .shorts-work/${{ inputs.channel }}/
      - name: Download chapter clips
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.name }}-clip-${{ github.run_id }}-*
          merge-multiple: true
          path: .shorts-work/${{ inputs.channel }}/${{ needs.prepare.outputs.stamp }}/pipeline/
      - name: Finalize (concat, release gate, stage)
        run: node shorts/build_short.mjs ${{ inputs.channel }}
      # The ONE refresh token for this channel. No WORLD fallback: a doc channel uploads to its own channel or not at all.
      - name: Select channel YouTube token
        id: yt_token
        env:
          YT_REFRESH_TOKEN_NO: ${{ secrets.YT_REFRESH_TOKEN_NO }}
          YT_REFRESH_TOKEN_DA: ${{ secrets.YT_REFRESH_TOKEN_DA }}
          YT_REFRESH_TOKEN_NL: ${{ secrets.YT_REFRESH_TOKEN_NL }}
        run: |
          case "${{ inputs.channel }}" in
            no) TOKEN="$YT_REFRESH_TOKEN_NO"; VAR=YT_REFRESH_TOKEN_NO ;;
            da) TOKEN="$YT_REFRESH_TOKEN_DA"; VAR=YT_REFRESH_TOKEN_DA ;;
            nl) TOKEN="$YT_REFRESH_TOKEN_NL"; VAR=YT_REFRESH_TOKEN_NL ;;
            *) echo "unknown channel"; exit 1 ;;
          esac
          if [ -z "$TOKEN" ]; then
            echo "no $VAR secret — upload will be skipped (artifact only)"
            echo "has_token=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "::add-mask::$TOKEN"
          echo "$VAR=$TOKEN" >> "$GITHUB_ENV"
          echo "has_token=true" >> "$GITHUB_OUTPUT"
      - name: Auto-upload to YouTube
        id: yt
        if: steps.yt_token.outputs.has_token == 'true'
        continue-on-error: true
        run: |
          node shorts/upload.mjs ${{ inputs.channel }} "$SHORTS_STAMP"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"
      # longform-studio: the small metadata the user reviews (SEO description, tags, localizations, first
      # comment, growth plan) — always uploaded, never the video (local disk rule).
      - name: Upload studio meta (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-studio-meta-${{ github.run_id }}
          path: |
            docs/shorts/${{ inputs.channel }}/*/meta.json
            docs/shorts/${{ inputs.channel }}/*/growth_plan.json
          if-no-files-found: warn
      - name: Upload staged doc artifact (only if NOT uploaded)
        if: steps.yt.outputs.uploaded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.name }}-${{ env.SHORTS_STAMP }}
          path: docs/shorts/${{ inputs.channel }}/
          retention-days: 1
          if-no-files-found: warn
      - name: Purge staged output
        if: always()
        run: rm -rf docs/shorts/${{ inputs.channel }}/* || true
