# Copy the pipeline's GitHub secrets into the Modal Secret `longform-keys` (workspace pathakumashankar, env main) so the
# Modal doc lane (private tools/modal/longform_modal.py::doc) runs with the SAME keys as the cron. Manual only. Needs the
# repository secrets MODAL_TOKEN_ID / MODAL_TOKEN_SECRET (a Modal API token, Settings → API Tokens). Values never print.
name: modal-sync-secrets
on:
  workflow_dispatch:
    inputs:
      secret_name:
        default: longform-keys
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
      UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
      EUROPEANA_API_KEY: ${{ secrets.EUROPEANA_API_KEY }}
      WIKIMEDIA_BOT_USER: ${{ secrets.WIKIMEDIA_BOT_USER }}
      WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIMEDIA_BOT_PASSWORD }}
      OPENVERSE_CLIENT_ID: ${{ secrets.OPENVERSE_CLIENT_ID }}
      OPENVERSE_CLIENT_SECRET: ${{ secrets.OPENVERSE_CLIENT_SECRET }}
      DDG_PROXY_URL: ${{ secrets.DDG_PROXY_URL }}
      EDGE_TTS_RELAY_TOKEN: ${{ secrets.EDGE_TTS_RELAY_TOKEN }}
      EDGE_TTS_RELAY_URL: ${{ vars.EDGE_TTS_RELAY_URL }}
      RESEARCH_POD_ENDPOINT: ${{ secrets.RESEARCH_POD_ENDPOINT }}
      RESEARCH_POD_TOKEN: ${{ secrets.RESEARCH_POD_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the Modal CLI
        run: pip install --quiet modal
      - name: Create or overwrite the Modal Secret from every non-empty value
        run: |
          set -euo pipefail
          [ -n "$MODAL_TOKEN_ID" ] && [ -n "$MODAL_TOKEN_SECRET" ] || { echo "::error::MODAL_TOKEN_ID / MODAL_TOKEN_SECRET repository secrets are empty"; exit 1; }
          ARGS=(); NAMES=()
          for NAME in PRIVATE_REPO_TOKEN OLLAMA_API_KEY PEXELS_API_KEY PIXBAY_API_KEY UNSPLASH_ACCESS_KEY EUROPEANA_API_KEY \
                      WIKIMEDIA_BOT_USER WIKIMEDIA_BOT_PASSWORD OPENVERSE_CLIENT_ID OPENVERSE_CLIENT_SECRET DDG_PROXY_URL \
                      EDGE_TTS_RELAY_TOKEN EDGE_TTS_RELAY_URL RESEARCH_POD_ENDPOINT RESEARCH_POD_TOKEN HF_TOKEN \
                      UPSTASH_REDIS_REST_URL UPSTASH_REDIS_REST_TOKEN NEWS_INGEST_TOKEN; do
            VAL="${!NAME:-}"; [ -n "$VAL" ] || { echo "skip $NAME (empty)"; continue; }
            ARGS+=("$NAME=$VAL"); NAMES+=("$NAME")
          done
          modal secret create "${{ inputs.secret_name }}" "${ARGS[@]}" --force >/dev/null
          echo "synced ${#NAMES[@]} keys into Modal secret ${{ inputs.secret_name }}: ${NAMES[*]}"
      - name: Verify the secret is listed
        run: modal secret list | grep -F "${{ inputs.secret_name }}"
