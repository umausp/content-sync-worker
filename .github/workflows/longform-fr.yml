name: longform-fr

# Render a native-language French long-form recap for the @AgyataWorld channel — sourced,
# synthesised, voiced and captioned ENTIRELY IN FRENCH (no translation),
# then auto-uploaded PUBLIC to the FR playlist. TTS engine: kokoro. Nothing is
# committed to the repo; the staged output is purged after upload.
#
# CADENCE: agyata-cron-pinger workflow_dispatch. Public repo = free minutes.
on:
  workflow_dispatch: {}

concurrency:
  group: longform-fr
  cancel-in-progress: false

permissions:
  contents: read

env:
  MAGAZINE_DIVES: '5'
  MAGAZINE_DIVE_BEATS: 'hook,context,evidence,meaning,close'
  MAGAZINE_HEADLINES: '10'
  LONGFORM_CORPUS_CHARS: '32000'
  LONGFORM_DEEPEN_OUTLETS: '16'
  SHORTS_DEBUG: '1'
  LONGFORM_BEAT_SCALE: '1.8'   # deep-editorial length: ~10-12min ceiling (anti-padding fills only from real corpus)
  API_BASE: https://api.agyata.com
  SHORTS_PY: python
  SHORTS_ORIENTATION: landscape # 1920x1080, multi-story recap
  # PUBLIC + monetized (user: "make all native language crons at direct public with right
  # playlist"). build_short reads SHORTS_PRIVACY into meta.privacyStatus → upload.mjs sets it
  # on videos.insert, so the video is public the moment it's uploaded (no manual Studio flip).
  # A DEMONETIZATION GUARD (shorts/safety.mjs) drops policy-unsafe stories + masks strong
  # profanity/slurs before render, so going straight-to-public is monetization-safe.
  SHORTS_PRIVACY: public
  # Durable VIDEO-DEDUP ledger (Upstash Redis) — render reads (drop already-made stories),
  # upload writes after a successful publish. Keyed by channel label so fr is independent.
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  # ── LLM PROVIDER LADDER — the SAME shared router the news pipeline uses
  #    (src/providers.mjs), NVIDIA-first then the rest of the free tier, local Ollama last.
  #    A provider is skipped if its key is absent; fail-fast. This turns the raw article body
  #    into a clean, non-repetitive brief per story — synthesised IN THE CHANNEL'S LANGUAGE.
  PROVIDER_ORDER: 'gemini,sambanova,openrouter,groq,cohere,nvidia,mistral,gitmodels,hfspace,huggingface,huggingface1,deepinfra,deepinfra1,cerebras,openai,ollama'
  PROVIDER_USE_OLLAMA: '0'  # Gemini+free tiers carry every run; drop the 153s ollama install
  WM_RENDER_CLAIMS: '1' # Worldmodel graph-backed render (claims/divergence) — noise-filtered content
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  NVIDIA_MODEL: 'meta/llama-3.3-70b-instruct'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: 'gemini-flash-lite-latest'
  # LONGFORM VOICE → batched Gemini TTS (user 2026-07-31: French longform test on Gemini batch)
  SHORTS_TTS_BATCH: '1'                 # Gemini BATCH API (50% cheaper, gemini-3.1-flash-tts-preview)
  SHORTS_GEMINI_VOICE_FR: 'Charon'      # single-voice narrator (fr script → Gemini reads French)
  SHORTS_LONGFORM_HOSTS: '1'            # single voice (no handoff mute)
  SHORTS_LONGFORM_FORCE: '1'            # always build the single-story explainer
  SHORTS_ARTICLE_IMAGES_ONLY: '1'       # only real article photos, no stock/keyword search
  ALIGN_WHISPER_MODEL: 'tiny'           # fast caption alignment (avoids timeout)
  LONGFORM_MIN_BEATS: '6'
  SOMBANOVA_API_KEY: ${{ secrets.SOMBANOVA_API_KEY }}
  SAMBANOVA_MODEL: 'Meta-Llama-3.3-70B-Instruct'
  COHERA_API_KEY: ${{ secrets.COHERA_API_KEY }}
  COHERE_MODEL: 'command-r-08-2024'
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: 'openrouter/free'
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MISTRAL_MODEL: 'mistral-small-latest'
  GITMODELS_API_KEY: ${{ secrets.GITMODELS_API_KEY }}
  GITMODELS_MODEL: 'openai/gpt-4o-mini'
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: 'gpt-4o-mini'
  OPENAI_DAILY_CAP: '30'
  OLLAMA_MODEL: llama3.1:8b
  PROVIDER_HOSTED_TIMEOUT_MS: '60000'
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
  DEEPINFRA1_API_KEY: ${{ secrets.DEEPINFRA1_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF1_TOKEN: ${{ secrets.HF1_TOKEN }}
  HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
  HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Node deps
        run: npm ci --no-audit --no-fund

      - name: Install system deps (ffmpeg + librsvg + espeak-ng + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin espeak-ng fonts-dejavu fonts-noto-core fonts-noto-cjk fonts-noto-extra

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-py312-v1

      - name: Install Kokoro TTS deps
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet kokoro soundfile sentencepiece piper-tts faster-whisper edge-tts

      - name: Cache HuggingFace models (Kokoro)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-kokoro-fr-v1

      - name: Stamp
        run: echo "SHORTS_STAMP=lf-$(date -u +%Y%m%dT%H%M)" >> "$GITHUB_ENV"

      - name: Render French long-form recap
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          # Cross-run dedup: claim story keys via api.agyata.com before rendering so two
          # fr runs (a Short + a long-form in the same window) never publish the same story.
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
        run: node shorts/build_short.mjs fr

      # AUTO-UPLOAD to YouTube as PUBLIC (SHORTS_PRIVACY=public). Native channels are PLAYLISTS
      # on @AgyataWorld, so they authenticate with YT_REFRESH_TOKEN_WORLD and land in the FR
      # playlist (YT_PLAYLIST_FR). On success sets uploaded=true so the video is NOT also
      # published as a public artifact. Best-effort — never fails the run.
      - name: Auto-upload to YouTube (public)
        id: yt
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          # Own channel token if minted (YT_REFRESH_TOKEN_FR), else the @AgyataWorld token.
          YT_REFRESH_TOKEN_FR: ${{ secrets.YT_REFRESH_TOKEN_FR }}
          YT_REFRESH_TOKEN_WORLD: ${{ secrets.YT_REFRESH_TOKEN_WORLD }}
          YT_PLAYLIST_FR: ${{ secrets.YT_PLAYLIST_FR }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN_FR" ] && [ -z "$YT_REFRESH_TOKEN_WORLD" ]; then echo "no refresh token — skipping upload (artifact only)"; exit 0; fi
          node shorts/upload.mjs fr "$SHORTS_STAMP"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      # REVIEW COPY only — kept solely when the YouTube upload did NOT happen. On a PUBLIC repo
      # an artifact is publicly downloadable, so once the video is on YouTube we never publish
      # it here. 1-day retention even then.
      - name: Upload staged artifact (only if NOT uploaded to YouTube)
        if: steps.yt.outputs.uploaded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: longform-fr-${{ env.SHORTS_STAMP }}
          path: docs/shorts/fr/
          retention-days: 1
          if-no-files-found: warn

      # PURGE the rendered MP4 + metadata from the runner after upload — nothing rendered
      # lingers on GitHub. Always runs.
      - name: Purge staged output
        if: always()
        run: rm -rf docs/shorts/fr/* || true
