name: selfhosted-tts-probe
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    concurrency: { group: tts-eval, cancel-in-progress: false }
    steps:
      - name: Locate fish model and read card/config
        run: |
          set +e
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH"
          echo "user=$(id -un) free=$(df -h $HOME | awk 'NR==2{print $4}')"
          ls ~/.cache/huggingface/hub | grep -i -E 'fish|audio|tts|speech|kokoro|orpheus' 
          echo "--- lf-models"; ls ~/.cache/lf-models
          find ~ -maxdepth 4 -iname '*fish*' -not -path '*/Library/*' 2>/dev/null | head -20
          for d in ~/.cache/huggingface/hub/models--*fish*; do
            echo "=== $d"; du -shL "$d"
            find -L "$d/snapshots" -maxdepth 3 | head -40
            for f in README.md config.json LICENSE; do p=$(ls -d "$d"/snapshots/*/$f 2>/dev/null | head -1); [ -n "$p" ] && { echo "----- $f"; head -c 7000 "$p"; echo; }; done
          done
          echo "--- tools"; for c in uv python3.12 python3.11 ffmpeg ffprobe mlx_audio.generate; do printf '%-18s %s\n' $c "$(command -v $c || echo -)"; done
          ls ~/.local/share/uv/tools 2>/dev/null
          pip list 2>/dev/null | grep -i -E 'mlx|whisper|fish' 
          ls ~/.cache/huggingface/hub | grep -i whisper
      - name: Install mlx-audio into separate venv and print the real API
        run: |
          set +e
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH"
          V=$HOME/.local/share/uv/tools/tts-eval
          [ -x $V/bin/python ] || uv venv --python /opt/homebrew/bin/python3.12 $V
          uv pip install --python $V/bin/python -U "mlx-audio>=0.6.0" faster-whisper jiwer soundfile librosa numpy 2>&1 | tail -5
          $V/bin/python - <<'PY'
          import inspect, importlib, mlx_audio, sys
          print("python", sys.version.split()[0], "mlx_audio", getattr(mlx_audio,"__version__","?"))
          from importlib.metadata import version
          for p in ("mlx-audio","mlx","mlx-lm","transformers","faster-whisper"):
              try: print(p, version(p))
              except Exception as e: print(p, "?", e)
          import pkgutil, mlx_audio.tts.models as m
          print([x.name for x in pkgutil.iter_modules(m.__path__) if "fish" in x.name])
          mod = importlib.import_module("mlx_audio.tts.models.fish_drama3")
          print(dir(mod))
          for n in dir(mod):
              o=getattr(mod,n)
              if inspect.isclass(o) and hasattr(o,"generate"):
                  print(n, "generate", inspect.signature(o.generate))
          import mlx_audio.tts.utils as u; print("load_model", inspect.signature(u.load_model))
          PY
          curl -sL https://raw.githubusercontent.com/Blaizzy/mlx-audio/main/docs/models/tts/fish-drama3.md | head -c 9000
