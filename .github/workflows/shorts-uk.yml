name: shorts-uk

# Render ONE English Short for the @AgyataWorld channel (tier-1 audience) from the
# freshest global-interest story, then auto-upload it PUBLIC (SHORTS_PRIVACY=public),
# same as the native-language channels. The MP4 is purged from the runner after upload.
#
# CADENCE: driven by the agyata-cron-pinger Cloudflare Worker (workflow_dispatch),
# same as the news pipeline. Add a line to the pinger's WORKFLOWS to schedule it.
# Public repo = free minutes. Never on pull_request.
on:
  workflow_dispatch:
    inputs:
      category:
        description: 'SHORTS_CATEGORY_FILTER'
        required: false
        default: ''
      content_mode:
        description: 'CONTENT_MODE'
        required: false
        default: ''
      region:
        description: 'Target region for this run (usa | europe). Decides trend geos + playlist.'
        required: false
        default: ''

concurrency:
  # unique per run so same-workflow dispatches run in PARALLEL, never queue (user 2026-09-02)
  group: shorts-uk-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read # renders upload as artifacts (below), not committed to the repo

env:
  # ── CHATTERBOX TTS (Modal GPU) — natural voice, all channels (2026-08-30) ──
  # Fail-opens to the offline engine (kokoro/piper) on any Modal outage, so it can never drop a video.
  # SCOPED TEST (2026-09-01, user: "bring back english and hindi to edge tts... analyse and rate") — disabled
  # here so this channel actually runs the edge voice just pinned in config.mjs/channel-voices.json
  # instead of Chatterbox's tier-gate override (voice/chatterbox.mjs treats hi/en as a "PROVEN
  # dedicated variant" and would otherwise take over regardless of this flag). Revert: '1'.
  CHATTERBOX_TTS: '0'
  CHATTERBOX_ENDPOINT: ${{ secrets.CHATTERBOX_ENDPOINT }}
  CHATTERBOX_TOKEN: ${{ secrets.CHATTERBOX_TOKEN }}
  CBX_QC: '1'   # QC safety net: ASR-verify Chatterbox beats, fail-open on persistent gibberish (es/pt/EN only; bharat excluded, 2026-08-31)
  CBX_QC_RESCUE: '1'   # content-fix rescue (3b): on a persistent ASR mismatch, ask Ollama Cloud gemma4:31b for a targeted respelling before giving up (2026-08-31)
  SHORTS_FOLEY: '1'   # diegetic foley — event-synced $0/CPU SFX, fail-open (rolled out to all shorts 2026-08-06)
  # ── CINEMATIC ENGINE (setup_cinematic.sh provisions the models; all fail-open) ──
  SHORTS_CINEMATIC: '1'
  # ROLLED BACK 2026-08-28 (user: distorted first frames + shorts landing 20-30s, not 45-60s) —
  # render.mjs now uses a plain left-right slide pan (media/window.mjs) for every still; DOF and
  # SPATIAL_GFX below are sub-gated on SHORTS_DEPTH_3D and go inert with it.
  SHORTS_DEPTH_3D: '0'
  SHORTS_DEPTH_OCCLUSION: '0'
  SHORTS_SPATIAL_GFX: '0'   # story-keyword graphic behind the matted subject (occlusion route); fail-open, $0. render.mjs auto-wiring landed (shorts/visual/spatial_keyword.mjs).
  DEPTH_MODEL: /tmp/models/depth_anything_v2_vits.onnx
  MATTE_MODEL: /tmp/models/u2net.onnx
  DEPTH_SIZE: '392'
  DEPTH_CACHE_DIR: /tmp/agyata-depth
  MATTE_CACHE_DIR: /tmp/agyata-matte
  PARALLAX_CACHE_DIR: /tmp/agyata-parallax
  DEPTH_MAX_IMAGES: '12'
  MATTE_MAX_IMAGES: '12'
  DEPTH_BUDGET_MS: '20000'
  MATTE_BUDGET_MS: '20000'
  DEPTH_THREADS: '2'
  MATTE_THREADS: '2'
  OCCLUSION_MAX_PER_CLIP: '4'
  ASSEMBLE_CONCURRENCY: '2'
  SHORTS_DEBUG: '1'
  # FLEET ROLLOUT (2026-09-01, user: "this is much better beats. lets use this longer beats to
  # all channels now" — after a real render, omFdA_kpEdw, confirmed the deep-tier 150-180s/6-beat
  # micro-arc works well). Still gated per-story by isDepthWorthy (research_script.mjs) — a thin
  # story ships at today's normal length regardless of this flag, only a story with enough real
  # material gets the longer treatment.
  SHORTS_LONG_MICROARC: '1'
  LONGFORM_RAG_TRACE: '1'
  SHORTS_CATEGORY_FILTER: ${{ github.event.inputs.category }}
  CONTENT_MODE: ${{ github.event.inputs.content_mode }}
  API_BASE: https://api.agyata.com
  SHORTS_PY: python # the workflow's venv python (set on PATH below)
  # PUBLIC + monetized — English (@AgyataWorld) publishes live like the native channels
  # (was 'unlisted' by default). build_short reads SHORTS_PRIVACY into meta.privacyStatus →
  # upload.mjs sets it on videos.insert, so the Short is public the moment it uploads (no
  # manual Studio flip). The shorts/safety.mjs demonetization guard runs first, so
  # straight-to-public is monetization-safe.
  SHORTS_PRIVACY: public
  # Durable VIDEO-DEDUP ledger (Upstash Redis) — the renderer's OWN "already made a video of
  # this story?" memory, separate from the website's CF news_dedup_claims. Render step reads
  # it (drop already-published stories); upload step writes it after a successful upload.
  UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
  UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
  # AUTHENTICATED WIKIMEDIA SESSION (2026-09-02, user created a bot account specifically for
  # this: "we have 200 request/sec limit, use it"). Fail-open: unset/wrong and every entity-
  # image call proceeds exactly as before this existed (anonymous, same as today).
  WIKIMEDIA_BOT_USER: ${{ secrets.WIKIMEDIA_BOT_USER }}
  WIKIMEDIA_BOT_PASSWORD: ${{ secrets.WIKIMEDIA_BOT_PASSWORD }}
  # ── LLM PROVIDER LADDER — the SAME shared router the news pipeline uses
  #    (src/providers.mjs), NVIDIA-first then the rest of the free tier, local Ollama
  #    last (user: "use AI model with NVidia following others and fallback to ollama").
  #    shorts/llm.mjs is now a thin adapter over it. A provider is skipped if its key is
  #    absent; fail-fast (one try/provider, bench on failure, never retry). This is what
  #    turns the raw article body into a clean, non-repetitive brief per story. ──
  PROVIDER_ORDER: 'ollama,cerebras,openrouter,sambanova,nvidia,cohere,mistral,gitmodels,huggingface,huggingface1'
  SHORTS_RESEARCH_BUNDLE: '0'  # research-world cron is paused (video-only) → bundle is stale; live-gather (multiSource) instead
  PROVIDER_USE_OLLAMA: '1'  # Ollama Cloud primary (user 2026-08-03: ollama first, free tiers fallback)
  WM_RENDER_CLAIMS: '1' # Worldmodel: extract claims into the render (Beat 5 divergence, source-meter consensus, groundedness). Gemini 2.0 Flash paid.
  NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
  NVIDIA_MODEL: 'meta/llama-3.3-70b-instruct'
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
  GEMINI_MODEL: 'gemini-flash-lite-latest'
  SOMBANOVA_API_KEY: ${{ secrets.SOMBANOVA_API_KEY }}
  SAMBANOVA_MODEL: 'Meta-Llama-3.3-70B-Instruct'
  COHERA_API_KEY: ${{ secrets.COHERA_API_KEY }}
  COHERE_MODEL: 'command-r-08-2024'
  OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
  OPENROUTER_MODEL: 'openrouter/free' # auto-router to a free model — immune to model-ID rot
  MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
  MISTRAL_MODEL: 'mistral-small-latest'
  GITMODELS_API_KEY: ${{ secrets.GITMODELS_API_KEY }}
  GITMODELS_MODEL: 'openai/gpt-4o-mini'
  GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  OPENAI_MODEL: 'gpt-4o-mini'
  OPENAI_DAILY_CAP: '30'
  OLLAMA_MODEL: ${{ secrets.OLLAMA_MODEL || 'gpt-oss:120b' }}  # switched from deepseek-v4-flash:cloud (dropped off live tag list, #10 model-ID rot; user 2026-08-09)
  OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
  SHOWRUNNER: '1'  # late-night-show rewrite pass (Stage 1b, enabled 2026-08-29 after real-render verification)
  OLLAMA_MAX_TRIES: '6'
  PROVIDER_HOSTED_TIMEOUT_MS: '60000'
  CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
  DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
  DEEPINFRA1_API_KEY: ${{ secrets.DEEPINFRA1_API_KEY }}
  COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
  HF_TOKEN: ${{ secrets.HF_TOKEN }}
  HF1_TOKEN: ${{ secrets.HF1_TOKEN }}
  HF_SPACE_URL: ${{ secrets.HF_SPACE_URL }}
  HF_SPACE_TOKEN: ${{ secrets.HF_SPACE_TOKEN }}

jobs:
  render:
    runs-on: ubuntu-latest
    # Cron fires every ~2h, so there's no contention — give the render room to finish.
    # A Short is 1 story but the run still does: apt deps + Kokoro install + (cold) Ollama
    # pull + multi-source extraction/synth + ffmpeg. 20m was clipping cold runs; 40m means
    # once it starts it finishes. cancel-in-progress:false → only this ceiling can kill it.
    # BUMPED 40->60 (2026-09-01, fleet rollout of SHORTS_LONG_MICROARC): a deep-tier 6-beat/150-180s
    # micro-arc needs more render wall-time than the 3-beat/45-90s baseline this 40min budget was
    # sized for.
    timeout-minutes: 60
    steps:
      - name: Checkout private pipeline code
        uses: actions/checkout@v4
        with:
          repository: umausp/agyata-pipeline-private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          persist-credentials: true

      # ── SHARED SETUP (perf): node+npm, apt+fonts, python+pip cache, cinematic ONNX provisioning,
      # + the ONNX model-WEIGHTS cache — ONE composite action (private repo; resolves after the
      # checkout above). Replaces the per-channel setup; all deps preserved verbatim as inputs.
      - name: Render setup (cached)
        uses: ./.github/actions/render-setup
        with:
          tts-pip: 'kokoro soundfile sentencepiece faster-whisper edge-tts'
          apt-packages: 'ffmpeg librsvg2-bin espeak-ng fonts-dejavu fonts-noto-core fonts-noto-cjk fonts-noto-extra'
          voice-cache-path: '~/.cache/huggingface'
          voice-cache-key: 'hf-kokoro-m2m100-v1'

      - name: Restore cinematic ONNX depth/matte maps + parallax clips (shared across ALL channels/runs)
        if: env.SHORTS_DEPTH_3D == '1'
        id: cinematic-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            /tmp/agyata-depth
            /tmp/agyata-matte
            /tmp/agyata-parallax
          key: cinematic-maps-${{ runner.os }}-v1

      - name: Stamp
        run: echo "SHORTS_STAMP=$(date -u +%Y%m%dT%H%M)" >> "$GITHUB_ENV"

      - name: Render English Short
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXBAY_API_KEY: ${{ secrets.PIXBAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HUGGING_FACE_HUB_TOKEN: ${{ secrets.HF_TOKEN }}
          # Region (usa | europe) chosen by the cron-pinger; blank on a manual run → the
          # renderer falls back to wall-clock alternation.
          WORLD_REGION: europe
          # Cross-run dedup: the renderer claims story keys via api.agyata.com before
          # rendering so overlapping runs never publish the same story. Same token as ingest.
          NEWS_INGEST_TOKEN: ${{ secrets.NEWS_INGEST_TOKEN }}
        run: node shorts/build_short.mjs uk

      # AUTO-UPLOAD to YouTube as UNLISTED (privacyStatus in the meta). Runs only when
      # the channel's refresh token secret is set — until then the render just produces
      # the artifact below. Never fails the run if upload errors (best-effort). On success
      # it sets uploaded=true so the steps below DON'T publish the video as a public
      # artifact (user: "don't keep the results on public github, delete after upload").
      - name: Auto-upload to YouTube (public)
        id: yt
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN_UK: ${{ secrets.YT_REFRESH_TOKEN_UK }}
          # Region → playlist (user: USA news → USA playlist, Europe news → Europe playlist).
          # YT_PLAYLIST_ENGLISH is the single catch-all World playlist used when a region-
          # specific one isn't set (user added it); USA/EUROPE take precedence when present.
          YT_PLAYLIST_ENGLISH: ${{ secrets.YT_PLAYLIST_ENGLISH }}
          YT_PLAYLIST_USA: ${{ secrets.YT_PLAYLIST_USA }}
          YT_PLAYLIST_EUROPE: ${{ secrets.YT_PLAYLIST_EUROPE }}
        # Skip cleanly if the token isn't set (env is allowed in `if`; `secrets` is not).
        run: |
          if [ -z "$YT_REFRESH_TOKEN_UK" ]; then echo "no refresh token — skipping upload (artifact only)"; exit 0; fi
          node shorts/upload.mjs uk "$SHORTS_STAMP"
          echo "uploaded=true" >> "$GITHUB_OUTPUT"

      # ARTIFACT is a REVIEW COPY only — kept solely when the YouTube upload did NOT happen
      # (no token yet, or upload errored). On a PUBLIC repo an artifact is publicly
      # downloadable, so once the video is safely on YouTube (public) we never publish it
      # here. 1-day retention even then (user: delete the results, don't keep them around).
      - name: Upload staged Short artifact (only if NOT uploaded to YouTube)
        if: steps.yt.outputs.uploaded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: short-uk-${{ env.SHORTS_STAMP }}
          path: docs/shorts/uk/
          retention-days: 1
          if-no-files-found: warn

      # PURGE the rendered MP4 + metadata from the runner workspace after upload — nothing
      # rendered ever lingers on GitHub (repo or artifact). Always runs.
      - name: Save cinematic ONNX depth/matte maps + parallax clips (grows the shared cache for every channel)
        if: always() && env.SHORTS_DEPTH_3D == '1'
        uses: actions/cache/save@v4
        with:
          path: |
            /tmp/agyata-depth
            /tmp/agyata-matte
            /tmp/agyata-parallax
          key: cinematic-maps-${{ runner.os }}-v1
      - name: Purge staged output
        if: always()
        run: rm -rf docs/shorts/uk/* || true
