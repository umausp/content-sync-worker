version: 2.1
jobs:
  probe:
    parameters:
      rc: {type: string}
    docker:
      - image: cimg/node:22.12
    resource_class: << parameters.rc >>
    steps:
      - run: nproc && free -g | head -2
workflows:
  probe:
    jobs:
      - probe: {name: d-2xlargeplus, rc: 2xlarge+}
      - probe: {name: d-2xlarge, rc: 2xlarge}
      - probe: {name: d-xlarge, rc: xlarge}
      - probe: {name: d-large, rc: large}
